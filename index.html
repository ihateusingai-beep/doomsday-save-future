        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x - 3.5 * HEAVY_SCALE, b.y - 6 * HEAVY_SCALE, 7 * HEAVY_SCALE, 12 * HEAVY_SCALE);
        if (!ok) {
          ctx.fillStyle = '#f96';
          ctx.fillRect(b.x - 3 * HEAVY_SCALE, b.y - 6 * HEAVY_SCALE, 6 * HEAVY_SCALE, 12 * HEAVY_SCALE);
        }
        ctx.restore();
      } else if (!drawPlayerBulletSprite('anim_bullet_p', 'bullet_p', b.x, b.y, 1.4)) {
        ctx.fillStyle = '#0ff';
        ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
      }
    }
  }
  for (const e of enemies) {
    if (e._dead) continue;
    if (e.kind === 'grunt') {
      /* pxl：role 決定 sprite；失敗回退三角 */
      const frac = clamp(e.hp / (e.maxHp || 1), 0, 1);
      let spr = 'grunt', scale = e.mini ? 1.2 : 1.55, R = e.mini ? 6 : 8;
      let anim = null;   /* 有動畫幀嘅家族填 anim 名 */
      if (e.elite) { spr = 'elite'; scale = 2.0; R = 12; anim = 'anim_elite'; }
      else if (e.diving) { spr = 'dive'; scale = 1.7; R = 9; }
      else if (e.sniper) { spr = 'sniper'; scale = 1.75; R = 9; }
      else if (e.shield) { spr = 'shield_e'; scale = 1.9; R = 11; }
      else if (e.swarm) { spr = 'swarm'; scale = 1.6; R = 8; }
      /* v3.13 #71 新敵人：而家有專屬 base sprite（之前係重色 grunt/swarm/shield_e，
         剪影完全一樣 → 玩家分唔出，VISUAL_QUALITY_RUBRIC.md §5.4 判 V2 剪影 6/10）。
         新 sprite：splitter 六角（左右對稱 + 中心裂縫）· rammer 楔形（撞角朝下）
         · lancer 長條（槍管極瘦高）。程序特徵保留，強化 3 秒可辨識。 */
      else if (e.splitter) { spr = 'splitter'; scale = 1.7; R = 9; }
      else if (e.rammer) { spr = 'rammer'; scale = 1.5; R = 8; }
      else if (e.lancer) { spr = 'lancer'; scale = 1.9; R = 10; }
      /* v0.26.0 #97 新敵人：同樣有專屬 base sprite（剪影要 3 秒認得出）。
         medic 綠環 · chaser 紅十字翼 · bomber 尖刺球 · turret 闊身炮台。 */
      else if (e.medic) { spr = 'medic'; scale = 1.8; R = 9; }
      else if (e.chaser) { spr = 'chaser'; scale = 1.7; R = 9; }
      else if (e.bomber) { spr = 'bomber'; scale = 1.7; R = 9; }
      else if (e.turret) { spr = 'turret'; scale = 1.6; R = 11; }
      if (!anim && spr === 'grunt') anim = 'anim_grunt';
      /* v3.8 #45 雜魚小詞綴：sprite 外圍加一圈色環（唔改 sprite 本身，
         免得同一個 sprite 變到認唔出）。 */
      if (e.minorTint) {
        ctx.strokeStyle = e.minorTint;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y, R + 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      const drawn = anim
        ? drawSpriteAnim(anim, spr, e.x, e.y, scale, animT)
        : drawSprite(spr, e.x, e.y, scale);
      if (!drawn) {
        ctx.fillStyle = e.elite ? (frac > 0.4 ? '#ffd54a' : '#ff9a3c')
          : e.sniper ? '#6cf' : e.shield ? '#4af' : e.swarm ? '#6f6'
          : e.diving ? (frac > 0.4 ? '#ff9a4a' : '#ff6a30')
          : (frac > 0.4 ? '#ff9ec4' : '#ff6f9c');
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + R);
        ctx.lineTo(e.x - R * 0.85, e.y - R * 0.7);
        ctx.lineTo(e.x + R * 0.85, e.y - R * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffd0e4';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      /* v0.29.1：中彈白閃（hitFlash 1→0；只畫 overlay） */
      if (e.hitFlash > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.7, e.hitFlash * 0.65);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(e.x, e.y, R + 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      /* ---- v3.11 #71 新敵人程序特徵（零新資產檔，全部用 canvas 畫） ---- */
      /* splitter：菱形裂紋 —— 見到就知「死咗會爆」 */
      if (e.splitter) {
        ctx.strokeStyle = '#ffa53c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y - R);
        ctx.lineTo(e.x + R * 0.8, e.y);
        ctx.lineTo(e.x, e.y + R);
        ctx.lineTo(e.x - R * 0.8, e.y);
        ctx.closePath();
        ctx.moveTo(e.x - R * 0.35, e.y - R * 0.4);
        ctx.lineTo(e.x + R * 0.35, e.y + R * 0.4);
        ctx.stroke();
      }
      /* rammer：速度線（越接近撞擊越長）—— 見到就知「要閃」 */
      if (e.rammer) {
        const sp = Math.hypot(e.vx, e.vy) || 0.02;
        const len = Math.min(26, sp * 70);
        const ux = e.vx / sp, uy = e.vy / sp;
        ctx.strokeStyle = '#ff5a4a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(e.x - ux * len, e.y - uy * len);
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
        /* 鎖定預警：未開火時畫虛線指向機身 */
        if (e.ramWarnMs > 0 && ship) {
          ctx.strokeStyle = 'rgba(255,120,90,0.55)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 5]);
          ctx.beginPath();
          ctx.moveTo(e.x, e.y);
          ctx.lineTo(ship.x, ship.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      /* lancer：預警 / 光束 —— 垂直柱 + 底部發光口 */
      if (e.lancer) {
        if (e.beamWarnMs > 0) {
          const pulse = 0.35 + 0.45 * Math.sin(performance.now() / 70);
          ctx.strokeStyle = 'rgba(180,120,255,' + pulse.toFixed(2) + ')';
          ctx.lineWidth = LANCER_BEAM_DW * 0.5;
          ctx.beginPath();
          ctx.moveTo(e.x, e.y + R);
          ctx.lineTo(e.x, VIEW_H);
          ctx.stroke();
        } else if (e.beamFireMs > 0) {
          ctx.strokeStyle = 'rgba(210,150,255,0.85)';
          ctx.lineWidth = LANCER_BEAM_DW;
          ctx.beginPath();
          ctx.moveTo(e.x, e.y + R);
          ctx.lineTo(e.x, VIEW_H);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.lineWidth = LANCER_BEAM_DW * 0.35;
          ctx.beginPath();
          ctx.moveTo(e.x, e.y + R);
          ctx.lineTo(e.x, VIEW_H);
          ctx.stroke();
        }
      }

      /* ---- v0.26.0 #97 新敵人程序特徵（令玩家 3 秒認得出 + 睇得明危險）---- */
      /* 醫護：治療嗰刻閃一圈綠光 + 範圍圈（見到圈就知佢醫緊邊啲） */
      if (e.medic) {
        ctx.strokeStyle = 'rgba(90,255,150,0.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, MEDIC_HEAL_R * 0.42, 0, Math.PI * 2);
        ctx.stroke();
        if (e.healFlash > 0) {
          ctx.strokeStyle = 'rgba(160,255,200,' + e.healFlash.toFixed(2) + ')';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(e.x, e.y, R + 6 + (1 - e.healFlash) * 10, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      /* 追蹤：指向玩家嘅虛線（見到就知佢一直喺度追你） */
      if (e.chaser && ship) {
        ctx.strokeStyle = 'rgba(255,90,90,0.35)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 5]);
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(ship.x, ship.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      /* 自爆：越接近玩家，警告圈越亮越大（公平提示：走位就避得開） */
      if (e.bomber && ship) {
        const d = Math.hypot(ship.x - e.x, ship.y - e.y);
        const near = clamp(1 - (d - BOMBER_TRIGGER_R) / 60, 0, 1);
        if (near > 0.02) {
          const pulse = 0.35 + 0.65 * Math.abs(Math.sin(performance.now() / (60 + near * 90)));
          ctx.strokeStyle = 'rgba(255,90,40,' + (near * pulse).toFixed(2) + ')';
          ctx.lineWidth = 1.5 + near * 2;
          ctx.beginPath();
          ctx.arc(e.x, e.y, R + 4 + near * 8, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      /* 炮台：護盾環（藍色，越薄越暗 —— 見到就知要再打多一下） */
      if (e.turret && e.turretShield > 0) {
        const sf = clamp(e.turretShield / TURRET_SHIELD, 0, 1);
        ctx.strokeStyle = 'rgba(90,170,255,' + (0.25 + sf * 0.55).toFixed(2) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, R + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      /* 狙擊預警線 */
      if (e.sniper && e.warnMs > 0) {
        const pulse = 0.45 + 0.55 * Math.sin(performance.now() / 80);
        ctx.strokeStyle = 'rgba(255,220,60,' + pulse.toFixed(2) + ')';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.warnTx, e.warnTy);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      /* 護盾弧 */
      if (e.shield && e.shieldOn) {
        ctx.strokeStyle = 'rgba(80,200,255,0.75)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y + 2, R + 3, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();
      }
      if (e.elite || e.shield || e.sniper) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(e.x - 14, e.y - R - 10, 28, 3);
        ctx.fillStyle = frac > 0.4 ? (e.sniper ? '#6cf' : e.shield ? '#4af' : '#ffd54a') : '#ff6b3c';
        ctx.fillRect(e.x - 14, e.y - R - 10, 28 * frac, 3);
        if (e.elite) {
          ctx.strokeStyle = 'rgba(255,220,120,0.55)';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(e.x, e.y, R + 4, 0, Math.PI * 2); ctx.stroke();
        }
      } else if (frac < 0.99) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - 8, e.y - R - 5, 16, 2);
        ctx.fillStyle = e.swarm ? '#8f8' : e.diving ? '#ffc090' : '#ffc8dd';
        ctx.fillRect(e.x - 8, e.y - R - 5, 16 * frac, 2);
      }
      if (e.label) {
        ctx.fillStyle = e.sniper ? '#9ef' : e.shield ? '#8cf' : e.swarm ? '#afa' : '#ffe9a8';
        ctx.font = 'bold 9px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + R + 11);
      }
    } else if (e.kind === 'bullet') {
      /* 預警線（pending aim / 短 warn spray） */
      if (e.warnMs > 0 && (e.pending || e.warnFromX != null)) {
        const pulse = 0.4 + 0.5 * Math.sin(performance.now() / 70);
        ctx.strokeStyle = 'rgba(255,210,50,' + pulse.toFixed(2) + ')';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(e.warnFromX != null ? e.warnFromX : e.x, e.warnFromY != null ? e.warnFromY : e.y);
        ctx.lineTo(e.warnTx != null ? e.warnTx : e.x, e.warnTy != null ? e.warnTy : e.y + 120);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (e.pending) {
        /* 未發射：細點提示 */
        ctx.fillStyle = 'rgba(255,220,80,0.8)';
        ctx.beginPath(); ctx.arc(e.x, e.y, 2.5, 0, Math.PI * 2); ctx.fill();
      } else if (e.split) {
        ctx.fillStyle = '#fa6';
        ctx.beginPath(); ctx.arc(e.x, e.y, 2.2, 0, Math.PI * 2); ctx.fill();
      } else if (e.sniperShot) {
        ctx.fillStyle = '#8ff';
        ctx.fillRect(e.x - 1.5, e.y - 3, 3, 6);
      } else if (!drawSpriteAnim('anim_bullet_e', 'bullet_e', e.x, e.y, 1.2, animT)) {
        ctx.fillStyle = '#f6c';
        ctx.fillRect(e.x - 2, e.y - 2, 4, 4);
      }
    } else if (e.kind === 'spiral') {
      if (!drawSpriteAnim('anim_boss', 'boss', e.x, e.y, 2.6, animT)) {
        ctx.fillStyle = '#f06';
        ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, Math.PI * 2); ctx.fill();
      }
      if (e.hitFlash > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.65, e.hitFlash * 0.55);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(e.x, e.y, 16, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      const totalHp = e.maxHp || STAGE_TABLE[e.stage || lastStage].bossHp;
      const hpFrac = Math.max(0, Math.min(1, e.hp / totalHp));
      /* v0.30.0 #113：血條由 e.y − 24 改成 **e.y − 18**（貼住 sprite 頂部）。
         boss body 頂 = e.y − 13（12×10 sprite @scale 2.6 → 半高 13），
         血條高 5 → 底 = e.y − 13 剛好貼實。
         ⚠️ 原本 y − 24 → 血條 y 26–91，而頂部 HUD 中央帶由 y 6 蓋到 y 67
            → boss 行到中心時血條被「節奏 chip / 擦彈條」蓋住，
              學生睇唔到 boss 血量變化。而家血條 y 32–87，完全喺 HUD 帶（≤31）之下。 */
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - 18, e.y - 18, 36, 5);
      ctx.fillStyle = hpFrac > 0.5 ? '#0f6' : (hpFrac > 0.25 ? '#ff6' : '#f06');
      ctx.fillRect(e.x - 18, e.y - 18, 36 * hpFrac, 5);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(e.x - 18, e.y - 18, 36, 5);
      if ((e.pattern === 'E' || e.pattern === 'D') && e.laserWarn !== undefined && e.laserWarn > 0 && !e.laserFiring) {
        ctx.strokeStyle = '#ff6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, 22, 0, Math.PI * 2); ctx.stroke();
      }
      if (e.label) {
        ctx.fillStyle = '#fff';
        ctx.font = '9px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + 30);
      }
    } else if (e.kind === 'laser') {
      if (!drawSprite('laser', e.x, e.y, 1.5)) {
        ctx.fillStyle = '#ff0';
        ctx.fillRect(e.x - 3, e.y - 3, 6, 6);
      }
      ctx.strokeStyle = 'rgba(255,220,0,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x - e.vx * 60, e.y - e.vy * 60);
      ctx.stroke();
    }
  }
  if (ship) {
    /* v0.26.0 #93 D 機衛星：兩粒跟機衛星（程序化菱形，零新資產檔） */
    if (ship.chassis === 'D' && ship._sats) {
      for (const s of ship._sats) {
        ctx.fillStyle = '#7dff9a';
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - 4);
        ctx.lineTo(s.x + 3, s.y);
        ctx.lineTo(s.x, s.y + 4);
        ctx.lineTo(s.x - 3, s.y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#0a3a20';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    /* 推進器焰 */
    const thName = (Math.floor(performance.now() / 80) % 2) ? 'thrust_1' : 'thrust_0';
    const shipScale = 2.1 * shipPop;
    drawSprite(thName, ship.x, ship.y + 12 * shipPop, 1.6 * shipPop);
    if (ship.shield > 0) {
      ctx.strokeStyle = 'rgba(0,255,255,' + (0.35 + 0.25*Math.sin(performance.now()/120)).toFixed(2) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 13 * shipPop, 0, Math.PI * 2); ctx.stroke();
    }
    const sn = SHIP_SPRITE[ship.chassis] || 'ship_a';
    /* v0.29.0：i-frame blink（55ms 半透明）+ shipPop squash scale */
    const prevA = ctx.globalAlpha;
    if (isIFramed()) {
      const on = (Math.floor(performance.now() / 55) % 2) === 0;
      ctx.globalAlpha = on ? 1 : 0.28;
    }
    /* v3.13：ship_a 有動畫幀（引擎閃爍），其他機體靜態（anim 冇對應就自動退化） */
    const drawnShip = ship.chassis === 'A'
      ? drawSpriteAnim('anim_ship_a', sn, ship.x, ship.y, shipScale, animT)
      : drawSprite(sn, ship.x, ship.y, shipScale);
    if (!drawnShip) {
      ctx.fillStyle = '#0ff';
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 8 * shipPop);
      ctx.lineTo(ship.x - 6 * shipPop, ship.y + 6 * shipPop);
      ctx.lineTo(ship.x + 6 * shipPop, ship.y + 6 * shipPop);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = prevA;
    if (isSkillActive()) {
      ctx.strokeStyle = 'rgba(255,255,0,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 15 * shipPop, 0, Math.PI * 2); ctx.stroke();
    }
    if (isIFramed()) {
      ctx.strokeStyle = 'rgba(255,100,200,' + (0.35 + 0.25 * Math.sin(performance.now() / 40)).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 18 * shipPop, 0, Math.PI * 2); ctx.stroke();
    }
    /* v0.26.0 #94 通用技能生效中：機身外圍一圈紫光，
       令玩家知道「而家通用技能係開嘅」。 */
    if (isUniversalActive()) {
      ctx.strokeStyle = 'rgba(190,120,255,0.65)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 21, 0, Math.PI * 2); ctx.stroke();
    }
  }
  /* ---------- P1-6 擦彈視覺反饋 ---------- */
function drawGrazeFx() {
  /* 光環：由擦彈點向外擴散並淡出 */
  if (grazeRingT > 0) {
    const t = grazeRingT;
    ctx.strokeStyle = 'rgba(130,255,220,' + (t * 0.75).toFixed(3) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(grazeRingX, grazeRingY, grazeRadius() * (1 - t) + 3, 0, Math.PI * 2);
    ctx.stroke();
  }
  /* 判定圈：淡淡的虛線提示，令玩家知道「呢個圈入面有分」 */
  if (ship && isStage(fsm.cur)) {
    ctx.strokeStyle = 'rgba(130,255,220,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, grazeRadius(), 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawGrazeMeter() {
  if (!ship || !isStage(fsm.cur)) return;
  /* v0.26.0 #95：能量條由**底部中央搬到頂部**——
     底部中央而家俾「中下通用技能掣」（x 128–192, y 408–472）霸咗，
     條擺喺底部會被掣蓋住。
     新位置：頂部中央，喺「關卡+節奏」合併行（y 3–15）之下。
     v0.30.0 #113：條由 y 62 → **y 27**、文字 baseline 由 58 → **24** ——
     原本條頂到 y 67，而 boss 血條最低去到 y 26，兩者會撞
     （HUD 蓋住 boss 血量，學生睇唔到 boss 點死）。而家頂部中央帶只到 y 31。 */
  const w = 84, h = 5;
  const x = (VIEW_W - w) / 2, y = 27;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(x, y, w, h);
  const f = clamp(grazeEnergy / GRAZE_ENERGY_NEED, 0, 1);
  ctx.fillStyle = f >= 1 ? '#ffffff' : '#4df5d0';
  ctx.fillRect(x, y, w * f, h);
  ctx.strokeStyle = grazeFlash > 0
    ? 'rgba(255,255,255,' + (0.4 + grazeFlash * 0.6).toFixed(2) + ')'
    : 'rgba(130,255,220,0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#8ff';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('擦彈 ' + grazeCount + '　' + (GRAZE_ENERGY_NEED - grazeEnergy) + ' 次回充', VIEW_W / 2, y - 4);
}

  drawAbilityBtns();
  drawHudChips();
  drawGrazeFx();
  drawGrazeMeter();
  drawPauseBtn();
  /* v0.30.0 #113：關卡名標籤**搬咗入 drawHudChips()**，同節奏狀態合併成一行
     （原本喺呢度獨立畫 y 6–22，令頂部中央蓋到 y 67，boss + 血條喺底下睇唔到）。
     見 PLAN #113 同 drawHudChips() 入面嘅合併行。 */
  drawStageAffixFx();       /* v3.8 #43：詞綴橫幅 + 停電暗幕 */
  /* v0.27.0 #105：元素屏幕效果（火焰 vignette / 結冰覆蓋 / 雷閃 / 光爆 / 暗幕）。
     ⚠️ 畫喺遊戲層之上、HUD 之下 —— 玩家要見到效果，但唔可以蓋住讀數。 */
  drawScreenFx();
  renderTail();
}

/* ---------- 12. 主迴圈（PLAN v2 #13 固定時間步累加器） ---------- */
let lastFrame = performance.now();
let accMs = 0;
function loop(nowMs) {
  let dt = nowMs - lastFrame;
  if (dt > MAX_FRAME_MS) dt = MAX_FRAME_MS;       /* cap huge gap (e.g., un-blur) */
  lastFrame = nowMs;
  accMs += dt;
  while (accMs >= FIXED_DT_MS) {
    /* v0.29.0 hit-stop：sim 凍結（丟棄累加步），VFX／cam 仍用 real-time 衰減，render 繼續 */
    if (nowMs < hitStopUntil) {
      updateCam(FIXED_DT_MS);
      if (shipPop > 1) shipPop = Math.max(1, shipPop - FIXED_DT_MS * 0.0045);
      if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - FIXED_DT_MS * 0.0022);
      accMs -= FIXED_DT_MS;
      continue;
    }
    tickVfx(FIXED_DT_MS);
    tick(FIXED_DT_MS);
    accMs -= FIXED_DT_MS;
  }
  /* HUD 計時：只在 STAGE_n 行進（全局累計；暫停／選擇強化靠平移錨點凍結） */
  if (isStage(fsm.cur) && runStartMs) {
    const sec = (nowMs - runStartMs) / 1000;
    hudEl.time.textContent = `時間：${sec.toFixed(1)} 秒`;
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 13. 初始設定 ---------- */
hudEl.state.textContent = `狀態：${stateLabel(fsm.cur)}`;
console.log('[啟動] 末日救未來 v0.33.0 已載入');
console.log('[啟動] 初始狀態 =', stateLabel(fsm.cur), '· 難度', diffName());
console.log('[啟動] 視窗 =', window.innerWidth, 'x', window.innerHeight, '· 像素比 =', window.devicePixelRatio, '· 開發者模式 =', DEBUG, '· 無敵 =', GOD);
loadAudioPrefs();   /* v3.9 #52：讀音效偏好。⚠️ 唔會建立 AudioContext（#56），只係讀數值 */
console.log('[啟動] 音效 =', audioOn ? '開' : '關', '· 音樂檔', volBgm, '· 音效檔', volSfx);
hudEl.tip.textContent = '點擊畫面開始';
requestAnimationFrame(loop);

/* 開放俾瀏覽器冒煙測試（主控台：window.__dsf.fsm.cur） */
window.__dsf = {
  fsm, bullets, enemies, shipS: SHIPS, stageS: STATE, InputState, SPRITE,
  get ship(){ return ship; },
  sheetReady: () => sheetReady, drawSprite, enterPause, resumePause,
  pauseReason: () => pauseReason, D, diffId: () => diffId, setDifficulty,
  pickShipAndStart, hitShipCard, handleMenuTap,
  /* v0.27.0 元素層（冒煙測試用） */
  elementS: ELEMENTS, elementIds: ELEMENT_IDS,
  applyPickedElement, buildElemChoiceOffer, applyPickedElemChoice,
  elementCardsLayout, hitElementCard, currentElement, applyElementEffects,
  elemOffer: () => elementOffer, elemChoiceOffer: () => elemChoiceOffer,
  applyPickedUniversal,
  /* v0.28.0 強化卡池抽法（驗證新抽法用） */
  choiceOffer: () => choiceOffer,
  playerStacks: () => playerStacks,
  seenUpgradeIds: () => seenUpgradeIds,
  /* 測試用：強制指定某張卡（實機驗證 form_rail 修正用） */
  upgrades: UPGRADES,
  /* v0.29.0 gamedev-feel */
  FEEL, cam, addTrauma, hitStop, pulseShip, feelHitEnemy,
  /* v0.31.0 效能：背景 gradient 快取（測試用：分配計數 + 像素比對） */
  bgGradient, theme: STAGE_THEME, viewW: VIEW_W, viewH: VIEW_H,
  /* v0.31.0 可讀性：測試用：強制指定詞綴（停電暗幕對比度實測用） */
  setAffix: (id) => {
    const d = AFFIX_DEFS.find(x => x.id === id);
    return d ? applyStageAffix(d) : null;
  },
  affixDefs: AFFIX_DEFS,
  get hitStopUntil(){ return hitStopUntil; },
  get shipPop(){ return shipPop; },
  get trauma(){ return cam.trauma; },
};
