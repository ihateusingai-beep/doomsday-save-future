<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>末日救未來</title>
<style>
  /* === 重置 + 全螢幕 === */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
    overscroll-behavior:none;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", monospace;
    color:#0ff;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
  }
  /* === 畫布（PLAN v2 #10-12，CSS 縮放 + pixelated 像素化） === */
  canvas {
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    background:#000;
    touch-action:none;
    cursor:crosshair;
    box-shadow:0 0 0 1px rgba(0,255,255,0.18), 0 0 40px rgba(0,180,255,0.18);
    border-radius:4px;
  }
  /* === 開發者 HUD（預設隱藏，加 ?debug=1 先顯示） ===
     錨點跟畫布走，唔再黐死視窗左上角。 */
  #hud {
    position:fixed; left:0; top:0;
    transform:translate(10px, 10px);
    display:none;
    font:12px ui-monospace, SFMono-Regular, Menlo, monospace;
    pointer-events:none;
    color:#9ff;
    line-height:1.45;
    text-shadow:0 0 6px #001a22, 0 1px 0 #000;
    background:linear-gradient(180deg, rgba(0,20,30,0.55), rgba(0,0,0,0.15));
    border:1px solid rgba(0,255,255,0.22);
    border-radius:8px;
    padding:8px 10px;
    backdrop-filter:blur(4px);
    z-index:10;
  }
  body.debug #hud { display:block; }
  #hud .row { white-space:nowrap; }
  #hud .accent { color:#ffd56a; }
  #hud .warn { color:#ff5e8a; }
</style>
</head>
<body>
  <canvas id="game" width="320" height="480" aria-label="末日救未來 遊戲畫布"></canvas>
  <div id="hud" aria-hidden="true">
    <div class="row" id="hud-state">狀態：--</div>
    <div class="row" id="hud-time">時間：0.0 秒</div>
    <div class="row" id="hud-hp">生命：--  護盾：--</div>
    <div class="row" id="hud-paused"></div>
    <div class="row accent" id="hud-tip">點擊畫面開始</div>
  </div>
<script>
'use strict';
/* ============================================================
 * 末日救未來 — S0 scaffold (PLAN v2 2026-10-17)
 * 涵蓋範圍：
 *   P0-1 畫布 320×480 + 感知 DPR 的 backing store + CSS 適應
 *   P0-2 凍結狀態機（TITLE/SHIP_SELECT/STAGE_n/CHOICE/PAUSED/GAMEOVER/VICTORY）
 *   P0-3 一架戰機（拖曳 + 方向鍵/WASD + 自動開火）
 *   P0-4 敵機（八方向螺旋 + 玩家子彈命中／傷害）
 *   P0-5 分頁可見度切換 → state=PAUSED + 計時凍結
 *
 * 依據 PLAN v2 §參考表 #11（Canvas 2D / 320×480 內部座標）、
 *                        #13（固定 60 FPS 累加器）、
 *                        #15（Pointer Events + 鍵盤代理）、
 *                        #16（帶重置鉤子的狀態機）、
 *                        #17（分頁可見度暫停）

/* ---------- 1. 常數 ---------- */

   而且喺按鈕位置開始拖曳會誤觸技能）。 */
const PLAY_BOTTOM = 396;

/* P0-4：拖曳跟手速度係 ship.speed 乘呢個係數。
   舊代碼用 x += (target-x)*0.30 瞬移，令 spd_s / spd_l 兩張速度卡
   喺 iPad / Smart Board（純拖曳，冇鍵盤）完全無效 —— 即係話佢哋係假卡。
   改成受速度限制後，移動變成有慣性：要預判，唔可以瞬移 dodging。

/* ---- 貼圖圖集（art.px.js → out/dsf_main.png，內嵌 base64 見 PLAN） ---- */
const SPRITE = Object.freeze({

const SHEET_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAG4AAABeCAMAAAD1/9FkAAAAulBMVEUAAAAAPkAAAAD/5Wb/mhj/aiAA9v/4//8AoMhA9///atUAt9Y9/4r/6Wr/MolArsn/Gmr/64wP9/8PqtMPHDNNjP//pUZAJwb/7ZQzFStHHjwzLhT5///6////NY1NLgezJEwz9///Q24z+P//eiT/hdb/hdf/Q3ZNLgpNIAozHwWgECgSGjD/TV4SQVQcJ0QAsNKxFDj/nCkAaIiKoMhaaog6SGj/6GzI2P91X24qNUhqTk8cS2USO097H+qoAAAAAXRSTlMAQObYZgAABExJREFUeNrt2Qt/2jYQAHBzkmXjrJmbQlPAa9J0fQKLyVK2Jez7f63dnSRLtoGCI+hjHIp+BBz90dsoURRFvV6kAzjVnwopMJex5FfBvt89ekppDxRg0k8FJAKaHKjEvt/ZRS1hD1SqkpTLg74AEH2oOFHnIMsy6KidKUw90tJf8IEFQl8+A3gm2eNWlLHwOMjOz8+7eY5LTSCnflWQU2a5KI7qXNKZU2dnz4m7eJFeXKQvLsCXDdTiuteuJwRm0WA4fMlpgMXm/RyTapQYoO+ingSQNFQGmhvwUJH9vu66tdxTZkQ1xQZygImfXspLTNFGLkh40/ySU4tTIbmvf55Xx9Rc5X+o8MfZiBPHGF8ejxvdOqmyzlpRVN4oG2HSWvYbjLNszBMtAT3TJmJiMgzVSZMYYLU8wzRi7TU+MI1Ry68gJ2+CS3ZBGXkiEVXzQBcOteuseMMeGO01rmr5jby5yYE0+Va8xevZU14Ju3rwOwcY7Tp7c31N3jjDB2cRvJPv38t3yMkCJTQLOWl83l09iEmLmUMNKcqwemM5Nll0JeNYXnFbfiDugxQTXyuKYlfP57I8p77Lde+Bm2of4/ijHikI2b7rxrnGRM/EqHnVp09mHlArTvym3JNrjEyaCG3Nxecq69Z3NS4ajfTP3lNpj5kgBDx1WYKOi9gp/l8Ba6I+gmqjo3rfxpQi2naFv7PDbE3QDjmfzw07HLo/h5gC6lgNpJuixm0RuMkDM9UK5GCe4IPYIQf4mvOmYppTOA/UHxS+589smN22grk5V480paxHGv6t86Zay3MxdVpZljVvB842JpBGHjjNeawJIbh+VkuxN1LPg8Xd3d0CtnPocU5c4jizonucEOxVXDlLkmRWVhwsmDPeRs5sYVy7YXcONW5t423mzIdDz+u6DlyeF+ztxOmhCVHUse9gYQbTjhx54M269SNzGm8YmXtz/qrSmnfTabx93rX67s9WzGDLzdG+q4r23Mhcv4htXWL3WjPRW1ht8xIdeBM47YWbI62aqdls4e6iEsruvfK+YPjlLzG8rfEvePKX5/u/76luiuqnOTcSahxANWH4CtWtsq3aLSsElkpZDpb/WE5f4Ve8W9+1uapMWD48Go6ueirH5Tx4ATUOtS8Pj4/8C3Pi0ByFV+kgnPA58GGPi8IsVlXtRIvT3jLo0gWWatdOt2DYhbLZdzUuCr/St4eKCF2l3UbmoThxXO7hW3Dip66d48RPXbsjcqC5w3m1W1PebBt3L4c8wjhxJ+7EBbvh+q7OIg9XHfc1ng8X2l/lw9pQ0zzP3ivrMwcIx/Gxy2rF5a5W5hTGHKEp9S9FsP8oGw61FYX1NAeKKQYhIMdOWZaVd1COlRSV1Hr66FpDmM9CeRVX3iZJclu2ODpoDVe9HTh1RE4f04fnNvTdIbgtI9NyQSfCxnlnIzB35FWFPI7bGneINfOb7Ah7nCX/MNvrfwQ5KIXLdIdqAAAAAElFTkSuQmCC';
const sheetImg = new Image();
let sheetReady = false;
sheetImg.onload = () => { sheetReady = true; console.log('[貼圖] 圖集就緒 ·', Object.keys(SPRITE).length, '格'); };
sheetImg.onerror = () => { console.warn('[貼圖] 圖集載入失敗 — 改用程序繪圖'); };
sheetImg.src = 'data:image/png;base64,' + SHEET_B64;

/** 以 (cx,cy) 為中心畫圖集格；scale 乘原生像素。未就緒回傳 false */
function drawSprite(name, cx, cy, scale) {
  if (!sheetReady) return false;
  const f = SPRITE[name];
  if (!f) return false;
  const s = scale == null ? 2 : scale;
  const dw = f.w * s, dh = f.h * s;
  const prev = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sheetImg, f.x, f.y, f.w, f.h,
    Math.round(cx - dw / 2), Math.round(cy - dh / 2), dw, dh);
  ctx.imageSmoothingEnabled = prev;
  return true;
}
const SHIP_SPRITE = Object.freeze({ A: 'ship_a', B: 'ship_b', C: 'ship_c' });

/* ---------- 特效 / 場景（美化） ---------- */
const STAGE_THEME = Object.freeze({
  1: { name:'維港起飛', skyTop:'#030814', skyBot:'#0a1a3a', accent:'#00f0ff', prop:'tower', tint:'rgba(0,180,255,0.06)' },
  2: { name:'九龍煙柱', skyTop:'#100808', skyBot:'#2a1010', accent:'#ff6a20', prop:'bldg',  tint:'rgba(255,80,40,0.07)' },
  3: { name:'大氣層',   skyTop:'#080618', skyBot:'#1a1040', accent:'#ff9a18', prop:'meteor',tint:'rgba(180,100,255,0.06)' },
  4: { name:'軌道殘骸', skyTop:'#000000', skyBot:'#101820', accent:'#8aa0c8', prop:'debris',tint:'rgba(120,160,200,0.05)' },
  5: { name:'逃逸門',   skyTop:'#000510', skyBot:'#001828', accent:'#3dff8a', prop:'gate',  tint:'rgba(0,255,140,0.07)' },
});
const stars = Array.from({ length: 48 }, (_, i) => ({
  x: (i * 53 + 17) % VIEW_W,
  y: (i * 97 + 11) % VIEW_H,
  z: 0.35 + (i % 5) * 0.18,
  kind: i % 7 === 0 ? 2 : (i % 3 === 0 ? 1 : 0),
}));
let particles = [];
let screenFlash = 0;
let hitShake = 0;
let bgScroll = 0;

function spawnSparks(x, y, n, speed) {
  const sp = speed == null ? 0.12 : speed;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = sp * (0.4 + Math.random());
    particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 280 + Math.random()*220, max: 400, kind: 'spark' });
  }
}
function spawnBoom(x, y) {
  particles.push({ x, y, vx: 0, vy: 0, life: 420, max: 420, kind: 'boom', frame: 0 });
  spawnSparks(x, y, 10, 0.18);
  screenFlash = Math.max(screenFlash, 0.55);
}
function tickVfx(dtMs) {
  bgScroll += dtMs * 0.025;
  /* P1-6 擦彈光環：每次擦彈重設為 1，然後一路衰減到 0。
         密集擦彈時唔會無限疊加光環，畫面唔會被洗白。 */
  if (grazeRingT > 0) grazeRingT = Math.max(0, grazeRingT - dtMs * 0.0035);
  if (grazeFlash > 0) grazeFlash = Math.max(0, grazeFlash - dtMs * 0.002);
  if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dtMs * 0.0022);
  if (hitShake > 0) hitShake = Math.max(0, hitShake - dtMs * 0.012);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dtMs;
    p.x += p.vx * dtMs;
    p.y += p.vy * dtMs;
    if (p.kind === 'boom') {
      p.frame = p.life > 280 ? 0 : (p.life > 140 ? 1 : 2);
    } else {
      p.vy += 0.00015 * dtMs;
    }
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (const s of stars) {
    s.y += s.z * dtMs * 0.04;
    if (s.y > VIEW_H + 4) { s.y = -4; s.x = (s.x + 47) % VIEW_W; }
  }
}
function drawBackdrop(stageId) {
  const th = STAGE_THEME[stageId] || STAGE_THEME[1];
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, th.skyTop);
  g.addColorStop(1, th.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  for (const s of stars) {
    const name = s.kind === 2 ? 'star_2' : (s.kind === 1 ? 'star_1' : 'star_0');
    if (!drawSprite(name, s.x, s.y, s.z > 0.8 ? 1.2 : 1)) {
      ctx.fillStyle = s.kind ? '#8cf' : '#fff';
      ctx.fillRect(s.x, s.y, s.kind ? 2 : 1, s.kind ? 2 : 1);
    }
  }
  const prop = th.prop;
  const baseY = VIEW_H - 10 + Math.sin(bgScroll * 0.02) * 2;
  if (prop === 'tower' || prop === 'bldg') {
    for (let i = 0; i < 5; i++) {
      const x = ((i * 70 + bgScroll * 0.15) % (VIEW_W + 40)) - 20;
      drawSprite(i % 2 ? 'tower' : 'bldg', x, baseY - (i % 3) * 8, 1.2);
    }
  } else if (prop === 'meteor') {
    for (let i = 0; i < 4; i++) {
      const x = (i * 90 + bgScroll * 0.4) % (VIEW_W + 30) - 15;
      const y = ((i * 110 + bgScroll * 0.55) % (VIEW_H + 40)) - 20;
      drawSprite('meteor', x, y, 1.3);
    }
  } else if (prop === 'debris') {
    for (let i = 0; i < 5; i++) {
      const x = (i * 75 + bgScroll * 0.3) % (VIEW_W + 30) - 15;
      const y = 40 + ((i * 97 + bgScroll * 0.2) % (VIEW_H - 80));
      drawSprite('debris', x, y, 1.2);
    }
  } else if (prop === 'gate') {
    drawSprite('gate', VIEW_W/2, 70 + Math.sin(bgScroll * 0.03) * 6, 1.4);
    for (let i = 0; i < 3; i++) drawSprite('debris', 40 + i * 100, 200 + i * 40, 1);
  }
  ctx.fillStyle = th.tint;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const vg = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, VIEW_H*0.2, VIEW_W/2, VIEW_H/2, VIEW_H*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.kind === 'boom') {
      const nm = p.frame === 0 ? 'boom_0' : (p.frame === 1 ? 'boom_1' : 'boom_2');
      if (!drawSprite(nm, p.x, p.y, 1.4)) {
        ctx.fillStyle = '#ff6';
        ctx.beginPath(); ctx.arc(p.x, p.y, 8 * a, 0, Math.PI*2); ctx.fill();
      }
    } else if (!drawSprite('spark', p.x, p.y, 1)) {
      ctx.fillStyle = '#ff6';
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
  }
  ctx.globalAlpha = 1;
}
function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < VIEW_H; y += 3) ctx.fillRect(0, y, VIEW_W, 1);
}
function drawFlash() {
  if (screenFlash <= 0) return;
  ctx.fillStyle = 'rgba(180,255,255,' + (screenFlash * 0.45).toFixed(3) + ')';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}
function drawHudChips() {
  if (!ship || !isStage(fsm.cur)) return;
  /* P0-4：血心 / 護盾由畫面底部移去頂部。舊位置 y=VIEW_H-18 啱啱落喺
     FOCUS / BOMB 按鈕（y 408–472）入面，實機截圖見到紅心壓住
     "READY" 字樣、盾 icon 壓住炸彈按鈕。頂部兩邊本身係空嘅
     （關卡名 chip 喺正中間 x 100–220）。 */
  for (let i = 0; i < ship.maxHp; i++) {
    const on = i < ship.hp;
    ctx.globalAlpha = on ? 1 : 0.28;
    if (!drawSprite('ui_heart', 16 + i * 14, 20, 1.15)) {
      ctx.fillStyle = on ? '#f06' : '#444';
      ctx.fillRect(10 + i * 12, 16, 10, 8);
    }
    ctx.globalAlpha = 1;
  }
  for (let i = 0; i < Math.min(ship.shield, 5); i++) {
    drawSprite('ui_shield', VIEW_W - 16 - i * 14, 20, 1);
  }
}

/* ---------- 2. 輸入層（PLAN v2 #15、#18-19） ---------- */
const InputState = {
  /* 後寫者勝的目標座標（拖曳或 WASD 都收斂到呢度） */
  targetX: VIEW_W / 2,
  targetY: VIEW_H - 60,

  /* 鍵盤代理 */
  keys: { up:false, down:false, left:false, right:false },

  /* 聚焦／炸彈而家由冷卻時間驅動（focusActiveUntil、bombCDUntil
     係模組層級變量變數），唔係讀取後即清嘅旗標 */

  /* 拖曳記帳（觸控用） */
  dragId: null,
  dragOrigin: { x:0, y:0 },
  shipOrigin: { x:0, y:0 },
  touchMoved: false,

/* ---------- 4. 畫布 DPR（PLAN v2 #12） ---------- */
function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = VIEW_W * dpr;
  canvas.height = VIEW_H * dpr;
  /* 保持 320×480 比例去適應視窗 */
  const aspect = VIEW_W / VIEW_H;
  const winAspect = window.innerWidth / window.innerHeight;
  let cssW, cssH;
  if (winAspect > aspect) {
    cssH = Math.min(window.innerHeight, window.innerWidth * (1/aspect));
    cssW = cssH * aspect;
  } else {
    cssW = Math.min(window.innerWidth, window.innerHeight * aspect);
    cssH = cssW / aspect;
  }
  canvas.style.width  = Math.floor(cssW) + 'px';
  canvas.style.height = Math.floor(cssH) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);    // logical coords = internal 320×480
  /* HUD 錨喺畫布左上角（唔係視窗左上角），闊螢幕都唔會走飛 */
  if (hudEl.root) {
    const r = canvas.getBoundingClientRect();
    hudEl.root.style.left = Math.round(r.left) + 'px';
    hudEl.root.style.top  = Math.round(r.top) + 'px';
  }
}
setupCanvas();
window.addEventListener('resize', setupCanvas);
window.addEventListener('orientationchange', () => setTimeout(setupCanvas, 120));

/* ---------- 5. 狀態機 ---------- */
const fsm = {
  cur: STATE.TITLE,
  prev: null,                 // remember pre-PAUSED state for resume
  transitions: [],            // for S0-2: log to console

  set(next) {
    if (next === this.cur) return;
    const from = this.cur;
    this.prev = this.cur;
    this.cur  = next;
    this.transitions.push({ from, to: next, at: performance.now() });
    /* F2 重置-on-render 防線：每個狀態入場各自重置（PLAN v2 #16） */
    onStateEnter(next, from);
    /* 狀態機日誌 */
    console.log(`[狀態機] ${stateLabel(from)} → ${stateLabel(next)} @ ${(performance.now()/1000).toFixed(2)}秒`);
    hudEl.state.textContent = `狀態：${stateLabel(next)}`;
  },
};

function onStateEnter(s, from) {
  if (isStage(s)) {
    lastStage = parseInt(s.split('_')[1], 10);
    /* 重置實體、套用強化 */
    bullets.length = 0;
    enemies.length = 0;
    if (!ship) pickShip('A');                 // default ship first run
    applyUpgrades();
    ship.x = VIEW_W/2; ship.y = VIEW_H - 60;
    /* 只補滿血；護盾由 applyUpgrades() 決定（含 shd_s / shd_l 升級）。
       舊代碼喺呢度再覆寫一次 SHIPS[chassis].shield，令玩家揀咗嘅護盾卡
       每關一入去就即刻被清走 —— 100% 死卡。 */
    ship.hp = ship.maxHp;
    /* 重置波次排程 */
    waveQueue = (WAVE_TEMPLATES[lastStage] || []).map(w => ({ at: w.at, spawn: w.spawn, fired: false }));
    waveCursor = 0;
    /* P1-5：boss 唔喺呢度出。改為波次清完之後由 tick() 召喚，
       令每關有「雜魚 → boss」嘅正確節奏。 */
    bossSpawned = false;
    waveQueueDoneAt = null;
    /* stage clock always resets; run clock only on fresh run start (PLAN: 全程 count-up) */
    endFreezeClocks();                 /* absorb CHOICE/PAUSED gap before anchors */
    stageStartMs = performance.now();
    if (s === STATE.STAGE_1 && (from === STATE.SHIP_SELECT || runStartMs === null)) {
      runStartMs = stageStartMs;
    }
    if (from !== STATE.STAGE_1) {
      /* 局中入關：唔好清 runScore */
    } else {
      runScore = 0;
    }
    hudEl.tip.textContent = `第 ${lastStage} 關 · ${STAGE_TABLE[lastStage].name} · 滑鼠跟機／拖曳／WASD · 自動開火 · 空白聚焦 · Shift 炸彈 · P 暫停`;
  } else if (s === STATE.CHOICE) {
    beginFreezeClocks();               /* modal freezes run timer (PLAN §Score) */
    choiceOffer = generateChoiceOffer();
    choicePicked = -1;
    hudEl.tip.textContent = '選擇強化 · 點擊卡牌或按 1/2/3';
  } else if (s === STATE.GAMEOVER) {
    hudEl.tip.textContent = '重試 / 返回標題';
  } else if (s === STATE.VICTORY) {
    /* PLAN v2 §計分：最終 = runScore + timeBonus；
       持久化見 #22（bestScore + bestTime）。 */
    endFreezeClocks();                 /* no residual freeze in final calc */
    const finalRunSec = runStartMs != null ? (performance.now() - runStartMs) / 1000 : 0;
    const targetTotal = STAGES.reduce((acc, st) => acc + STAGE_TABLE[st.split('_')[1]].targetSec, 0);
    const timeBonus = Math.max(0, targetTotal - finalRunSec) * 10;
    finalScore = runScore + timeBonus;
    victoryRunSec = finalRunSec;
    victoryTimeBonus = timeBonus;
    /* 比較 + 寫入儲存 */
    let isNewBestScore = false, isNewBestTime = false;
    if (finalScore > bestScore) { bestScore = finalScore; lsWrite(LS_KEY_SCORE, bestScore); isNewBestScore = true; }
    if (bestTime === 0 || finalRunSec < bestTime) { bestTime = finalRunSec; lsWrite(LS_KEY_TIME, bestTime); isNewBestTime = true; }
    isNewBest = isNewBestScore || isNewBestTime;
    console.log(`[勝利] 最終=${Math.floor(finalScore)} 最佳=${Math.floor(bestScore)} 用時=${finalRunSec.toFixed(1)}秒 最佳時間=${bestTime.toFixed(1)}秒 新紀錄=${isNewBest}`);
    hudEl.tip.textContent = `任務完成 · 分數 ${Math.floor(finalScore)}`;
  } else if (s === STATE.PAUSED) {
    hudEl.tip.textContent = pauseReason === 'manual'
      ? '已暫停 — 撳畫面／P／Esc 繼續'
      : '已暫停 — 分頁切換中';
  } else if (s === STATE.TITLE) {
    hudEl.tip.textContent = '點擊畫面開始';
    bullets.length = 0; enemies.length = 0;
    /* 保留戰機同 playerStacks 方便重試 */
  } else if (s === STATE.SHIP_SELECT) {
    /* 新的一局：重置分數同計時 */
    runScore = 0;
    runStartMs = null;
    stageStartMs = null;
    pausedAtMs = null;
    hudEl.tip.textContent = 'A / B / C（或點擊機體卡）';
  }
}

  { id:'fr_l',    nameZh:'射速++',   icon:'🔥🔥',  desc:'射速 +50%',              mod:(s,n)=>{ s.fireRate *= Math.pow(1.50, n); } },
  { id:'gun_2',   nameZh:'雙砲',     icon:'✦',    desc:'2 連發 → 3 連發',       mod:(s,n)=>{ s.bulletCount = 2 + n; } },
  { id:'gun_3',   nameZh:'三砲',     icon:'✦✦',   desc:'3 連發 → 4 連發',       mod:(s,n)=>{ s.bulletCount = Math.min(4, 3 + n); } },

function pickShip(id) {
  const c = SHIPS[id];
  ship = {
    chassis: id,
    x: VIEW_W / 2,
    y: VIEW_H - 60,
    hp: 3, maxHp: 3,
    shield: c.shield,
    speed: c.speed,
    fireRate: c.fireRate,
    fireCD: 0,
    bulletCount: 2,
    bulletDmg: 1,
    bombCD: 12000,
    focusFactor: 0.3,
    focusDuration: 4000,
    focusCD: 8000,
    grazeMult: 1,
    pierce: 0,
    resurrect: 0,
    masterStacks: 0,
    iFrameUntil: 0,
  };
  /* 套用已累積嘅疊加值（繼續同一局時） */
  applyUpgrades();
}

function applyUpgrades() {
  if (!ship) return;
  /* 先重設返基礎值 */
  const c = SHIPS[ship.chassis];
  ship.maxHp        = 3;
  ship.shield       = c.shield;
  ship.speed        = c.speed;
  ship.fireRate     = c.fireRate;
  ship.bulletCount  = 2;
  ship.bulletDmg    = 1;
  ship.bombCD       = 12000;
  ship.focusFactor  = 0.3;
  ship.focusDuration= 4000;
  ship.focusCD      = 8000;
  ship.grazeMult    = 1;
  ship.pierce       = 0;
  ship.resurrect    = 0;
  ship.masterStacks = 0;
  /* 再套用疊加值 */
  for (const up of UPGRADES) {
    const n = playerStacks[up.id] || 0;
    if (n > 0) up.mod(ship, n);
  }
  /* 大師：每層對速度與射速乘 1.20 */
  if (ship.masterStacks > 0) {
    const m = Math.pow(1.20, ship.masterStacks);
    ship.speed    *= m;
    ship.fireRate *= m;
  }
  /* 生命上限增加時一併補返血量 */
  if (ship.hp < ship.maxHp) ship.hp = ship.maxHp;
  /* 護盾唔可以負數 */
  if (ship.shield < 0) ship.shield = 0;
}

*/
const GRAZE_RADIUS   = 20;    /* 擦彈判定圈半徑（像素） */
const GRAZE_SCORE    = 5;     /* 每次擦彈分數（PLAN v2 §計分） */
const GRAZE_ENERGY_NEED = 10; /* 集幾多次回充一次 */
const GRAZE_REFUND_MS   = 1200; /* 回充多少毫秒 */
let grazeCount  = 0;
let grazeEnergy = 0;
let grazeScoreTotal = 0;   /* 擦彈貢獻咗幾多分（勝利畫面要拆開顯示） */
let grazeRingT  = 0;          /* 光環動畫進度 1 → 0 */
let grazeRingX = 0, grazeRingY = 0;
let grazeFlash = 0;          /* 集滿能量時嘅提示閃光 */

function doGraze(ex, ey) {
  grazeCount++;
  const gained = GRAZE_SCORE * (ship.grazeMult || 1);
  runScore += gained;
  grazeScoreTotal += gained;
  grazeEnergy++;
  /* 集滿一次就回充兩個技能嘅冷卻，令走位可以「賺」返炸彈 */
  if (grazeEnergy >= GRAZE_ENERGY_NEED) {
    grazeEnergy -= GRAZE_ENERGY_NEED;
    focusCDUntil = Math.max(0, focusCDUntil - GRAZE_REFUND_MS);
    bombCDUntil  = Math.max(0, bombCDUntil  - GRAZE_REFUND_MS);
    grazeFlash = 1;
    const t = performance.now();
    const cdText = (until) => until - t > 0 ? ((until - t) / 1000).toFixed(1) + ' 秒' : '就緒';
    console.log('[擦彈] 集滿 ' + GRAZE_ENERGY_NEED + ' 次 → 回充 ' + (GRAZE_REFUND_MS / 1000).toFixed(1) +
      ' 秒　聚焦剩 ' + cdText(focusCDUntil) + '　炸彈剩 ' + cdText(bombCDUntil) +
      ' @' + (t / 1000).toFixed(2));
  }
  grazeRingT = 1;
  grazeRingX = ex; grazeRingY = ey;
  spawnSparks(ex, ey, 2, 0.05);
}

/* ---------- 計分（PLAN v2 §計分） ---------- */
let runScore = 0;          /* 局內累積，勝利時結算 */
let runKills = 0;          /* 擊殺數（調數值用；debug HUD 顯示） */
let runGrunts = 0;         /* 雜魚擊殺數 */
/* 擦彈留待 P1；現階段只計擊殺分 */

function spawnBossFor(stageId) {
  const st = STAGE_TABLE[stageId] || STAGE_TABLE[1];

    kind: 'spiral',

/* P1-5：雜魚編隊產生器。
   P1-5 之前場上只有 boss一種可擊殺目標，所以「貫穿」呢類需要多目標嘅
   強化根本無處生效（見 UPGRADES 註釋）。加入雜魚之後先有東西可以貫穿。 */
function spawnGruntFormation(opt) {
  const n = opt.count || 1;
  const hp = opt.hp || GRUNT_HP;
  const elite = opt.type === 'elite';
  const diving = opt.type === 'dive';
  const score = elite ? ELITE_SCORE : GRUNT_SCORE;
  for (let i = 0; i < n; i++) {
    /* 一排平均分佈喺畫面寬度中央 80% 範圍內 */
    const t = n === 1 ? 0.5 : i / (n - 1);
    const x = clamp(VIEW_W / 2 + (t - 0.5) * VIEW_W * 0.8, 20, VIEW_W - 20);
    enemies.push({
      kind: 'grunt',
      x,
      y: -14 - (elite ? 0 : i * 6),
      vx: 0,
      /* P1-5 雜魚慢落，但唔可以慢到變成殘留物資：
         0.035 px/ms 橫跨全屏要 12 秒，實測會令畫面堆滿慢慢漂嘅目標。
         0.055 約 8 秒、俯衝 0.09 約 5 秒，密度同可瞄準時間比較平衡。 */
      vy: diving ? (elite ? 0.07 : 0.09) : (elite ? 0.042 : 0.055),
      hp: elite ? (opt.hp || ELITE_HP) : hp,
      maxHp: elite ? (opt.hp || ELITE_HP) : hp,
      elite,
      diving,
      score,
      affix: elite ? (opt.affix || ELITE_AFFIX[i % ELITE_AFFIX.length]) : '',
      t: i * 120,                    /* 錯開發炮時間，避免全機同時開火 */
      sway: diving ? 0 : 0.022 + (i % 3) * 0.008,
      fireCD: 1600 + i * 420,
      label: '',
    });
  }
}

function emitWaveType(s, stageId) {
  /* 由畫面頂部產生指定類型嘅彈幕／雜魚 */
  const cx = VIEW_W / 2;
  switch (s.type) {
    case 'grunt':
    case 'dive':
    case 'elite': {
      spawnGruntFormation(s);
      break;
    }
    case 'spray': {
      const baseA = Math.PI / 2;
      for (let i = 0; i < s.count; i++) {
        const a = baseA + (i - (s.count - 1) / 2) * s.spread;
        enemies.push({
          kind: 'bullet',
          x: cx + (Math.random() - 0.5) * VIEW_W * 0.6,
          y: 20,
          vx: Math.cos(a) * s.speed,
          vy: Math.sin(a) * s.speed,
        });
      }
      break;
    }
    case 'aim': {
      /* 直接瞄準戰機現時位置 */
      const sx = ship ? ship.x : cx;
      const sy = ship ? ship.y : VIEW_H - 60;
      for (let i = 0; i < s.count; i++) {
        const a = Math.atan2(sy - 20, sx - cx) + (i - (s.count - 1) / 2) * 0.08;
        enemies.push({ kind:'bullet', x: cx + (Math.random()-0.5)*VIEW_W*0.5, y: 20, vx: Math.cos(a)*s.speed, vy: Math.sin(a)*s.speed });
      }
      break;
    }
    case 'ring': {
      const ang0 = Math.random() * Math.PI * 2;
      for (let i = 0; i < s.count; i++) {
        const a = ang0 + i * (Math.PI * 2 / s.count);
        enemies.push({ kind:'bullet', x: cx, y: 80, vx: Math.cos(a)*s.speed, vy: Math.sin(a)*s.speed });
      }
      break;
    }
    case 'meteor': {
      for (let i = 0; i < s.count; i++) {
        const x = 30 + Math.random() * (VIEW_W - 60);
        enemies.push({ kind:'bullet', x, y: 10, vx: (Math.random()-0.5)*0.02, vy: s.speed * (0.8 + Math.random()*0.4) });
      }
      break;
    }
  }
}

/* ---------- 7. 輸入 —— Pointer Events + 鍵盤 ---------- */
canvas.addEventListener('pointerdown', (e) => {
  /* 依狀態分派點擊 */
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX, cy = e.clientY;
  const px = (cx - rect.left) * VIEW_W / rect.width;
  const py = (cy - rect.top)  * VIEW_H / rect.height;
  if (fsm.cur === STATE.TITLE) { fsm.set(STATE.SHIP_SELECT); return; }
  if (fsm.cur === STATE.SHIP_SELECT) {
    const id = hitShipCard(px, py);
    if (id) pickShipAndStart(id);
    return;
  }
  if (fsm.cur === STATE.PAUSED) {
    /* 手動暫停：點擊繼續；分頁暫停等 visibility 恢復 */
    if (pauseReason === 'manual') resumePause();
    return;
  }
  if (fsm.cur === STATE.GAMEOVER) {
    const hit = hitEndBtn(px, py);
    if (hit === 'retry') return goRetry();
    if (hit === 'title') return goTitle();
    return;
  }
  if (fsm.cur === STATE.VICTORY) {
    const hit = hitEndBtn(px, py);
    if (hit === 'retry') return goRetry();
    if (hit === 'title') return goTitle();
    return;
  }
  if (fsm.cur === STATE.CHOICE) {
    const idx = hitChoiceCard(px, py);
    if (idx >= 0) {
      applyPickedUpgrade(idx);
      advanceStage();
    }
    return;
  }
  /* STAGE_n：暫停掣 → 技能鍵 → 觸控先起拖（滑鼠唔使 drag） */
  if (isStage(fsm.cur)) {
    if (hitPauseBtn(px, py)) { enterPause('manual'); return; }
    const ab = hitAbilityBtn(px, py);
    if (ab === 'focus') { tryFocus(); return; }
    if (ab === 'bomb')  { tryBomb();  return; }
    /* 只有 touch 先記 drag；mouse 已由 window mousemove 絕對跟機 */
    if (e.pointerType === 'touch') {
      InputState.device = 'touch';
      InputState.touchActive = true;
      InputState.dragId = e.pointerId;
      InputState.dragOrigin = { x: cx, y: cy };
      InputState.shipOrigin = { x: ship.x, y: ship.y };
      InputState.touchMoved = false;
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    } else {
      /* mouse/pen click on empty：即刻對準游標（兼 autofocus 頁面） */
      InputState.device = 'mouse';
      aimFromClient(cx, cy);
    }
  }
});

/* 客戶端座標 → 內部 320×480（含 CSS 縮放） */
function aimFromClient(clientX, clientY) {
  if (!ship) return;
  const rect = canvas.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;
  /* 游標唔喺畫布上：保持上一個目標（唔甩去邊） */
  if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return;
  const px = (clientX - rect.left) * VIEW_W / rect.width;
  const py = (clientY - rect.top)  * VIEW_H / rect.height;
  InputState.targetX = clamp(px, 8, VIEW_W - 8);
  InputState.targetY = clamp(py, 8, PLAY_BOTTOM);
}

/* PC 滑鼠：window 級 mousemove —— 唔依賴 canvas hover、唔使撳住左鍵。
   舊實作只 listen canvas pointermove，部分瀏覽器／嵌入環境
   無 buttons 時唔派 pointermove 去 canvas，導致一定要 click-drag。 */
function onDesktopAimMove(e) {
  if (!isStage(fsm.cur) || !ship) return;
  /* iPad 合成 mouse：touch 進行中忽略，避免拖完彈一次 */
  if (InputState.touchActive) return;
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  InputState.device = 'mouse';
  aimFromClient(e.clientX, e.clientY);
}
window.addEventListener('mousemove', onDesktopAimMove, { passive: true });
/* 兼容只派 pointer 事件嘅環境（同樣唔使 buttons） */
window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return; /* 觸控行下面 canvas handler */
  if (!isStage(fsm.cur) || !ship) return;
  if (InputState.touchActive) return;
  InputState.device = (e.pointerType === 'pen') ? 'pen' : 'mouse';
  aimFromClient(e.clientX, e.clientY);
}, { passive: true });

canvas.addEventListener('pointermove', (e) => {
  /* 觸控／智慧白板：相對拖曳 + 8px 容差（PLAN #19） */
  if (e.pointerType !== 'touch') return;
  if (!isStage(fsm.cur) || !ship) return;
  if (e.pointerId !== InputState.dragId) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX, cy = e.clientY;
  const dxCss = cx - InputState.dragOrigin.x;
  const dyCss = cy - InputState.dragOrigin.y;
  const distCss = Math.hypot(dxCss, dyCss);
  if (!InputState.touchMoved && distCss > DRAG_TOLERANCE_PX) {
    InputState.touchMoved = true;
  }
  if (InputState.touchMoved) {
    const newX = InputState.shipOrigin.x + dxCss * VIEW_W / rect.width;
    const newY = InputState.shipOrigin.y + dyCss * VIEW_H / rect.height;
    InputState.targetX = clamp(newX, 8, VIEW_W - 8);
    InputState.targetY = clamp(newY, 8, PLAY_BOTTOM);
  }
});

function endDrag(e) {
  if (e.pointerId === InputState.dragId) {
    InputState.dragId = null;
    InputState.touchActive = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
}
canvas.addEventListener('pointerup',    endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* 阻止 iPad 捲動／縮放 */
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive:false });

/* 鍵盤代理 */
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  /* 手動暫停／繼續（課堂硬需求）。分頁暫停唔好用鍵強制恢復。 */
  if (fsm.cur === STATE.PAUSED && pauseReason === 'manual') {
    if (k === 'p' || k === 'escape' || k === ' ' || k === 'enter') {
      resumePause();
      e.preventDefault();
      return;
    }
  }
  if (isStage(fsm.cur) && (k === 'p' || k === 'escape')) {
    enterPause('manual');
    e.preventDefault();
    return;
  }
  if (k === 'arrowup'    || k === 'w') { InputState.keys.up = true; e.preventDefault(); }
  if (k === 'arrowdown'  || k === 's') { InputState.keys.down = true; e.preventDefault(); }
  if (k === 'arrowleft'  || k === 'a') { InputState.keys.left = true; }
  if (k === 'arrowright' || k === 'd') { InputState.keys.right = true; }
  if (k === ' ')  {
    tryFocus();
    e.preventDefault();
  }
  if (k === 'shift') {
    tryBomb();
    e.preventDefault();
  }
  /* 用鍵盤揀機體 */
  if (fsm.cur === STATE.SHIP_SELECT) {
    if (k === 'a') pickShipAndStart('A');
    if (k === 'b') pickShipAndStart('B');
    if (k === 'c') pickShipAndStart('C');
  }
  if (fsm.cur === STATE.CHOICE) {
    /* 按 1/2/3 揀卡（PLAN v2 #3 可重複） */
    if (k === '1') { applyPickedUpgrade(0); advanceStage(); }
    else if (k === '2') { applyPickedUpgrade(1); advanceStage(); }
    else if (k === '3') { applyPickedUpgrade(2); advanceStage(); }
    else if (k === 'escape' || k === 'enter') {
      /* 跳過 —— 同時揀第一張做預設，保證唔會卡死 */
      applyPickedUpgrade(0);
      advanceStage();
    }
  }
  /* PLAN：任務失敗／勝利 → [重試] / [標題] */
  if (fsm.cur === STATE.GAMEOVER || fsm.cur === STATE.VICTORY) {
    if (k === 'r' || k === 'enter') { goRetry(); e.preventDefault(); }
    else if (k === 't' || k === 'escape') { goTitle(); e.preventDefault(); }
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup'    || k === 'w') InputState.keys.up    = false;
  if (k === 'arrowdown'  || k === 's') InputState.keys.down  = false;
  if (k === 'arrowleft'  || k === 'a') InputState.keys.left  = false;
  if (k === 'arrowright' || k === 'd') InputState.keys.right = false;
});

function pickShipAndStart(id) {
  pickShip(id);
  fsm.set(STATE.STAGE_1);
}

/* ---- 版面幾何：render 同 hit-test 共用同一份數據 ----
   P0：原本 CHOICE 卡 render 用 cardH=108 / cardY=VIEW_H/2-50，但
   hit test 用 cardH=96 / cardY=VIEW_H/2-40，令每張卡頂部 10px、
   底部 2px 點唔中。船選擇畫面亦同樣縮細咗 hitbox。
   現在兩邊都行同一個函數，唔會再 drift。 */
function choiceLayout() {
  const cardW = 88, cardH = 108, gap = 12;
  const startX = (VIEW_W - (cardW * 3 + gap * 2)) / 2;
  const cardY = VIEW_H / 2 - 50;
  return {
    cardW, cardH, gap, startX, cardY,
    rect: (i) => ({ x: startX + i * (cardW + gap), y: cardY, w: cardW, h: cardH }),
  };
}
function hitChoiceCard(px, py) {
  const L = choiceLayout();
  if (py < L.cardY || py > L.cardY + L.cardH) return -1;
  for (let i = 0; i < 3; i++) {
    const r = L.rect(i);
    if (px >= r.x && px <= r.x + r.w) return choiceOffer[i] ? i : -1;
  }
  return -1;   /* 12px 卡片間隙：唔當成點中右邊張卡 */
}

function shipCardsLayout() {
  const w = 72, h = 84;
  const y = VIEW_H / 2;
  return {
    w, h, y,
    rect: (i) => ({ x: 60 + i * 100 - w / 2, y: y - 40, w, h }),
  };
}
function hitShipCard(px, py) {
  const L = shipCardsLayout();
  for (let i = 0; i < 3; i++) {
    const r = L.rect(i);
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return 'ABC'[i];
  }
  return null;
}

/* ---------- 結算畫面離開按鈕（PLAN：任務失敗 [重試]/[標題]，勝利同樣） ---------- */
function endScreenBtns() {
  /* 觸控目標 ≥64×64，排喺底部一行（PLAN v2 #20） */
  const w = 128, h = 64, gap = 16;
  const total = w * 2 + gap;
  const startX = (VIEW_W - total) / 2;
  const y = VIEW_H - 100;
  return {
    retry: { x: startX, y, w, h, label: '重試' },
    title: { x: startX + w + gap, y, w, h, label: '標題' },
  };
}
function hitEndBtn(px, py) {
  const b = endScreenBtns();
  const inside = (r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  if (inside(b.retry)) return 'retry';
  if (inside(b.title)) return 'title';
  return null;
}
function drawEndBtns() {
  const b = endScreenBtns();
  for (const key of ['retry', 'title']) {
    const r = b[key];
    ctx.fillStyle = key === 'retry' ? 'rgba(0,80,60,0.95)' : 'rgba(0,40,60,0.95)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = key === 'retry' ? '#0f6' : '#0ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(r.label, r.x + r.w / 2, r.y + r.h / 2);
  }
  ctx.textBaseline = 'alphabetic';
  ctx.font = '10px monospace';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.fillText('R / Enter = 重試 · T / Esc = 返回標題', VIEW_W / 2, VIEW_H - 22);
}
function resetRunFresh() {
  runStartMs = null;
  stageStartMs = null;
  pausedAtMs = null;
  playerStacks = Object.create(null);
  ship = null;

  finalScore = 0;
  bossSpawned = false;
  waveQueueDoneAt = null;
  grazeCount = 0;
  grazeEnergy = 0;
  grazeScoreTotal = 0;
  grazeRingT = 0;
  grazeFlash = 0;
  focusActiveUntil = 0;
  focusCDUntil = 0;
  bombCDUntil = 0;
  iFrameUntil = 0;
  particles.length = 0;
  screenFlash = 0;

}
function goRetry() {
  resetRunFresh();
  fsm.set(STATE.SHIP_SELECT);
}
function goTitle() {
  resetRunFresh();

}

/* ---------- 8. TAB VISIBILITY + CLOCKS (PLAN v2 #17 + §Score 全程) ---------- */
let runStartMs   = null;   /* full-run anchor; only set on STAGE_1 start; freeze-shifted */
let stageStartMs = null;   /* per-stage anchor for WAVE_TEMPLATES; reset each STAGE_n */
let pausedAtMs   = null;   /* freeze start (tab PAUSED or CHOICE modal); null = live */
let pauseReason  = null;   /* 'tab' | 'manual' | null —— 分辨分頁暫停同手動暫停 */
function beginFreezeClocks() {
  if (pausedAtMs === null) pausedAtMs = performance.now();
}
function endFreezeClocks() {
  /* PLAN v2 #17：恢復時絕對唔可以補時間 —— 錨點順延凍結長度。 */
  if (pausedAtMs === null) return;
  const gap = performance.now() - pausedAtMs;
  if (runStartMs   !== null) runStartMs   += gap;
  if (stageStartMs !== null) stageStartMs += gap;
  pausedAtMs = null;
}

/* 手動／分頁暫停共用入口。fsm.set(PAUSED) 只改 tip，唔清實體。 */
function enterPause(reason) {
  if (fsm.cur === STATE.PAUSED) return false;
  if (!isStage(fsm.cur)) return false;
  beginFreezeClocks();
  fsm.prev = fsm.cur;
  pauseReason = reason || 'manual';
  fsm.set(STATE.PAUSED);
  hudEl.paused.textContent = pauseReason === 'tab' ? '⏸ 已隱藏' : '⏸ 手動暫停';
  console.log('[暫停]', pauseReason, '@', (performance.now()/1000).toFixed(2) + '秒');
  return true;
}
function resumePause() {
  if (fsm.cur !== STATE.PAUSED) return false;
  const resumeTo = (fsm.prev && isStage(fsm.prev))
    ? fsm.prev
    : (STAGES[Math.max(0, (lastStage || 1) - 1)] || STATE.STAGE_1);
  /* 繞過 fsm.set()，避免 onStateEnter 重置清走場上子彈／敵機 */
  fsm.cur = resumeTo;
  fsm.prev = STATE.PAUSED;
  endFreezeClocks();
  pauseReason = null;
  InputState.dragId = null;
  InputState.keys.up = InputState.keys.down = InputState.keys.left = InputState.keys.right = false;
  hudEl.state.textContent = `狀態：${stateLabel(resumeTo)}`;
  hudEl.paused.textContent = '';
  if (STAGE_TABLE[lastStage]) {
    hudEl.tip.textContent = `第 ${lastStage} 關 · ${STAGE_TABLE[lastStage].name} · 滑鼠跟機／拖曳／WASD · 自動開火 · 空白聚焦 · Shift 炸彈 · P 暫停`;
  }
  console.log(`[狀態機] 已暫停 → ${stateLabel(resumeTo)} @ ${(performance.now()/1000).toFixed(2)}秒（唔補時間）`);
  return true;
}

/* 暫停掣：右上角 ≥56px，智慧白板可撳；唔同聚焦／炸彈重疊 */
function pauseBtnRect() {

}
function hitPauseBtn(px, py) {

  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

function drawPauseBtn() {

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    /* 關卡中 → 分頁暫停；已手動暫停則保持（時鐘已凍） */
    if (isStage(fsm.cur)) {
      enterPause('tab');
    }
  } else {
    /* 只有分頁暫停先自動恢復；手動暫停要玩家自己撳 */
    if (fsm.cur === STATE.PAUSED && pauseReason === 'tab') {
      resumePause();
    }
  }
});

/* ---------- 9. 關卡流程 ---------- */
function advanceStage() {
  /* 由強化選擇觸發：入下一關（最後一關 boss 擊破就勝利）。 */
  if (fsm.cur === STATE.CHOICE) {
    const next = lastStage + 1;
    if (next > STAGES.length) {
      fsm.set(STATE.VICTORY);
    } else {
      fsm.set(STAGES[next - 1]);
    }
    return;
  }
  /* 其他呼叫者：由當前 STAGE_n 順序推下一關 */
  const idx = STAGES.indexOf(fsm.cur);
  if (idx >= 0 && idx < STAGES.length - 1) {
    fsm.set(STAGES[idx + 1]);
  } else if (idx === STAGES.length - 1) {
    fsm.set(STATE.VICTORY);
  } else {
    fsm.set(STATE.STAGE_1);
  }
}

/* ---------- 10. 邏輯更新（PLAN v2 #13 固定 60 FPS） ---------- */
let finalScore = 0;          /* computed on VICTORY entry; displayed on render */
let victoryRunSec = 0;       /* frozen full-run seconds at VICTORY entry */
let victoryTimeBonus = 0;    /* frozen timeBonus at VICTORY entry */

/* localStorage 持久化（PLAN v2 #22） */
const LS_KEY_SCORE = 'dsf.bestScore';
const LS_KEY_TIME  = 'dsf.bestTime';
let bestScore = 0, bestTime = 0;
function lsRead(key) {
  try {
    const v = parseFloat(localStorage.getItem(key));
    return Number.isFinite(v) ? v : 0;
  } catch (e) { return 0; }       /* private mode / disabled LS */
}
function lsWrite(key, val) {

}
bestScore = lsRead(LS_KEY_SCORE);
bestTime  = lsRead(LS_KEY_TIME);

/* 聚焦／炸彈冷卻（PLAN v2 #6-#7）—— 啟動時由戰機讀取時長同冷卻 */
const BOMB_IFRAME_MS = 1500;
let focusActiveUntil = 0;    /* perf.now() ms */
let focusCDUntil    = 0;
let bombCDUntil     = 0;
let iFrameUntil     = 0;
function isFocusActive() { return performance.now() < focusActiveUntil; }
function isIFramed()    { return performance.now() < iFrameUntil; }
function focusSlowFactor() {
  if (!isFocusActive()) return 1.0;
  const f = ship && ship.focusFactor != null ? ship.focusFactor : 0.3;
  return f;
}
function tryFocus() {
  if (!isStage(fsm.cur) || !ship) return false;
  const now = performance.now();
  if (now < focusCDUntil) return false;
  const dur = ship.focusDuration || 4000;
  const cd  = ship.focusCD || 8000;
  focusActiveUntil = now + dur;
  focusCDUntil     = focusActiveUntil + cd;   /* CD starts after focus ends */
  console.log('[聚焦] 開啟', (dur/1000).toFixed(1) + '秒 · 係數', ship.focusFactor, '@', (now/1000).toFixed(2));
  return true;
}
function tryBomb() {
  if (!isStage(fsm.cur) || !ship) return false;
  const now = performance.now();
  if (now < bombCDUntil) return false;
  const cd = ship.bombCD || 12000;
  bombCDUntil = now + cd;
  iFrameUntil = now + BOMB_IFRAME_MS;
  /* 清除敵方彈幕（子彈 + 雷射） */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const k = enemies[i].kind;
    if (k === 'bullet' || k === 'laser') enemies.splice(i, 1);
  }
  if (ship) spawnBoom(ship.x, ship.y);
  screenFlash = Math.max(screenFlash, 0.7);
  console.log('[炸彈] 開啟無敵', (BOMB_IFRAME_MS/1000).toFixed(1) + '秒 · 冷卻', (cd/1000).toFixed(1) + '秒 @', (now/1000).toFixed(2));
  return true;
}
function abilityBtns() {
  /* 觸控 ≥64×64，底部兩角 —— 先判按鈕，避免同拖曳衝突 */
  const w = 64, h = 64, m = 8;
  return {
    focus: { x: m, y: VIEW_H - h - m, w, h, label: '聚焦' },
    bomb:  { x: VIEW_W - w - m, y: VIEW_H - h - m, w, h, label: '炸彈' },
  };
}
function hitAbilityBtn(px, py) {
  const b = abilityBtns();
  const inside = (r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  if (inside(b.focus)) return 'focus';
  if (inside(b.bomb))  return 'bomb';
  return null;
}
function drawAbilityBtns() {
  if (!isStage(fsm.cur)) return;
  const now = performance.now();
  const b = abilityBtns();
  const items = [
    { key: 'focus', ready: now >= focusCDUntil, active: isFocusActive(),
      cdLeft: Math.max(0, focusCDUntil - now) },
    { key: 'bomb',  ready: now >= bombCDUntil,  active: isIFramed(),
      cdLeft: Math.max(0, bombCDUntil - now) },
  ];
  for (const it of items) {
    const r = b[it.key];
    ctx.fillStyle = it.active ? 'rgba(255,255,0,0.35)'
                  : it.ready  ? 'rgba(0,60,80,0.85)'
                              : 'rgba(30,30,30,0.75)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = it.active ? '#ff0' : it.ready ? '#0ff' : '#555';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    const icon = it.key === 'focus' ? 'ui_focus' : 'ui_bomb';
    const iconDrawn = drawSprite(icon, r.x + r.w/2, r.y + r.h/2 - 6, 1);
    ctx.fillStyle = it.ready || it.active ? '#fff' : '#888';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (!iconDrawn) ctx.fillText(r.label, r.x + r.w/2, r.y + r.h/2 - 8);
    ctx.font = '9px monospace';
    if (it.active) {
      ctx.fillStyle = '#ff0';
      ctx.fillText('生效中', r.x + r.w/2, r.y + r.h - 12);
    } else if (!it.ready) {
      ctx.fillStyle = '#f06';
      ctx.fillText(Math.ceil(it.cdLeft/1000) + '秒', r.x + r.w/2, r.y + r.h - 12);
    } else {
      ctx.fillStyle = '#0f6';
      ctx.fillText('就緒', r.x + r.w/2, r.y + r.h - 12);
    }
  }
  ctx.textBaseline = 'alphabetic';
}

function tick(dtMs) {
  /* 非遊戲狀態下凍結 */
  if (!isStage(fsm.cur)) return;

  /* ---- 波次排程：到達關卡時間目標就產生波次 ---- */
  if (stageStartMs) {
    const stageMs = performance.now() - stageStartMs;
    while (waveCursor < waveQueue.length && waveQueue[waveCursor].at <= stageMs) {
      const w = waveQueue[waveCursor];
      for (const s of w.spawn) emitWaveType(s, lastStage);
      waveCursor++;
    }
  }

  /* ---- P1-5：波次清完之後先召喚 boss ----
     條件：波次佇列出齊 + 場上冇雜魚。
     保險：如果雜魚一直清唔走（例如玩家唔理佢，任由佢飛出畫面），
     8 秒後強制召喚，避免卡住成關。 */
  if (!bossSpawned && stageStartMs) {
    if (waveCursor >= waveQueue.length) {
      if (waveQueueDoneAt === null) waveQueueDoneAt = performance.now();
      const noGrunts = !enemies.some(e => e.kind === 'grunt' && !e._dead);
      if (noGrunts || performance.now() - waveQueueDoneAt > 8000) {
        spawnBossFor(lastStage);
        bossSpawned = true;
        waveQueueDoneAt = null;
      }
    }
  }

  /* ---- 戰機移動（鍵盤優先，否則收斂到拖曳目標） ---- */
  let vx = 0, vy = 0;
  if (InputState.keys.left)  vx -= 1;
  if (InputState.keys.right) vx += 1;
  if (InputState.keys.up)    vy -= 1;
  if (InputState.keys.down)  vy += 1;
  if (vx || vy) {
    InputState.device = 'key';
    const len = Math.hypot(vx, vy);
    const step = ship.speed * (dtMs / 16.67);  /* ship.speed is per-frame @60fps */
    ship.x = clamp(ship.x + (vx/len) * step, 8, VIEW_W - 8);
    ship.y = clamp(ship.y + (vy/len) * step, 8, PLAY_BOTTOM);
    InputState.targetX = ship.x;
    InputState.targetY = ship.y;
  } else {
    /* P0-4：拖曳朝 target 行，但每幀最多行 ship.speed * DRAG_SPEED_MULT。
       唔再瞬移，所以 spd_s / spd_l 喺觸控平台真係有用。 */
    const step = ship.speed * DRAG_SPEED_MULT * (dtMs / 16.67);
    const dx = InputState.targetX - ship.x;
    const dy = InputState.targetY - ship.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.01) {
      const k = Math.min(1, step / d);
      ship.x += dx * k;
      ship.y += dy * k;
    }
    ship.x = clamp(ship.x, 8, VIEW_W - 8);
    ship.y = clamp(ship.y, 8, PLAY_BOTTOM);
  }

  /* ---- 自動開火（PC／觸控都唔使撳射；只需移動） ---- */
  ship.fireCD -= dtMs;
  if (ship.fireCD <= 0) {
    const n = Math.max(1, ship.bulletCount | 0);
    const mid = (n - 1) / 2;
    const spread = n <= 2 ? 0.08 : 0.12;   /* rad fan; 2-way stays tight */
    const spd = 0.30;
    const dmg = ship.bulletDmg || 1;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i - mid) * spread;  /* upward */
      bullets.push({
        x: ship.x + (i - mid) * 4,
        y: ship.y - 8,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        owner: 'player',
        dmg,
        /* P1-5：貫穿餘額（P1-5 之前呢個欄位從來冇寫入過） */
        pierceLeft: ship.pierce || 0,
        _lastHit: null,
      });
    }
    ship.fireCD = 1000 / ship.fireRate;
  }

  /* ---- 玩家子彈移動（原本漏咗，令子彈卡喺槍口） ---- */
  for (const b of bullets) {
    if (b.owner !== 'player') continue;
    b.x += b.vx * dtMs;
    b.y += b.vy * dtMs;
  }

  /* ---- 聚焦同炸彈由按鍵觸發並檢查冷卻；
       清彈喺觸發當下處理，無敵時段喺碰撞時判斷。 ---- */

  /* ---- 敵機更新（boss 招式各自不同） ---- */
  for (const e of enemies) {
    if (e._dead) continue;        /* 屍體唔再郁，正式移除交由 cull */
    if (e.kind === 'spiral') {
      e.t += dtMs;
      /* 8 字形路徑（預設） */
      e.x = VIEW_W/2 + Math.cos(e.t / 600) * 80;
      e.y = 80       + Math.sin(e.t / 400) * 30;
      e.ang0 = e.t / 1000;

      /* 各招式的射速、彈數、彈速 */
      const P = e.pattern || 'A';
      let nWay = 8, fireEvery = 1000, bulletSpd = 0.06;
      if (P === 'A') {                       /* stage 1: classic 8-way */
        nWay = 8; fireEvery = 1000; bulletSpd = 0.06;
      } else if (P === 'B') {                /* stage 2: 12-way wider */
        nWay = 12; fireEvery = 900; bulletSpd = 0.05;
      } else if (P === 'C') {                /* stage 3: 8-way + slow rotation */
        nWay = 8; fireEvery = 750; bulletSpd = 0.07;
      } else if (P === 'D') {                /* stage 4: 16-way slow */
        nWay = 16; fireEvery = 1300; bulletSpd = 0.04;
      } else if (P === 'E') {                /* stage 5: 12-way faster */
        nWay = 12; fireEvery = 700; bulletSpd = 0.07;
      }

      e.spiralCD = (e.spiralCD || 0) + dtMs;
      if (e.spiralCD >= fireEvery) {
        e.spiralCD -= fireEvery;
        for (let i = 0; i < nWay; i++) {
          const a = e.ang0 + i * (Math.PI * 2 / nWay);
          enemies.push({ kind:'bullet', x: e.x, y: e.y, vx: Math.cos(a)*bulletSpd, vy: Math.sin(a)*bulletSpd });
        }
      }

      /* E 招式：每 4.5 秒追加一次慢雷射（待決問題 #2 部分實作） */
      if (P === 'E' || P === 'D') {
        e.laserCD = (e.laserCD || 0) - dtMs;
        if (e.laserCD <= 0) {
          /* 雷射預警 600 毫秒，之後先發射 */
          e.laserWarn = (e.laserWarn === undefined) ? 600 : e.laserWarn - dtMs;
          if (e.laserWarn <= 0 && !e.laserFiring) {
            /* 發射：1 發瞄準戰機嘅高速彈 */
            const sx = ship ? ship.x : VIEW_W/2;
            const a = Math.atan2(ship ? ship.y - e.y : VIEW_H/2, sx - e.x);
            enemies.push({ kind:'laser', x: e.x, y: e.y, vx: Math.cos(a)*0.20, vy: Math.sin(a)*0.20, lifeMs: 1500 });
            e.laserFiring = true;
            setTimeout(() => { e.laserFiring = false; }, 100);
            e.laserCD = 4500;
            e.laserWarn = undefined;
          }
        }
      }
    } else if (e.kind === 'laser') {
      /* 聚焦令敵方彈幕減速（PLAN v2 #6；係數由戰機決定） */
      const slow = focusSlowFactor();
      e.x += e.vx * dtMs * slow;
      e.y += e.vy * dtMs * slow;
      e.lifeMs -= dtMs;
      if (e.lifeMs <= 0) {
        e._dead = true;
      }
    } else if (e.kind === 'bullet') {
      const slow = focusSlowFactor();
      e.x += e.vx * dtMs * slow;
      e.y += e.vy * dtMs * slow;
    } else if (e.kind === 'grunt') {
      /* ---- P1-5 雜魚 AI：慢慢落下 + 蛇形擺動 + 間歇瞄準射擊 ----
         俯衝型快好多，用嚟考走位。 */
      e.t += dtMs;
      if (!e.diving) {
        e.x += Math.sin(e.t / 620) * e.sway * dtMs;
      } else {
        /* 俯衝：落到底就加速，形成壓迫感 */
        e.vy += 0.000012 * dtMs;
      }
      e.x = clamp(e.x, 12, VIEW_W - 12);
      e.y += e.vy * dtMs;

      e.fireCD -= dtMs;
      if (e.fireCD <= 0 && e.y > 24 && e.y < VIEW_H - 120) {
        e.fireCD = e.elite ? 1500 : 2800;
        const sx = ship ? ship.x : VIEW_W / 2;
        const sy = ship ? ship.y : VIEW_H - 60;
        const base = Math.atan2(sy - e.y, sx - e.x);
        const n = e.elite ? 3 : 1;
        const spd = e.elite ? 0.075 : 0.06;
        for (let i = 0; i < n; i++) {
          const a = base + (i - (n - 1) / 2) * 0.24;
          enemies.push({ kind:'bullet', x: e.x, y: e.y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd });
        }
      }
      /* 精英第一次開火之前先顯示詞綴，等玩家睇得見 */
      if (e.elite && !e.label) e.label = '精英 · ' + e.affix;
    }
  }

  /* ---- 碰撞：玩家子彈 vs 敵機（boss 同雜魚） ---- */
  for (const e of enemies) {
    if (e.kind !== 'spiral' && e.kind !== 'grunt') continue;
    if (e._dead) continue;          /* 已經死咗，唔可以再計多次分 */
    const halfW = (e.kind === 'spiral') ? 12 : 8;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.owner !== 'player') continue;
      if (Math.abs(b.x - e.x) < halfW && Math.abs(b.y - e.y) < halfW) {
        /* 貫穿：仲有餘數就唔清走粒彈，繼續打下一個目標。
           b._lastHit 防止同一粒彈喺連續幾幀重複扣同一隻怪嘅血。 */
        if (b.pierceLeft > 0) {
          if (e === b._lastHit) continue;
          b.pierceLeft--;
          b._lastHit = e;
        } else {
          bullets.splice(i, 1);
        }
        e.hp -= (b.dmg || 1);
        spawnSparks(b.x, b.y, 3, 0.08);
        if (e.hp <= 0) {
          spawnBoom(e.x, e.y);
          if (e.kind === 'spiral') {
            console.log('[擊破] boss @', (performance.now()/1000).toFixed(2));
            /* P1-5：加入雜魚之後雜魚分數佔大多數，boss 係場面高潮，
               所以由 200 調高做 800（約佔總分三成）。見 PLAN #27。 */
            runScore += BOSS_SCORE;
            runKills++;
            /* 第五關 boss 擊破 → 勝利；其他 → 強化選擇 */
            if (lastStage >= STAGES.length) {
              fsm.set(STATE.VICTORY);
            } else {
              fsm.set(STATE.CHOICE);
            }
            return;
          }
          runScore += (e.score || GRUNT_SCORE);
          runKills++;
          runGrunts++;
          /* ⚠️ 必須標記死亡：雜魚唔會即時離開 enemies 陣列，
             如果唔標，疊喺屍體上嘅子彈會喺之後每一幀再扣一次血，
             再加一次分 —— 變成無限刷分。boss 原本因為即刻轉狀態
             所以掩蓋咗呢個問題。真正移除交由下方 cull 處理。 */
          e._dead = true;
          if (e.elite) console.log('[擊破] 精英「' + e.affix + '」· +' + (e.score || ELITE_SCORE));
          break;
        }
        break;
      }
    }
  }

  /* ---- 碰撞：敵方子彈、雷射同雜魚撞擊 vs 戰機 ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.kind !== 'bullet' && e.kind !== 'laser' && e.kind !== 'grunt') continue;
    /* P1-5：雜魚有撞擊傷害 —— 撞到玩家會自己死。
       冇呢條規則嘅話，最優策略就係完全唔理雜魚任由佢飛走，
       「擊殺雜魚」變成冇誘因，等 P1-5 個設計目標失效。 */
    const isBody = (e.kind === 'grunt');
    const r = isBody ? 9 : 4;
    if (Math.abs(e.x - ship.x) < 6 + r && Math.abs(e.y - ship.y) < 6 + r) {
      /* PLAN v2 #7：炸彈無敵時段 —— 施放後 1.5 秒內唔受傷。
         視覺上仍然清走嗰粒彈，等玩家見到擋成功咗。 */
      if (isIFramed() || GOD) {
        if (isBody) { spawnSparks(e.x, e.y, 6, 0.12); enemies.splice(i, 1); }
        else enemies.splice(i, 1);
        if (GOD) { ship.hp = ship.maxHp; ship.shield = SHIPS[ship.chassis].shield; }
        continue;
      }
      enemies.splice(i, 1);
      if (isBody) spawnBoom(e.x, e.y); else spawnSparks(ship.x, ship.y, 6, 0.14);
      hitShake = 1;
      screenFlash = Math.max(screenFlash, 0.35);
      if (ship.shield > 0) {
        ship.shield -= 1;
      } else {
        ship.hp -= 1;
        if (ship.hp <= 0) {
          /* life_st 復活：消耗一次機會、補滿血、送 2.5 秒無敵，
             否則先判定 GAME OVER。之前呢個欄位只係寫入從來冇讀過。 */
          if (ship.resurrect > 0) {
            ship.resurrect -= 1;
            ship.hp = ship.maxHp;
            iFrameUntil = performance.now() + 2500;
            spawnBoom(ship.x, ship.y);
            screenFlash = Math.max(screenFlash, 0.6);
            console.log('[復活] 消耗 1 次 · 剩餘', ship.resurrect);
            continue;
          }
          console.log('[戰機] 被擊毀');
          spawnBoom(ship.x, ship.y);
          fsm.set(STATE.GAMEOVER);
          return;
        }
      }
    } else if (!isBody && !e._grazed) {
      /* ---- P1-6 擦彈判定 ----
         用圓形距離（唔係上面嗰個方形），令斜向擦過都算數。
         必須 `else if`：已經判中嘅彈唔可以同時當擦彈。
         `_grazed` 保證每粒子彈只計一次 —— 一粒子彈喺 20px 圈內
         大約停留 20–40 幀，冇呢個旗標會被重複計幾十次。 */
      const dx = e.x - ship.x, dy = e.y - ship.y;
      if (Math.hypot(dx, dy) < GRAZE_RADIUS) {
        e._grazed = true;
        doGraze(ship.x + dx, ship.y + dy);
      }
    }
  }

  /* ---- 清除離畫面實體 ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e._dead) { enemies.splice(i, 1); continue; }
    if (e.kind === 'bullet' && (e.x < -16 || e.x > VIEW_W + 16 || e.y < -16 || e.y > VIEW_H + 16)) {
      enemies.splice(i, 1);
    } else if (e.kind === 'laser' && (e.lifeMs !== undefined && e.lifeMs <= 0)) {
      enemies.splice(i, 1);
    } else if (e.kind === 'grunt' && (e.y > VIEW_H + 20 || e.y < -40 || e.x < -24 || e.x > VIEW_W + 24)) {
      /* 雜魚飛出畫面 = 走脫，唔計分。令玩家有動機主動擊殺，
         而唔係「閃埋唔打」就過關。 */
      enemies.splice(i, 1);
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.y < -8 || b.y > VIEW_H + 8 || b.x < -8 || b.x > VIEW_W + 8) {
      bullets.splice(i, 1);
    }
  }

  /* ---- 狀態列 ---- */
  const now = performance.now();
  const focusState = isFocusActive()
    ? `聚焦生效 ×${(ship.focusFactor != null ? ship.focusFactor : 0.3).toFixed(1)}`
    : `聚焦冷卻 ${Math.max(0, Math.ceil((focusCDUntil - now)/1000))} 秒`;
  const bombState  = isIFramed()
    ? `炸彈無敵 ${(Math.max(0, iFrameUntil - now)/1000).toFixed(1)} 秒`
    : (bombCDUntil > now ? `炸彈冷卻 ${Math.max(0, Math.ceil((bombCDUntil - now)/1000))} 秒` : '炸彈就緒');
  hudEl.hp.textContent = `生命：${ship.hp}  護盾：${ship.shield}  分數：${Math.floor(runScore)}`;
  hudEl.tip.textContent = `${focusState} · ${bombState}`;
  /* 必須喺 tip 賦值之後，否則下一行會即刻覆蓋咗 */
  if (DEBUG) {
    hudEl.tip.textContent =
      `擊殺 ${runKills}（雜魚 ${runGrunts} · boss ${runKills - runGrunts}）　擦彈 ${grazeCount}（能量 ${grazeEnergy}/${GRAZE_ENERGY_NEED}）　` +
      hudEl.tip.textContent;
  }
}

/* ---------- 11. 繪製 ---------- */

  if (fsm.cur === STATE.VICTORY) {

    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    drawSprite('gate', VIEW_W/2, VIEW_H/2 - 110, 1.6);
    if (isNewBest) {
      ctx.fillStyle = 'rgba(255,255,0,0.18)';
      ctx.fillRect(0, VIEW_H/2 - 100, VIEW_W, 24);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 14px monospace';

      ctx.fillText('★ 新紀錄 ★', VIEW_W/2, VIEW_H/2 - 82);
    }
    ctx.fillStyle = '#0f6';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#0f6';
    ctx.shadowBlur = 12;
    ctx.fillText('逃出生天', VIEW_W/2, VIEW_H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.font = '14px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('全 5 關完成 · 用時 ' + finalRunSec.toFixed(1) + ' 秒', VIEW_W/2, VIEW_H/2 - 4);
    ctx.fillStyle = '#ff6';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('分數：' + scoreDisplay, VIEW_W/2, VIEW_H/2 + 28);
    ctx.font = '11px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('（擊殺 ' + Math.floor(runScore - grazeScoreTotal)
               + ' + 擦彈 ' + Math.floor(grazeScoreTotal) + '（' + grazeCount + ' 次）'
               + ' + 時間獎金 ' + Math.floor(timeBonus) + '）', VIEW_W/2, VIEW_H/2 + 48);
    ctx.fillStyle = '#ff6';
    ctx.fillText('最佳：' + Math.floor(bestScore) + ' · ' + bestTime.toFixed(1) + ' 秒', VIEW_W/2, VIEW_H/2 + 72);
    drawEndBtns();
    drawScanlines(); drawFlash();
    ctx.restore();
    return;
  }

  if (fsm.cur === STATE.CHOICE) {
    const L = choiceLayout();
    const cardW = L.cardW, cardH = L.cardH, startX = L.startX, cardY = L.cardY;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#ff6';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('選擇 — 揀一個強化', VIEW_W/2, cardY - 18);
    for (let i = 0; i < 3; i++) {
      const up = choiceOffer[i];
      if (!up) continue;
      const r = L.rect(i);
      const x = r.x, y = r.y;
      const grd = ctx.createLinearGradient(x, y, x, y + cardH);
      grd.addColorStop(0, 'rgba(0,60,90,0.95)');
      grd.addColorStop(1, 'rgba(0,20,40,0.95)');
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cardW, cardH);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.strokeRect(x + 3, y + 3, cardW - 6, cardH - 6);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(up.icon, x + cardW/2, y + 32);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#0ff';
      ctx.fillText(up.nameZh, x + cardW/2, y + 52);
      ctx.font = '10px monospace';
      ctx.fillStyle = '#bcd';
      /* 中文逐字斷行；Array.from 先拆 code point，唔會切爛 emoji */
      const descLines = [];
      {
        const chars = Array.from(up.desc);
        for (let li = 0; li < chars.length; li += 9) descLines.push(chars.slice(li, li + 9).join(''));
      }
      for (let li = 0; li < Math.min(descLines.length, 3); li++) {
        ctx.fillText(descLines[li], x + cardW/2, y + 68 + li * 11);
      }
      const n = playerStacks[up.id] || 0;
      if (n > 0) {
        ctx.fillStyle = '#0f6';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('x' + n, x + cardW - 6, y + 14);
      }
      ctx.fillStyle = '#ff6';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('[' + (i+1) + '] 點擊', x + cardW/2, y + cardH - 8);
    }
    drawScanlines(); drawFlash();
    ctx.restore();
    return;
  }

  /* ---- 遊戲畫面 ---- */
  for (const b of bullets) {
    if (b.owner === 'player') {
      if (!drawSprite('bullet_p', b.x, b.y, 1.4)) {
        ctx.fillStyle = '#0ff';
        ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
      }
    }
  }
  for (const e of enemies) {
    if (e._dead) continue;
    if (e.kind === 'grunt') {
      /* pxl：grunt / dive / elite 機頭朝下；失敗先回退三角 */
      const frac = clamp(e.hp / (e.maxHp || 1), 0, 1);
      const spr = e.elite ? 'elite' : (e.diving ? 'dive' : 'grunt');
      const scale = e.elite ? 2.0 : (e.diving ? 1.7 : 1.55);
      const drawn = drawSprite(spr, e.x, e.y, scale);
      const R = e.elite ? 12 : (e.diving ? 9 : 8);
      if (!drawn) {
        ctx.fillStyle = e.elite
          ? (frac > 0.4 ? '#ffd54a' : '#ff9a3c')
          : (e.diving
            ? (frac > 0.4 ? '#ff9a4a' : '#ff6a30')
            : (frac > 0.4 ? '#ff9ec4' : '#ff6f9c'));
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + R);
        ctx.lineTo(e.x - R * 0.85, e.y - R * 0.7);
        ctx.lineTo(e.x + R * 0.85, e.y - R * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = e.elite ? '#fff3c4' : '#ffd0e4';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      if (e.elite) {
        ctx.strokeStyle = 'rgba(255,220,120,0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(e.x, e.y, R + 4, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(e.x - 14, e.y - R - 10, 28, 3);
        ctx.fillStyle = frac > 0.4 ? '#ffd54a' : '#ff6b3c';
        ctx.fillRect(e.x - 14, e.y - R - 10, 28 * frac, 3);
      } else if (frac < 0.99) {
        /* 普通／俯衝：受傷先出生命條，減少畫面噪音 */
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - 8, e.y - R - 5, 16, 2);
        ctx.fillStyle = e.diving
          ? (frac > 0.4 ? '#ffc090' : '#ff6a30')
          : (frac > 0.4 ? '#ffc8dd' : '#ff6f9c');
        ctx.fillRect(e.x - 8, e.y - R - 5, 16 * frac, 2);
      }
      if (e.label) {
        ctx.fillStyle = '#ffe9a8';
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + R + 11);
      }
    } else if (e.kind === 'bullet') {
      if (!drawSprite('bullet_e', e.x, e.y, 1.2)) {
        ctx.fillStyle = '#f6c';
        ctx.fillRect(e.x - 2, e.y - 2, 4, 4);
      }
    } else if (e.kind === 'spiral') {
      if (!drawSprite('boss', e.x, e.y, 2.6)) {
        ctx.fillStyle = '#f06';
        ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, Math.PI * 2); ctx.fill();
      }
      const totalHp = e.maxHp || STAGE_TABLE[e.stage || lastStage].bossHp;
      const hpFrac = Math.max(0, Math.min(1, e.hp / totalHp));
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - 18, e.y - 24, 36, 5);
      ctx.fillStyle = hpFrac > 0.5 ? '#0f6' : (hpFrac > 0.25 ? '#ff6' : '#f06');
      ctx.fillRect(e.x - 18, e.y - 24, 36 * hpFrac, 5);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(e.x - 18, e.y - 24, 36, 5);
      if ((e.pattern === 'E' || e.pattern === 'D') && e.laserWarn !== undefined && e.laserWarn > 0 && !e.laserFiring) {
        ctx.strokeStyle = '#ff6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, 22, 0, Math.PI * 2); ctx.stroke();
      }
      if (e.label) {
        ctx.fillStyle = '#fff';
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + 30);
      }
    } else if (e.kind === 'laser') {
      if (!drawSprite('laser', e.x, e.y, 1.5)) {
        ctx.fillStyle = '#ff0';
        ctx.fillRect(e.x - 3, e.y - 3, 6, 6);
      }
      ctx.strokeStyle = 'rgba(255,220,0,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x - e.vx * 60, e.y - e.vy * 60);
      ctx.stroke();
    }
  }
  if (ship) {
    /* 推進器焰 */
    const thName = (Math.floor(performance.now() / 80) % 2) ? 'thrust_1' : 'thrust_0';
    drawSprite(thName, ship.x, ship.y + 12, 1.6);
    if (ship.shield > 0) {
      ctx.strokeStyle = 'rgba(0,255,255,' + (0.35 + 0.25*Math.sin(performance.now()/120)).toFixed(2) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 13, 0, Math.PI * 2); ctx.stroke();
    }
    const sn = SHIP_SPRITE[ship.chassis] || 'ship_a';
    if (!drawSprite(sn, ship.x, ship.y, 2.1)) {
      ctx.fillStyle = '#0ff';
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 8);
      ctx.lineTo(ship.x - 6, ship.y + 6);
      ctx.lineTo(ship.x + 6, ship.y + 6);
      ctx.closePath();
      ctx.fill();
    }
    if (isFocusActive()) {
      ctx.strokeStyle = 'rgba(255,255,0,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 15, 0, Math.PI * 2); ctx.stroke();
    }
    if (isIFramed()) {
      ctx.strokeStyle = 'rgba(255,100,200,0.5)';
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 18, 0, Math.PI * 2); ctx.stroke();
    }
  }
  /* ---------- P1-6 擦彈視覺反饋 ---------- */
function drawGrazeFx() {
  /* 光環：由擦彈點向外擴散並淡出 */
  if (grazeRingT > 0) {
    const t = grazeRingT;
    ctx.strokeStyle = 'rgba(130,255,220,' + (t * 0.75).toFixed(3) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(grazeRingX, grazeRingY, GRAZE_RADIUS * (1 - t) + 3, 0, Math.PI * 2);
    ctx.stroke();
  }
  /* 判定圈：淡淡的虛線提示，令玩家知道「呢個圈入面有分」 */
  if (ship && isStage(fsm.cur)) {
    ctx.strokeStyle = 'rgba(130,255,220,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, GRAZE_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawGrazeMeter() {
  if (!ship || !isStage(fsm.cur)) return;
  /* 能量條放喺底部正中央：兩個技能按鈕喺左右（x 8–72 / 248–312），
     戰機活動下限係 396，所以 y=446 呢條係完全空嘅位置。 */
  const w = 84, h = 5;
  const x = (VIEW_W - w) / 2, y = VIEW_H - 34;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(x, y, w, h);
  const f = clamp(grazeEnergy / GRAZE_ENERGY_NEED, 0, 1);
  ctx.fillStyle = f >= 1 ? '#ffffff' : '#4df5d0';
  ctx.fillRect(x, y, w * f, h);
  ctx.strokeStyle = grazeFlash > 0
    ? 'rgba(255,255,255,' + (0.4 + grazeFlash * 0.6).toFixed(2) + ')'
    : 'rgba(130,255,220,0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#8ff';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('擦彈 ' + grazeCount + '　' + (GRAZE_ENERGY_NEED - grazeEnergy) + ' 次回充', VIEW_W / 2, y - 4);
}

  drawAbilityBtns();
  drawHudChips();
  drawGrazeFx();
  drawGrazeMeter();
  drawPauseBtn();
  /* 關卡名標籤 */
  if (isStage(fsm.cur)) {
    const th = STAGE_THEME[lastStage] || STAGE_THEME[1];
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(VIEW_W/2 - 60, 6, 120, 16);
    ctx.fillStyle = th.accent;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('S' + lastStage + ' · ' + th.name, VIEW_W/2, 17);
  }
  drawScanlines();
  drawFlash();
  ctx.restore();
}

/* ---------- 12. 主迴圈（PLAN v2 #13 固定時間步累加器） ---------- */
let lastFrame = performance.now();
let accMs = 0;
function loop(nowMs) {
  let dt = nowMs - lastFrame;
  if (dt > MAX_FRAME_MS) dt = MAX_FRAME_MS;       /* cap huge gap (e.g., un-blur) */
  lastFrame = nowMs;
  accMs += dt;
  while (accMs >= FIXED_DT_MS) {
    tickVfx(FIXED_DT_MS);
    tick(FIXED_DT_MS);
    accMs -= FIXED_DT_MS;
  }
  /* HUD 計時：只在 STAGE_n 行進（全局累計；暫停／選擇強化靠平移錨點凍結） */
  if (isStage(fsm.cur) && runStartMs) {
    const sec = (nowMs - runStartMs) / 1000;
    hudEl.time.textContent = `時間：${sec.toFixed(1)} 秒`;
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 13. 初始設定 ---------- */
hudEl.state.textContent = `狀態：${stateLabel(fsm.cur)}`;
console.log('[啟動] 末日救未來 v0.9.3 已載入');
console.log('[啟動] 初始狀態 =', stateLabel(fsm.cur));
console.log('[啟動] 視窗 =', window.innerWidth, 'x', window.innerHeight, '· 像素比 =', window.devicePixelRatio, '· 開發者模式 =', DEBUG, '· 無敵 =', GOD);
hudEl.tip.textContent = '點擊畫面開始';
requestAnimationFrame(loop);

/* 開放俾瀏覽器冒煙測試（主控台：window.__dsf.fsm.cur） */
window.__dsf = { fsm, ship, bullets, enemies, shipS: SHIPS, stageS: STATE, InputState, SPRITE, sheetReady: () => sheetReady, drawSprite, enterPause, resumePause, pauseReason: () => pauseReason };
</script>
