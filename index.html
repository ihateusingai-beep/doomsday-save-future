/* ========== v3.10 玩家武器（form + tags）========== */
const PLAYER_BULLET_CAP = 48;
const MISSILE_CAP = 8;

function applyShotFormCosts(s) {
  if (!s) return;
  const f = s.shotForm || 'bolt';
  if (f === 'boomerang') s.fireRate *= 0.7;
  else if (f === 'missile') s.fireRate *= 0.55;
  else if (f === 'rail') s.fireRate *= 0.35;
  else if (f === 'wave') s.bulletSpd *= 0.9;
}

function countPlayerBullets(form) {
  let n = 0;
  for (const b of bullets) {
    if (b.owner !== 'player') continue;
    if (form && b.form !== form) continue;
    n++;
  }
  return n;
}

function cullPlayerBullets() {
  let n = countPlayerBullets();
  while (n > PLAYER_BULLET_CAP) {
    const i = bullets.findIndex(b => b.owner === 'player');
    if (i < 0) break;
    bullets.splice(i, 1);
    n--;
  }
}

function nearestEnemy(x, y) {
  let best = null, bestD = 1e12;
  for (const e of enemies) {
    if (e._dead) continue;
    if (e.kind !== 'spiral' && e.kind !== 'grunt') continue;
    const dx = e.x - x, dy = e.y - y;
    const d = dx*dx + dy*dy;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function pushPlayerBullet(b) {
  bullets.push(b);
  cullPlayerBullets();
}

function spawnPlayerShot() {
  if (!ship) return;
  const form = ship.shotForm || 'bolt';
  const tags = ship.shotTags || {};
  const baseDmg = (ship.bulletDmg || 1) + lootBulletDmg();
  const n = Math.max(1, ship.bulletCount | 0);
  const mid = (n - 1) / 2;
  const spread = n <= 1 ? 0 : (n <= 2 ? 0.08 : 0.12);
  let spd = ship.bulletSpd || 0.30;
  const pierce = ship.pierce || 0;

  /* rail：瞬間線，唔跟 bulletCount 扇（一條中線） */
  if (form === 'rail') {
    const x0 = ship.x, y0 = ship.y - 8;
    pushPlayerBullet({
      owner: 'player', form: 'rail', x: x0, y: y0,
      vx: 0, vy: 0, dmg: baseDmg, pierceLeft: 99,
      life: 90, maxLife: 90, isRay: true,
      _hitSet: null, tags: Object.assign({}, tags),
    });
    /* 命中交碰撞：rail 寬判定 + _railHit set 防重複 */
    sfx('shoot');
    return;
  }

  if (form === 'missile' && countPlayerBullets('missile') >= MISSILE_CAP) {
    return; /* 場上導彈滿 → 呢下唔射 */
  }

  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i - mid) * spread;
    let dmg = baseDmg;
    let vx = Math.cos(a) * spd;
    let vy = Math.sin(a) * spd;
    let life = 0, maxLife = 0, phase = 0;
    let formSpd = spd;

    if (form === 'laser') {
      dmg = baseDmg * 0.35;
      formSpd = spd * 1.35;
      vx = Math.cos(a) * formSpd;
      vy = Math.sin(a) * formSpd;
      life = maxLife = 220;
    } else if (form === 'boomerang') {
      formSpd = spd * 0.95;
      vx = Math.cos(a) * formSpd + (i - mid) * 0.04;
      vy = Math.sin(a) * formSpd;
      life = maxLife = 1000;
      phase = 0; /* 0 out, 1 return */
    } else if (form === 'missile') {
      dmg = baseDmg * 2.2;
      formSpd = spd * 0.55;
      vx = Math.cos(a) * formSpd;
      vy = Math.sin(a) * formSpd;
      life = maxLife = 2200;
    } else if (form === 'wave') {
      formSpd = spd;
      vx = Math.cos(a) * formSpd;
      vy = Math.sin(a) * formSpd;
      phase = (i - mid) * 0.9; /* wave phase offset */
      life = maxLife = 1800;
    } else {
      /* bolt */
      life = maxLife = 0; /* 0 = 用出界 cull */
    }

    pushPlayerBullet({
      owner: 'player',
      form,
      x: ship.x + (i - mid) * 4,
      y: ship.y - 8,
      vx, vy,
      dmg,
      pierceLeft: pierce,
      _lastHit: null,
      life, maxLife,
      phase,
      baseX: ship.x + (i - mid) * 4,
      t: 0,
      tags: Object.assign({}, tags),
      ricochetLeft: (tags.ricochet || 0) > 0 ? Math.min(2, tags.ricochet | 0) : 0,
      _splitDone: false,
      spin: 0,
    });
  }
  sfx('shoot');
}

function tickPlayerBullets(dtMs) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.owner !== 'player') continue;

    if (b.form === 'rail') {
      b.life -= dtMs;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      continue;
    }

    b.t = (b.t || 0) + dtMs;

    /* homing tag 或 missile 微追 */
    const homeLv = (b.tags && b.tags.homing) || 0;
    const wantHome = homeLv > 0 || b.form === 'missile';
    if (wantHome) {
      const tgt = nearestEnemy(b.x, b.y);
      if (tgt) {
        const tx = tgt.x - b.x, ty = tgt.y - b.y;
        const len = Math.hypot(tx, ty) || 1;
        const turn = b.form === 'missile' ? 0.0035 : 0.0022 * Math.min(3, homeLv || 1);
        const desiredVx = (tx / len) * Math.hypot(b.vx, b.vy);
        const desiredVy = (ty / len) * Math.hypot(b.vx, b.vy);
        b.vx += (desiredVx - b.vx) * Math.min(1, turn * dtMs);
        b.vy += (desiredVy - b.vy) * Math.min(1, turn * dtMs);
      }
    }

    /* wave 正弦橫擺 */
    if (b.form === 'wave') {
      const amp = 0.12;
      const w = 0.012;
      b.vx = Math.sin((b.t * w) + (b.phase || 0)) * amp;
      /* vy 保持向上主速 */
      if (b.vy > -0.05) b.vy = -(ship && ship.bulletSpd ? ship.bulletSpd : 0.28);
    }

    /* boomerang：前半出、後半返 */
    if (b.form === 'boomerang') {
      if (b.phase === 0 && (b.life < b.maxLife * 0.45 || b.y < 36)) {
        b.phase = 1;
        b._lastHit = null; /* 返航可再打 */
      }
      if (b.phase === 1 && ship) {
        const tx = ship.x - b.x, ty = ship.y - b.y;
        const len = Math.hypot(tx, ty) || 1;
        const sp = Math.hypot(b.vx, b.vy) || 0.28;
        b.vx = (tx / len) * sp * 1.15;
        b.vy = (ty / len) * sp * 1.15;
        if (len < 10) { bullets.splice(i, 1); continue; }
      }
      b.spin = (b.spin || 0) + dtMs * 0.02;
    }

    b.x += b.vx * dtMs;
    b.y += b.vy * dtMs;

    /* ricochet 左右牆 */
    if (b.ricochetLeft > 0) {
      if (b.x < 4) { b.x = 4; b.vx = Math.abs(b.vx); b.ricochetLeft--; }
      else if (b.x > VIEW_W - 4) { b.x = VIEW_W - 4; b.vx = -Math.abs(b.vx); b.ricochetLeft--; }
    }

    if (b.maxLife > 0) {
      b.life -= dtMs;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
    }
  }
}

function spawnSplitBolts(src) {
  if (!src || src._splitDone) return;
  if (!(src.tags && src.tags.split > 0)) return;
  src._splitDone = true;
  const dmg = Math.max(1, (src.dmg || 1) * 0.55);
  for (const side of [-1, 1]) {
    pushPlayerBullet({
      owner: 'player', form: 'bolt',
      x: src.x, y: src.y,
      vx: side * 0.12, vy: -0.28,
      dmg, pierceLeft: 0, _lastHit: null,
      life: 700, maxLife: 700, phase: 0, t: 0,
      tags: {}, ricochetLeft: 0, _splitDone: true, /* 唔再裂 */
    });
  }
}

/* 命中後 tag 效果；回傳是否應刪彈（true=刪） */
function onPlayerBulletHit(b, e) {
  if (b.tags && b.tags.slow > 0) {
    const ms = 600 + Math.max(0, (b.tags.slow - 1) * 300);
    e.slowT = Math.max(e.slowT || 0, ms);
    e.slowMul = 0.6;
  }
  spawnSplitBolts(b);
  b._lastHit = e;
  if (b.form === 'rail') {
    if (!b._railHit) b._railHit = [];
    b._railHit.push(e);
    return false; /* ray 視覺自己消失，可打多隻 */
  }
  if (b.pierceLeft > 0) {
    b.pierceLeft--;
    return false;
  }
  return true; /* 刪彈 */
}

function tick(dtMs) {
  /* 非遊戲狀態下凍結 */
  if (!isStage(fsm.cur)) return;

  /* ---- 波次排程：到達關卡時間目標就產生波次 ---- */
  if (stageStartMs) {
    const stageMs = performance.now() - stageStartMs;
    while (waveCursor < waveQueue.length && waveQueue[waveCursor].at <= stageMs) {
      const w = waveQueue[waveCursor];
      for (const s of w.spawn) emitWaveType(s, lastStage);
      waveCursor++;
    }
  }

  /* ---- P1-5：波次清完之後先召喚 boss ----
     條件：波次佇列出齊 + 場上冇雜魚。
     保險：如果雜魚一直清唔走（例如玩家唔理佢，任由佢飛出畫面），
     8 秒後強制召喚，避免卡住成關。 */
  /* ---- #42 中斷事件：S3 波次過半觸發一次（#47 排程）----
     中途暫停 → 揀完之後用 resumeEvent() 繞過 fsm.set() 返回同一關，
     否則 onStateEnter 會重置場上實體（清子彈／敵機），玩家會死無辜。 */
  if (!eventFired && lastStage === EVENT_STAGE && stageStartMs
      && waveCursor >= Math.ceil(waveQueue.length / 2)) {
    eventFired = true;
    enterEvent();
    return;                    /* 即刻停低呢一帧，唔好繼續行碰撞 */
  }

  if (!bossSpawned && stageStartMs) {
    if (waveCursor >= waveQueue.length) {
      if (waveQueueDoneAt === null) waveQueueDoneAt = performance.now();
      const noGrunts = !enemies.some(e => e.kind === 'grunt' && !e._dead);
      if (noGrunts || performance.now() - waveQueueDoneAt > 8000) {
        /* #46 單次逆轉：S5 boss 出場前攔截一次，一局只有一次。
           喺 spawnBossFor 之前 return，等玩家揀完先出 boss。 */
        if (!reverseUsed && lastStage === REVERSE_STAGE) {
          enterReverse();
          return;
        }
        spawnBossFor(lastStage);
        bossSpawned = true;
        waveQueueDoneAt = null;
      }
    }
  }

  /* ---- 戰機移動（鍵盤優先，否則收斂到拖曳目標） ---- */
  let vx = 0, vy = 0;
  if (InputState.keys.left)  vx -= 1;
  if (InputState.keys.right) vx += 1;
  if (InputState.keys.up)    vy -= 1;
  if (InputState.keys.down)  vy += 1;
  if (vx || vy) {
    InputState.device = 'key';
    const len = Math.hypot(vx, vy);
    const step = ship.speed * (dtMs / 16.67);  /* ship.speed is per-frame @60fps */
    ship.x = clamp(ship.x + (vx/len) * step, 8, VIEW_W - 8);
    ship.y = clamp(ship.y + (vy/len) * step, 8, PLAY_BOTTOM);
    InputState.targetX = ship.x;
    InputState.targetY = ship.y;
  } else {
    /* P0-4：拖曳朝 target 行，但每幀最多行 ship.speed * DRAG_SPEED_MULT。
       唔再瞬移，所以 spd_s / spd_l 喺觸控平台真係有用。 */
    const step = ship.speed * DRAG_SPEED_MULT * (dtMs / 16.67);
    const dx = InputState.targetX - ship.x;
    const dy = InputState.targetY - ship.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.01) {
      const k = Math.min(1, step / d);
      ship.x += dx * k;
      ship.y += dy * k;
    }
    ship.x = clamp(ship.x, 8, VIEW_W - 8);
    ship.y = clamp(ship.y, 8, PLAY_BOTTOM);
  }


  /* ---- 自動開火（PC／觸控都唔使撳射；只需移動） · v3.10 form+tag ---- */
  ship.fireCD -= dtMs;
  if (ship.fireCD <= 0) {
    spawnPlayerShot();
    ship.fireCD = 1000 / Math.max(0.5, ship.fireRate || 1);
  }

  /* ---- 玩家子彈移動／形態路徑 ---- */
  tickPlayerBullets(dtMs);

  /* ---- 聚焦同炸彈由按鍵觸發並檢查冷卻；
       清彈喺觸發當下處理，無敵時段喺碰撞時判斷。 ---- */

  /* ---- 敵機更新（boss 招式各自不同） ---- */
  for (const e of enemies) {
    if (e._dead) continue;        /* 屍體唔再郁，正式移除交由 cull */
    /* v3.10 tag_slow：敵短暫減速 */
    if (e.slowT && e.slowT > 0) {
      e.slowT -= dtMs;
      e._slowMul = e.slowMul || 0.6;
      if (e.slowT <= 0) { e.slowT = 0; e._slowMul = 1; }
    } else {
      e._slowMul = 1;
    }
    if (e.kind === 'spiral') {
      e.t += dtMs;
      /* 8 字形路徑（預設） */
      e.x = VIEW_W/2 + Math.cos(e.t / 600) * 80;
      e.y = 80       + Math.sin(e.t / 400) * 30;
      e.ang0 = e.t / 1000;

      /* 各招式的射速、彈數、彈速（再乘難度） */
      const P = e.pattern || 'A';
      const d = D();
      let nWay = 8, fireEvery = 1000, bulletSpd = 0.06;
      if (P === 'A') {                       /* stage 1: classic 8-way */
        nWay = 8; fireEvery = 1000; bulletSpd = 0.06;
      } else if (P === 'B') {                /* stage 2: 12-way wider */
        nWay = 12; fireEvery = 900; bulletSpd = 0.05;
      } else if (P === 'C') {                /* stage 3: 8-way + slow rotation */
        nWay = 8; fireEvery = 750; bulletSpd = 0.07;
      } else if (P === 'D') {                /* stage 4: 16-way slow */
        nWay = 16; fireEvery = 1300; bulletSpd = 0.04;
      } else if (P === 'E') {                /* stage 5: 12-way faster */
        nWay = 12; fireEvery = 700; bulletSpd = 0.07;
      }
      /* #41 精英關：boss 射速 ×0.75（回報嗰半；代價係敵人血 ×1.35） */
      fireEvery *= d.fireIntervalMul * styBossFire;
      bulletSpd *= affBulletSpd;

      e.spiralCD = (e.spiralCD || 0) + dtMs;
      if (e.spiralCD >= fireEvery) {
        e.spiralCD -= fireEvery;
        for (let i = 0; i < nWay; i++) {
          const a = e.ang0 + i * (Math.PI * 2 / nWay);
          enemies.push({ kind:'bullet', x: e.x, y: e.y, vx: Math.cos(a)*bulletSpd, vy: Math.sin(a)*bulletSpd });
        }
      }

      /* E 招式：每 4.5 秒追加一次慢雷射（待決問題 #2 部分實作） */
      if (P === 'E' || P === 'D') {
        e.laserCD = (e.laserCD || 0) - dtMs;
        if (e.laserCD <= 0) {
          /* 雷射預警 600 毫秒，之後先發射 */
          e.laserWarn = (e.laserWarn === undefined) ? 600 : e.laserWarn - dtMs;
          if (e.laserWarn <= 0 && !e.laserFiring) {
            /* 發射：1 發瞄準戰機嘅高速彈 */
            const sx = ship ? ship.x : VIEW_W/2;
            const a = Math.atan2(ship ? ship.y - e.y : VIEW_H/2, sx - e.x);
            const lspd = 0.20 * bulletSpeedMul();
            enemies.push({ kind:'laser', x: e.x, y: e.y, vx: Math.cos(a)*lspd, vy: Math.sin(a)*lspd, lifeMs: 1500 });
            e.laserFiring = true;
            setTimeout(() => { e.laserFiring = false; }, 100);
            e.laserCD = 4500 * d.fireIntervalMul;
            e.laserWarn = undefined;
          }
        }
      }
    } else if (e.kind === 'laser') {
      /* 聚焦令敵方彈幕減速（PLAN v2 #6；係數由戰機決定） */
      const slow = focusSlowFactor();
      e.x += e.vx * dtMs * (e._slowMul == null ? 1 : e._slowMul) * slow;
      e.y += e.vy * dtMs * (e._slowMul == null ? 1 : e._slowMul) * slow;
      e.lifeMs -= dtMs;
      if (e.lifeMs <= 0) {
        e._dead = true;
      }
    } else if (e.kind === 'bullet') {
      /* 預警彈：pending 時定住，warn 完先飛 */
      if (e.pending) {
        e.warnMs = (e.warnMs || 0) - dtMs;
        if (e.warnMs <= 0) {
          e.pending = false;
          const a = e.fireA != null ? e.fireA : Math.PI / 2;
          const spd = e.fireSpd != null ? e.fireSpd : 0.1;
          e.vx = Math.cos(a) * spd;
          e.vy = Math.sin(a) * spd;
          e.warnMs = 0;
        }
      } else {
        if (e.warnMs > 0) e.warnMs -= dtMs;
        const slow = focusSlowFactor();
        e.x += e.vx * dtMs * (e._slowMul == null ? 1 : e._slowMul) * slow;
        e.y += e.vy * dtMs * (e._slowMul == null ? 1 : e._slowMul) * slow;
      }
    } else if (e.kind === 'grunt') {
      /* ---- 雜魚 AI：grunt/dive/elite/sniper/shield/swarm ---- */
      e.t += dtMs;
      if (e.shield) {
        e.shieldT -= dtMs;
        if (e.shieldT <= 0) {
          e.shieldOn = !e.shieldOn;
          e.shieldT = e.shieldOn ? SHIELD_ON_MS : SHIELD_OFF_MS;
        }
      }
      if (!e.diving && !e.sniper) {
        e.x += Math.sin(e.t / 620) * (e.sway || 0) * dtMs;
      } else if (e.diving) {
        e.vy += 0.000012 * dtMs;
      }
      e.x = clamp(e.x, 12, VIEW_W - 12);
      e.y += e.vy * dtMs * (e._slowMul == null ? 1 : e._slowMul);

      if (e.sniper) {
        /* 狙擊：預警線 → 一發高速 */
        if (e.warnMs > 0) {
          e.warnMs -= dtMs;
          if (e.warnMs <= 0) {
            e.warnMs = 0;
            const d = D();
            const spd = 0.22 * bulletSpeedMul();
            const a = Math.atan2(e.warnTy - e.y, e.warnTx - e.x);
            enemies.push({
              kind: 'bullet', x: e.x, y: e.y,
              vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
              sniperShot: true,
            });
            e.fireCD = 2600 * d.fireIntervalMul;
          }
        } else {
          e.fireCD -= dtMs;
          if (e.fireCD <= 0 && e.y > 20 && e.y < VIEW_H - 140) {
            e.warnMs = SNIPER_WARN_MS;
            e.warnTx = ship ? ship.x : VIEW_W / 2;
            e.warnTy = ship ? ship.y : VIEW_H - 60;
            e.fireCD = 99999; /* 等 warn 完再重設 */
          }
        }
      } else {
        e.fireCD -= dtMs;
        if (e.fireCD <= 0 && e.y > 24 && e.y < VIEW_H - 120) {
          const d = D();
          e.fireCD = (e.elite ? 1500 : e.shield ? 2200 : e.swarm ? 3200 : 2800) * d.fireIntervalMul;
          const sx = ship ? ship.x : VIEW_W / 2;
          const sy = ship ? ship.y : VIEW_H - 60;
          const base = Math.atan2(sy - e.y, sx - e.x);
          const n = e.elite ? 3 : 1;
          const spd = (e.elite ? 0.075 : 0.06) * bulletSpeedMul();
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * 0.24;
            enemies.push({ kind:'bullet', x: e.x, y: e.y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd });
          }
        }
      }
      if (e.elite && e.label.indexOf('精英') < 0) e.label = '精英 · ' + e.affix;
    }
  }

  /* ---- 碰撞：玩家子彈 vs 敵機（boss 同雜魚） ---- */
  for (const e of enemies) {
    if (e.kind !== 'spiral' && e.kind !== 'grunt') continue;
    if (e._dead) continue;          /* 已經死咗，唔可以再計多次分 */
    const halfW = (e.kind === 'spiral') ? 12 : 8;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.owner !== 'player') continue;
      /* rail 用線寬；其餘點撞 */
      const hw = (b.form === 'rail') ? 11 : (b.form === 'laser' ? halfW + 2 : halfW);
      const hh = (b.form === 'rail') ? halfW + 2 : (b.form === 'laser' ? halfW + 4 : halfW);
      if (Math.abs(b.x - e.x) < hw && Math.abs(b.y - e.y) < hh) {
              /* 同一彈唔好每幀重複打同一隻 */
              if (b.form === 'rail' && b._railHit && b._railHit.indexOf(e) >= 0) continue;
              if (e === b._lastHit) continue;
              /* 護盾機：正面（朝下弧）擋玩家彈；側擊／盾滅先入肉 */
              if (e.shield && e.shieldOn) {
                const ang = Math.atan2(b.y - e.y, b.x - e.x);
                if (Math.abs(ang - Math.PI / 2) < 1.05) {
                  if (b.pierceLeft > 0) {
                    b.pierceLeft--;
                    b._lastHit = e;
                  } else if (b.form !== 'rail') {
                    bullets.splice(i, 1);
                  }
                  spawnSparks(b.x, b.y, 4, 0.1);
                  screenFlash = Math.max(screenFlash, 0.12);
                  continue;
                }
              }
              e.hp -= (b.dmg || 1);
              spawnSparks(b.x, b.y, 3, 0.08);
              sfx('hit');
              const remove = onPlayerBulletHit(b, e);
              if (remove) bullets.splice(i, 1);
              if (e.hp <= 0) {
                spawnBoom(e.x, e.y);
                if (e.kind === 'spiral') {
                  console.log('[擊破] boss @', (performance.now()/1000).toFixed(2));
                  sfx('kill');
                  runScore += BOSS_SCORE * affScore * styScore;
                  runKills++;
                  rollLoot(lastStage);          /* #44 boss 死必掉 1 件裝備（零選擇） */
                  if (lastStage >= STAGES.length) {
                    fsm.set(STATE.VICTORY);
                  } else {
                    fsm.set(STATE.CHOICE);
                  }
                  return;
                }
                runScore += (e.score || GRUNT_SCORE) * affScore * styScore;
                runKills++;
                runGrunts++;
                e._dead = true;
                sfx(e.elite ? 'kill' : 'hit');
                /* 分裂蟲 → mini；護盾機死 → 裂彈 */
                if (e.swarm || e.splitOnDeath) spawnSwarmChildren(e.x, e.y);
                if (e.shield) spawnSplitBurst(e.x, e.y);
                if (e.elite) console.log('[擊破] 精英「' + e.affix + '」· +' + (e.score || ELITE_SCORE));
                else if (e.sniper) console.log('[擊破] 狙擊 · +' + (e.score || SNIPER_SCORE));
                else if (e.shield) console.log('[擊破] 護盾機 · +' + (e.score || SHIELD_SCORE));
                else if (e.swarm) console.log('[擊破] 分裂 · +' + (e.score || SWARM_SCORE));
                break;
              }
              break;
            }
    }
  }

  /* ---- 碰撞：敵方子彈、雷射同雜魚撞擊 vs 戰機 ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.kind !== 'bullet' && e.kind !== 'laser' && e.kind !== 'grunt') continue;
    if (e.pending) continue; /* 預警未發射唔撞 */
    /* P1-5：雜魚有撞擊傷害 —— 撞到玩家會自己死。
       冇呢條規則嘅話，最優策略就係完全唔理雜魚任由佢飛走，
       「擊殺雜魚」變成冇誘因，等 P1-5 個設計目標失效。 */
    const isBody = (e.kind === 'grunt');
    const r = isBody ? 9 : 4;
    if (Math.abs(e.x - ship.x) < 6 + r && Math.abs(e.y - ship.y) < 6 + r) {
      /* PLAN v2 #7：炸彈無敵時段 —— 施放後 1.5 秒內唔受傷。
         視覺上仍然清走嗰粒彈，等玩家見到擋成功咗。 */
      if (isIFramed() || GOD) {
        if (isBody) { spawnSparks(e.x, e.y, 6, 0.12); enemies.splice(i, 1); }
        else enemies.splice(i, 1);
        if (GOD) { ship.hp = ship.maxHp; ship.shield = SHIPS[ship.chassis].shield; }
        continue;
      }
      enemies.splice(i, 1);
      if (isBody) spawnBoom(e.x, e.y); else spawnSparks(ship.x, ship.y, 6, 0.14);
      hitShake = 1;
      screenFlash = Math.max(screenFlash, 0.35);
      sfx('hurt');
      if (ship.shield > 0) {
        ship.shield -= 1;
      } else {
        ship.hp -= 1;
        if (ship.hp <= 0) {
          /* #44「保險」：致命傷免疫 1 次。優先過 life_st 復活——
             兩者都係「唔好死」，但保險係裝備、復活係強化，唔應該互相吞噬。
             保險嗰次用完之後（armorUsed = true）之後唔會再擋。 */
          if (hasArmor() && !armorUsed) {
            armorUsed = true;
            ship.hp = 1;
            iFrameUntil = performance.now() + 2500;
            spawnBoom(ship.x, ship.y);
            screenFlash = Math.max(screenFlash, 0.6);
            sfx('focus');
            console.log('[保險] 抵銷一次致命傷 · 之後失效');
            continue;
          }
          /* life_st 復活：消耗一次機會、補滿血、送 2.5 秒無敵，
             否則先判定 GAME OVER。之前呢個欄位只係寫入從來冇讀過。 */
          if (ship.resurrect > 0) {
            ship.resurrect -= 1;
            ship.hp = ship.maxHp;
            iFrameUntil = performance.now() + 2500;
            spawnBoom(ship.x, ship.y);
            screenFlash = Math.max(screenFlash, 0.6);
            console.log('[復活] 消耗 1 次 · 剩餘', ship.resurrect);
            continue;
          }
          console.log('[戰機] 被擊毀');
          spawnBoom(ship.x, ship.y);
          sfx('die');
          fsm.set(STATE.GAMEOVER);
          return;
        }
      }
    } else if (!isBody && !e._grazed) {
      /* ---- P1-6 擦彈判定 ----
         用圓形距離（唔係上面嗰個方形），令斜向擦過都算數。
         必須 `else if`：已經判中嘅彈唔可以同時當擦彈。
         `_grazed` 保證每粒子彈只計一次 —— 一粒子彈喺 20px 圈內
         大約停留 20–40 幀，冇呢個旗標會被重複計幾十次。 */
      const dx = e.x - ship.x, dy = e.y - ship.y;
      if (Math.hypot(dx, dy) < grazeRadius()) {
        e._grazed = true;
        doGraze(ship.x + dx, ship.y + dy);
      }
    }
  }

  /* ---- 清除離畫面實體 ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e._dead) { enemies.splice(i, 1); continue; }
    if (e.kind === 'bullet' && (e.x < -16 || e.x > VIEW_W + 16 || e.y < -16 || e.y > VIEW_H + 16)) {
      enemies.splice(i, 1);
    } else if (e.kind === 'laser' && (e.lifeMs !== undefined && e.lifeMs <= 0)) {
      enemies.splice(i, 1);
    } else if (e.kind === 'grunt' && (e.y > VIEW_H + 20 || e.y < -40 || e.x < -24 || e.x > VIEW_W + 24)) {
      /* 雜魚飛出畫面 = 走脫，唔計分。令玩家有動機主動擊殺，
         而唔係「閃埋唔打」就過關。 */
      enemies.splice(i, 1);
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.y < -8 || b.y > VIEW_H + 8 || b.x < -8 || b.x > VIEW_W + 8) {
      bullets.splice(i, 1);
    }
  }

  /* ---- 狀態列 ---- */
  const now = performance.now();
  const focusState = isFocusActive()
    ? `聚焦生效 ×${(ship.focusFactor != null ? ship.focusFactor : 0.3).toFixed(1)}`
    : `聚焦冷卻 ${Math.max(0, Math.ceil((focusCDUntil - now)/1000))} 秒`;
  const bombState  = isIFramed()
    ? `炸彈無敵 ${(Math.max(0, iFrameUntil - now)/1000).toFixed(1)} 秒`
    : (bombCDUntil > now ? `炸彈冷卻 ${Math.max(0, Math.ceil((bombCDUntil - now)/1000))} 秒` : '炸彈就緒');
  hudEl.hp.textContent = `生命：${ship.hp}  護盾：${ship.shield}  分數：${Math.floor(runScore)}`;
  hudEl.tip.textContent = `${focusState} · ${bombState}`;
  /* 必須喺 tip 賦值之後，否則下一行會即刻覆蓋咗 */
  if (DEBUG) {
    hudEl.tip.textContent =
      `種子 ${runSeed}　詞綴 ${stageAffix ? stageAffix.name + '(×' + affScore.toFixed(2) + ')' : '無'}　` +
      `風格 ${stageStyle ? stageStyle.name : '無'}　` +
      `擊殺 ${runKills}（雜魚 ${runGrunts} · boss ${runKills - runGrunts}）　擦彈 ${grazeCount}（能量 ${grazeEnergy}/${GRAZE_ENERGY_NEED}）　` +
      hudEl.tip.textContent;
  }
}

/* ---------- 音效掣 + 音量面板（PLAN v3.9 #52）---------- */
/* 位置：暫停掣下面（右上 y=68）。⚠️ 唔可以放 y=6 —— 護盾 icon 由 VIEW_W-16
   向左排 5 個，佔 y≈14–26，會同右上角掣重疊（暫停掣本身已經喺嗰區，
   屬 v3.3 既有情況，今次唔擴大）。 */
let audioPanelOpen = false;
function audioBtnRect() {
  const s = 56;
  return { x: VIEW_W - s - 6, y: isStage(fsm.cur) ? 68 : 6, w: s, h: s };
}
function audioPanelRect() {
  const w = 252, h = 248;
  return { x: (VIEW_W - w) / 2, y: (VIEW_H - h) / 2 - 24, w, h };
}
/* 行距 6px：原本 row2 用 y+168，同 row1（y+116、h=56）重疊 4px，
   而且 row2 底部仲超出面板 10px —— test_audio.js 捉到。觸控目標一撞就
   會撳錯行，所以間距要留夠。 */
function audioPanelBtns(p) {
  return {
    power:   { x: p.x + (p.w - 184) / 2, y: p.y + 40,  w: 184, h: 56 },
    bgmMinus:{ x: p.x + 18,  y: p.y + 108, w: 56, h: 56 },
    bgmPlus: { x: p.x + p.w - 74, y: p.y + 108, w: 56, h: 56 },
    sfxMinus:{ x: p.x + 18,  y: p.y + 170, w: 56, h: 56 },
    sfxPlus: { x: p.x + p.w - 74, y: p.y + 170, w: 56, h: 56 },
  };
}
const inRect = (px, py, r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

/* 音效掣 / 面板點擊。面板開住時全部吃掉（唔會漏去遊戲）。 */
function handleAudioPanelTap(px, py) {
  if (audioPanelOpen) {
    const p = audioPanelRect(), b = audioPanelBtns(p);
    if (inRect(px, py, b.power)) {
      setAudioOn(!audioOn);
      Bgm.setPlaying(audioOn);
      return true;
    }
    if (inRect(px, py, b.bgmMinus)) { bumpVol('bgm', -1); return true; }
    if (inRect(px, py, b.bgmPlus))  { bumpVol('bgm', +1); return true; }
    if (inRect(px, py, b.sfxMinus)) { bumpVol('sfx', -1); return true; }
    if (inRect(px, py, b.sfxPlus))  { bumpVol('sfx', +1); return true; }
    audioPanelOpen = false;   /* 撳面板以外 = 關閉 */
    return true;
  }
  if (inRect(px, py, audioBtnRect())) { audioPanelOpen = true; return true; }
  return false;
}

/* 細喇叭（唔用 emoji，各平台先一致）。
   ⚠️ 關閉狀態唔可以用太深嘅灰 —— 之前用 #556，深色底上智慧白板根本睇唔到，
   學生會以為冇呢個掣。改 #9bb。 */
function drawSpeakerIcon(cx, cy, on) {
  ctx.fillStyle = on ? '#0ff' : '#9bb';
  ctx.beginPath();
  ctx.moveTo(cx - 9, cy - 4); ctx.lineTo(cx - 4, cy - 4); ctx.lineTo(cx + 2, cy - 10);
  ctx.lineTo(cx + 2, cy + 10); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx - 9, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = on ? '#0ff' : '#9bb';
  ctx.lineWidth = 2;
  for (let i = 0; i < (on ? 2 : 1); i++) {
    ctx.beginPath(); ctx.arc(cx + 2, cy, 6 + i * 5, -0.8, 0.8); ctx.stroke();
  }
  if (!on) {
    ctx.strokeStyle = '#f55'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx + 12, cy + 12); ctx.stroke();
  }
}
function drawAudioUi() {
  /* 面板開住就算已暫停都要畫（否則玩家喺暫停畫面開咗音效就見唔到） */
  if (fsm.cur === STATE.PAUSED && !audioPanelOpen) return;
  const r = audioBtnRect();
  ctx.fillStyle = 'rgba(0,20,40,0.72)';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = audioPanelOpen ? '#ff5e8a' : 'rgba(0,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  drawSpeakerIcon(r.x + r.w / 2, r.y + r.h / 2, audioOn);
  if (!audioPanelOpen) return;

  const p = audioPanelRect(), b = audioPanelBtns(p);
  ctx.fillStyle = 'rgba(2,10,20,0.88)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = 'rgba(0,28,44,0.96)';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x, p.y, p.w, p.h);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0ff'; ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillText('音效設定', p.x + p.w / 2, p.y + 22);

  /* 總開關 */
  ctx.fillStyle = audioOn ? 'rgba(0,90,70,0.95)' : 'rgba(90,30,40,0.95)';
  ctx.fillRect(b.power.x, b.power.y, b.power.w, b.power.h);
  ctx.strokeStyle = audioOn ? '#0f6' : '#f66';
  ctx.strokeRect(b.power.x, b.power.y, b.power.w, b.power.h);
  drawSpeakerIcon(b.power.x + 34, b.power.y + b.power.h / 2, audioOn);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 17px ui-monospace, monospace';
  ctx.fillText(audioOn ? '音效 開' : '音效 關', b.power.x + 116, b.power.y + b.power.h / 2);

  /* 音量列：[−] 標籤 + 進度點 [+]，唔用滑條（智慧白板要粗撳得中） */
  const step = (rc, sign) => {
    ctx.fillStyle = 'rgba(0,60,80,0.95)'; ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.strokeRect(rc.x, rc.y, rc.w, rc.h);
    ctx.fillStyle = '#0ff'; ctx.font = 'bold 22px ui-monospace, monospace'; ctx.textAlign = 'center';
    ctx.fillText(sign, rc.x + rc.w / 2, rc.y + rc.h / 2 + 1);
  };
  const row = (label, val, minus, plus) => {
    const midY = minus.y + minus.h / 2;
    ctx.textAlign = 'left'; ctx.fillStyle = '#9ff'; ctx.font = '14px ui-monospace, monospace';
    ctx.fillText(label, p.x + 84, midY - 10);
    for (let i = 0; i < VOL_STEPS; i++) {
      ctx.fillStyle = i < val ? '#0ff' : 'rgba(0,255,255,0.18)';
      ctx.fillRect(p.x + 84 + i * 13, midY + 2, 10, 5);
    }
    step(minus, '−'); step(plus, '+');
  };
  row('音樂', volBgm, b.bgmMinus, b.bgmPlus);
  row('音效', volSfx, b.sfxMinus, b.sfxPlus);

  ctx.fillStyle = '#889'; ctx.font = '12px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillText('撳面板以外 = 關閉', p.x + p.w / 2, p.y + p.h - 13);
}

/* v3.8 #43：詞綴橫幅（入關 2.6 秒）＋「停電」暗幕 */
function drawStageAffixFx() {
  if (!isStage(fsm.cur)) return;
  /* 停電：全畫面壓暗，唔遮掣（HUD 喺 renderTail 之後畫） */
  if (affDark) {
    ctx.fillStyle = 'rgba(0,0,20,' + (0.42 * affDark).toFixed(3) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  if (!stageAffix || affixShownAt <= 0) return;
  const age = performance.now() - affixShownAt;
  if (age > 2600) return;
  const fade = age > 2000 ? Math.max(0, 1 - (age - 2000) / 600) : 1;
  const y = 96;
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(0,20,40,0.85)';
  ctx.fillRect(VIEW_W / 2 - 92, y - 22, 184, 44);
  ctx.strokeStyle = '#ff5e8a'; ctx.lineWidth = 2;
  ctx.strokeRect(VIEW_W / 2 - 92, y - 22, 184, 44);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px ui-monospace, monospace';
  ctx.fillText(stageAffix.icon + ' ' + stageAffix.name, VIEW_W / 2, y - 6);
  ctx.fillStyle = '#ffd56a';
  ctx.font = '11px ui-monospace, monospace';
  ctx.fillText(stageAffix.desc, VIEW_W / 2, y + 12);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

/* ---------- 11. 繪製 ---------- */
/* render() 收尾：所有畫面共用。
   ⚠️ 音效 UI 一定要畫喺每個狀態 —— 原本放喺戰鬥分支尾部，結果標題／難度／
   結算畫面因為提早 return 完全畫唔到掣（實機踩過，靜態掃描捉唔到）。
   抽出嚟做單一收尾，六條返回路徑 + 戰鬥尾都經過同一個函式。 */
function renderTail() {
  drawAudioUi();
  drawScanlines(); drawFlash();
  ctx.restore();
}
function render() {
  const shakeX = hitShake > 0 ? (Math.random() - 0.5) * 4 * hitShake : 0;
  const shakeY = hitShake > 0 ? (Math.random() - 0.5) * 4 * hitShake : 0;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* 背景 —— 依關卡主題，或標題畫面 */
  const bgStage = isStage(fsm.cur) ? lastStage
    : (fsm.cur === STATE.CHOICE || fsm.cur === STATE.PAUSED || fsm.cur === STATE.STYLE
       || fsm.cur === STATE.EVENT || fsm.cur === STATE.REVERSE) ? lastStage
    : 1;
  drawBackdrop(bgStage);
  drawParticles();

  /* ---------- 選單 ---------- */
  if (fsm.cur === STATE.PAUSED) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('已暫停', VIEW_W/2, VIEW_H/2 - 8);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#fff';
    if (pauseReason === 'manual') {
      ctx.fillText('撳畫面／P／Esc 繼續', VIEW_W/2, VIEW_H/2 + 16);
      ctx.fillStyle = '#9ef';
      ctx.font = '10px monospace';
      ctx.fillText('課堂用 · 計時已凍結', VIEW_W/2, VIEW_H/2 + 36);
    } else {
      ctx.fillText('（分頁切換中 — 返去即繼續）', VIEW_W/2, VIEW_H/2 + 16);
    }
    renderTail();
    return;
  }

  if (fsm.cur === STATE.TITLE) {
    drawSprite('logo_mark', VIEW_W/2, VIEW_H/2 - 110, 2.2);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 12;
    ctx.fillText('末日救未來', VIEW_W/2, VIEW_H/2 - 48);
    ctx.shadowBlur = 0;
    ctx.font = '11px monospace';
    ctx.fillStyle = '#cde';
    ctx.fillText('在人類滅亡之前飛得過去', VIEW_W/2, VIEW_H/2 - 28);
    ctx.fillStyle = '#6af';
    ctx.fillText('v0.21.2 · 選機 hit 加大', VIEW_W/2, VIEW_H/2 - 12);
    drawSprite('ship_a', VIEW_W/2 - 50, VIEW_H/2 + 52, 3);
    drawSprite('ship_b', VIEW_W/2, VIEW_H/2 + 56, 3);
    drawSprite('ship_c', VIEW_W/2 + 50, VIEW_H/2 + 52, 3);
    drawSprite('boss', VIEW_W/2, VIEW_H/2 + 110, 2.5);
    if (bestScore > 0 || bestTime > 0) {
      ctx.fillStyle = '#ff6';
      ctx.font = 'bold 12px monospace';
      ctx.fillText(diffName() + ' 最佳：' + Math.floor(bestScore) + '（' + (bestTime > 0 ? bestTime.toFixed(1) + ' 秒' : '—') + '）', VIEW_W/2, VIEW_H/2 + 18);
    } else {
      ctx.fillStyle = '#889';
      ctx.font = '11px monospace';
      ctx.fillText('暫無紀錄 — 挑戰第一次！', VIEW_W/2, VIEW_H/2 + 18);
    }
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 320);
    ctx.fillStyle = 'rgba(255,220,80,' + pulse.toFixed(2) + ')';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('→ 點擊選擇難度 ←', VIEW_W/2, VIEW_H - 56);
    renderTail();
    return;
  }

  if (fsm.cur === STATE.DIFF_SELECT) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, VIEW_W, 72);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('選擇難度', VIEW_W/2, 36);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#9ab';
    ctx.fillText('而家數值 = 3 逃逸（最高）', VIEW_W/2, 54);
    const cards = [
      { id:1, name:'巡航', sub:'易 · 白板／初玩', col:'#3dff8a', detail:'血×0.55 彈慢' },
      { id:2, name:'突破', sub:'中 · 預設',       col:'#4d8cff', detail:'血×0.75 平衡' },
      { id:3, name:'逃逸', sub:'難 · 而家',       col:'#ff6ad5', detail:'全數值 硬核' },
    ];
    const L = diffCardsLayout();
    cards.forEach((c, i) => {
      const r = L.rect(i);
      const on = diffId === c.id;
      ctx.fillStyle = on ? 'rgba(0,50,80,0.92)' : 'rgba(0,20,40,0.78)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = c.col;
      ctx.lineWidth = on ? 3 : 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = c.col;
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(String(c.id), r.x + r.w/2, r.y + 28);
      ctx.font = 'bold 14px monospace';
      ctx.fillText(c.name, r.x + r.w/2, r.y + 50);
      ctx.font = '9px monospace';
      ctx.fillStyle = '#cde';
      ctx.fillText(c.sub, r.x + r.w/2, r.y + 70);
      ctx.fillStyle = '#9ab';
      ctx.fillText(c.detail, r.x + r.w/2, r.y + 88);
      if (on) {
        ctx.fillStyle = '#ff6';
        ctx.font = 'bold 10px monospace';
        ctx.fillText('上次', r.x + r.w/2, r.y + r.h - 10);
      }
    });
    ctx.fillStyle = '#ff6';
    ctx.font = '12px monospace';
    ctx.fillText('按 1 / 2 / 3 或點擊卡牌', VIEW_W/2, VIEW_H - 40);
    renderTail();
    return;
  }

  if (fsm.cur === STATE.SHIP_SELECT) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, VIEW_W, 70);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('選擇機體', VIEW_W/2, 40);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#9ab';
    ctx.fillText('揀你嘅逃生船', VIEW_W/2, 56);
    const labels = [
      { id:'A', n:'速', sub:'1彈·快·傷1', col:'#0ff' },
      { id:'B', n:'盾', sub:'2彈·盾3·傷1', col:'#4df' },
      { id:'C', n:'火', sub:'3彈·慢·傷2',  col:'#f6a' },
    ];
    labels.forEach((lab, i) => {
      const r = shipCardsLayout().rect(i);
      const x = r.x + r.w / 2, y = shipCardsLayout().y;
      ctx.fillStyle = 'rgba(0,30,50,0.75)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = lab.col;
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = 'rgba(0,255,255,0.25)';
      ctx.strokeRect(r.x + 4, r.y + 4, r.w - 8, 48);
      if (!drawSprite(SHIP_SPRITE[lab.id], x, y - 8, 3.2)) {
        ctx.fillStyle = lab.col;
        ctx.font = 'bold 22px monospace';
        ctx.fillText(lab.id, x, y - 4);
      }
      ctx.fillStyle = lab.col;
      ctx.font = 'bold 13px monospace';
      ctx.fillText(lab.id + ' · ' + lab.n, x, y + 28);
      ctx.font = '9px monospace';
      ctx.fillStyle = '#cde';
      ctx.fillText(lab.sub, x, y + 42);
    });
    ctx.fillStyle = '#ff6';
    ctx.font = '12px monospace';
    ctx.fillText('點左/中/右 或 A B C', VIEW_W/2, VIEW_H - 48);
    renderTail();
    return;
  }

  if (fsm.cur === STATE.GAMEOVER) {
    ctx.fillStyle = 'rgba(20,0,0,0.55)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#f06';
    ctx.font = 'bold 30px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#f06';
    ctx.shadowBlur = 10;
    ctx.fillText('任務失敗', VIEW_W/2, VIEW_H/2 - 28);
    ctx.shadowBlur = 0;
    ctx.font = '12px monospace';
    ctx.fillStyle = '#fcc';
    ctx.fillText('戰機被擊毀 · 分數 ' + Math.floor(runScore), VIEW_W/2, VIEW_H/2 + 4);
    ctx.fillStyle = '#9ab';
    ctx.font = '11px monospace';
    ctx.fillText('難度 ' + diffName() + ' · 倒數第 ' + lastStage + ' 關', VIEW_W/2, VIEW_H/2 + 22);
    drawEndBtns();
    renderTail();
    return;
  }

  if (fsm.cur === STATE.VICTORY) {
    const finalRunSec = victoryRunSec;
    const timeBonus = victoryTimeBonus;
    const scoreDisplay = Math.floor(finalScore);
    ctx.fillStyle = 'rgba(0,20,10,0.55)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    drawSprite('gate', VIEW_W/2, VIEW_H/2 - 110, 1.6);
    if (isNewBest) {
      ctx.fillStyle = 'rgba(255,255,0,0.18)';
      ctx.fillRect(0, VIEW_H/2 - 100, VIEW_W, 24);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('★ 新紀錄 ★', VIEW_W/2, VIEW_H/2 - 82);
    }
    ctx.fillStyle = '#0f6';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#0f6';
    ctx.shadowBlur = 12;
    ctx.fillText('逃出生天', VIEW_W/2, VIEW_H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.font = '14px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('全 5 關完成 · 用時 ' + finalRunSec.toFixed(1) + ' 秒', VIEW_W/2, VIEW_H/2 - 4);
    ctx.fillStyle = '#ff6';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('分數：' + scoreDisplay, VIEW_W/2, VIEW_H/2 + 28);
    ctx.font = '11px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('（擊殺 ' + Math.floor(runScore - grazeScoreTotal)
               + ' + 擦彈 ' + Math.floor(grazeScoreTotal) + '（' + grazeCount + ' 次）'
               + ' + 時間獎金 ' + Math.floor(timeBonus) + '）', VIEW_W/2, VIEW_H/2 + 48);
    ctx.fillStyle = '#ff6';
    ctx.fillText(diffName() + ' 最佳：' + Math.floor(bestScore) + ' · ' + bestTime.toFixed(1) + ' 秒', VIEW_W/2, VIEW_H/2 + 72);
    drawEndBtns();
    renderTail();
    return;
  }

  if (fsm.cur === STATE.CHOICE) {
    const L = choiceLayout();
    const cardW = L.cardW, cardH = L.cardH, startX = L.startX, cardY = L.cardY;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#ff6';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('選擇 — 揀一個強化', VIEW_W/2, cardY - 18);
    for (let i = 0; i < 3; i++) {
      const up = choiceOffer[i];
      if (!up) continue;
      const r = L.rect(i);
      const x = r.x, y = r.y;
      const grd = ctx.createLinearGradient(x, y, x, y + cardH);
      grd.addColorStop(0, 'rgba(0,60,90,0.95)');
      grd.addColorStop(1, 'rgba(0,20,40,0.95)');
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cardW, cardH);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.strokeRect(x + 3, y + 3, cardW - 6, cardH - 6);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(up.icon, x + cardW/2, y + 30);
      /* 分類標籤（PLAN v3.8 #40）：卡片**左上**細章，令玩家睇得出 build 走向。
         只係顯示，唔限制揀卡。顏色跟分類，方便一眼掃。
         ⚠️ 放左上唔放右上——右上已經有疊加次數「x2」（y+14 右對齊），
         兩者會撞位（實作時踩過）。 */
      if (up.cat) {
        ctx.font = '9px monospace';
        ctx.fillStyle = CAT_COLOR[up.cat] || '#7a8';
        ctx.textAlign = 'left';
        ctx.fillText(up.cat, x + 7, y + 13);
        ctx.textAlign = 'center';
      }
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#0ff';
      ctx.fillText(up.nameZh, x + cardW/2, y + 50);
      ctx.font = '10px monospace';
      ctx.fillStyle = '#bcd';
      /* 中文逐字斷行；Array.from 先拆 code point，唔會切爛 emoji */
      const descLines = [];
      {
        const chars = Array.from(up.desc);
        for (let li = 0; li < chars.length; li += 9) descLines.push(chars.slice(li, li + 9).join(''));
      }
      for (let li = 0; li < Math.min(descLines.length, 3); li++) {
        ctx.fillText(descLines[li], x + cardW/2, y + 66 + li * 11);
      }
      const n = playerStacks[up.id] || 0;
      if (n > 0) {
        ctx.fillStyle = '#0f6';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('x' + n, x + cardW - 6, y + 14);
      }
      ctx.fillStyle = '#ff6';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('[' + (i+1) + '] 點擊', x + cardW/2, y + cardH - 8);
    }
    renderTail();
    return;
  }

  /* ---- #46 單次逆轉三選一：把一件現有強化升級為傳說級 ---- */
  if (fsm.cur === STATE.REVERSE) {
    const L = choiceLayout();
    const cardW = L.cardW, cardH = L.cardH, cardY = L.cardY;
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('單次逆轉 — 揀一件升級', VIEW_W/2, cardY - 18);
    for (let i = 0; i < 3; i++) {
      const up = reverseOffer[i];
      if (!up) continue;
      const r = L.rect(i);
      const x = r.x, y = r.y;
      /* 傳說級配色：金 */
      const grd = ctx.createLinearGradient(x, y, x, y + cardH);
      grd.addColorStop(0, 'rgba(120,85,10,0.95)');
      grd.addColorStop(1, 'rgba(45,30,4,0.95)');
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cardW, cardH);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.strokeRect(x + 3, y + 3, cardW - 6, cardH - 6);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(up.icon, x + cardW/2, y + 30);
      /* 傳說級標記（卡片中央橫幅） */
      ctx.font = 'bold 9px monospace';
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('傳說', x + cardW/2, y + 46);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#ff8';
      ctx.fillText(up.nameZh, x + cardW/2, y + 62);
      ctx.font = '9px monospace';
      ctx.fillStyle = '#cba';
      ctx.fillText('→ 效果 ×2', x + cardW/2, y + 76);
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('[' + (i+1) + '] 點擊', x + cardW/2, y + cardH - 8);
    }
    renderTail();
    return;
  }

  /* ---- #42 中斷事件三選一：同一個三卡版面 ---- */
  if (fsm.cur === STATE.EVENT) {
    const L = choiceLayout();
    const cardW = L.cardW, cardH = L.cardH, cardY = L.cardY;
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#fc6';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('中斷事件 — 揀一個', VIEW_W/2, cardY - 18);
    for (let i = 0; i < 3; i++) {
      const ev = eventOffer[i];
      if (!ev) continue;
      const r = L.rect(i);
      const x = r.x, y = r.y;
      const grd = ctx.createLinearGradient(x, y, x, y + cardH);
      grd.addColorStop(0, 'rgba(90,40,20,0.95)');
      grd.addColorStop(1, 'rgba(35,14,6,0.95)');
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = '#fc6';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cardW, cardH);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.strokeRect(x + 3, y + 3, cardW - 6, cardH - 6);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ev.icon, x + cardW/2, y + 32);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#fd6';
      ctx.fillText(ev.name, x + cardW/2, y + 54);
      /* desc 動態（維修引擎要寫明燒邊件）→ 用 eventDesc() */
      ctx.font = '10px monospace';
      ctx.fillStyle = '#bcd';
      const chars = Array.from(eventDesc(ev));
      const lines = [];
      for (let li = 0; li < chars.length; li += 6) lines.push(chars.slice(li, li + 6).join(''));
      for (let li = 0; li < Math.min(lines.length, 3); li++) {
        ctx.fillText(lines[li], x + cardW/2, y + 70 + li * 11);
      }
      ctx.fillStyle = '#ff6';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('[' + (i+1) + '] 點擊', x + cardW/2, y + cardH - 8);
    }
    renderTail();
    return;
  }

  /* ---- #41 本關風格三選一：同一個三卡版面，卡面用風格配色 ---- */
  if (fsm.cur === STATE.STYLE) {
    const L = choiceLayout();
    const cardW = L.cardW, cardH = L.cardH, cardY = L.cardY;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#ff6';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`第 ${lastStage + 1} 關 — 揀風格`, VIEW_W/2, cardY - 18);
    for (let i = 0; i < 3; i++) {
      const st = styleOffer[i];
      if (!st) continue;
      const r = L.rect(i);
      const x = r.x, y = r.y;
      /* 每個風格一個色：紫(彈幕) / 綠(雜兵) / 橙(精英) */
      const tint = st.id === 'bullet' ? ['rgba(70,30,110,0.95)', 'rgba(20,10,45,0.95)']
                  : st.id === 'swarm' ? ['rgba(20,90,50,0.95)', 'rgba(8,35,20,0.95)']
                  :                    ['rgba(110,60,15,0.95)', 'rgba(45,22,6,0.95)'];
      const grd = ctx.createLinearGradient(x, y, x, y + cardH);
      grd.addColorStop(0, tint[0]);
      grd.addColorStop(1, tint[1]);
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cardW, cardH);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.strokeRect(x + 3, y + 3, cardW - 6, cardH - 6);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(st.icon, x + cardW/2, y + 34);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#0ff';
      ctx.fillText(st.name, x + cardW/2, y + 56);
      /* #48 文案 ≤12 字；逐字斷行，Array.from 先拆 code point */
      ctx.font = '10px monospace';
      ctx.fillStyle = '#bcd';
      const chars = Array.from(st.desc);
      const lines = [];
      for (let li = 0; li < chars.length; li += 6) lines.push(chars.slice(li, li + 6).join(''));
      for (let li = 0; li < Math.min(lines.length, 2); li++) {
        ctx.fillText(lines[li], x + cardW/2, y + 72 + li * 11);
      }
      /* 降級提示：呢關未解鎖對口敵種 → 敵種組成唔會變（例如 S2 冇精英怪）。
         唔講就係期望落差——玩家揀咗見唔到分別會以為壞咗。 */
      if (!styleHasMatch(lastStage + 1, st)) {
        ctx.font = '9px monospace';
        ctx.fillStyle = '#fa4';
        ctx.fillText('本關無對口敵種', x + cardW/2, y + 90);
      }
      ctx.fillStyle = '#ff6';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('[' + (i+1) + '] 點擊', x + cardW/2, y + cardH - 8);
    }
    renderTail();
    return;
  }

  /* ---- 遊戲畫面 ---- */
  for (const b of bullets) {
    if (b.owner === 'player') {
      const f = b.form || 'bolt';
      if (f === 'rail') {
        ctx.strokeStyle = 'rgba(180,255,255,0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x, 8);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, 8); ctx.stroke();
        continue;
      }
      if (f === 'laser') {
        if (!drawSprite('laser', b.x, b.y, 1.2)) {
          ctx.fillStyle = '#6ff';
          ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12);
        }
        continue;
      }
      if (f === 'boomerang') {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.spin || 0);
        ctx.fillStyle = '#fc6';
        ctx.fillRect(-4, -4, 8, 8);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(-4,-4,8,8);
        ctx.restore();
        continue;
      }
      if (f === 'missile') {
        ctx.fillStyle = '#f84';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - 5);
        ctx.lineTo(b.x + 3, b.y + 4);
        ctx.lineTo(b.x - 3, b.y + 4);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,160,40,0.5)';
        ctx.fillRect(b.x - 1, b.y + 4, 2, 5);
        continue;
      }
      if (f === 'wave') {
        ctx.fillStyle = '#8f8';
        ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, Math.PI*2); ctx.fill();
        continue;
      }
      /* bolt 預設 */
      if (!drawSprite('bullet_p', b.x, b.y, 1.4)) {
        ctx.fillStyle = '#0ff';
        ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
      }
    }
  }
  for (const e of enemies) {
    if (e._dead) continue;
    if (e.kind === 'grunt') {
      /* pxl：role 決定 sprite；失敗回退三角 */
      const frac = clamp(e.hp / (e.maxHp || 1), 0, 1);
      let spr = 'grunt', scale = e.mini ? 1.2 : 1.55, R = e.mini ? 6 : 8;
      if (e.elite) { spr = 'elite'; scale = 2.0; R = 12; }
      else if (e.diving) { spr = 'dive'; scale = 1.7; R = 9; }
      else if (e.sniper) { spr = 'sniper'; scale = 1.75; R = 9; }
      else if (e.shield) { spr = 'shield_e'; scale = 1.9; R = 11; }
      else if (e.swarm) { spr = 'swarm'; scale = 1.6; R = 8; }
      /* v3.8 #45 雜魚小詞綴：sprite 外圍加一圈色環（唔改 sprite 本身，
         免得同一個 sprite 變到認唔出）。 */
      if (e.minorTint) {
        ctx.strokeStyle = e.minorTint;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y, R + 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      const drawn = drawSprite(spr, e.x, e.y, scale);
      if (!drawn) {
        ctx.fillStyle = e.elite ? (frac > 0.4 ? '#ffd54a' : '#ff9a3c')
          : e.sniper ? '#6cf' : e.shield ? '#4af' : e.swarm ? '#6f6'
          : e.diving ? (frac > 0.4 ? '#ff9a4a' : '#ff6a30')
          : (frac > 0.4 ? '#ff9ec4' : '#ff6f9c');
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + R);
        ctx.lineTo(e.x - R * 0.85, e.y - R * 0.7);
        ctx.lineTo(e.x + R * 0.85, e.y - R * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffd0e4';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      /* 狙擊預警線 */
      if (e.sniper && e.warnMs > 0) {
        const pulse = 0.45 + 0.55 * Math.sin(performance.now() / 80);
        ctx.strokeStyle = 'rgba(255,220,60,' + pulse.toFixed(2) + ')';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.warnTx, e.warnTy);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      /* 護盾弧 */
      if (e.shield && e.shieldOn) {
        ctx.strokeStyle = 'rgba(80,200,255,0.75)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y + 2, R + 3, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();
      }
      if (e.elite || e.shield || e.sniper) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(e.x - 14, e.y - R - 10, 28, 3);
        ctx.fillStyle = frac > 0.4 ? (e.sniper ? '#6cf' : e.shield ? '#4af' : '#ffd54a') : '#ff6b3c';
        ctx.fillRect(e.x - 14, e.y - R - 10, 28 * frac, 3);
        if (e.elite) {
          ctx.strokeStyle = 'rgba(255,220,120,0.55)';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(e.x, e.y, R + 4, 0, Math.PI * 2); ctx.stroke();
        }
      } else if (frac < 0.99) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - 8, e.y - R - 5, 16, 2);
        ctx.fillStyle = e.swarm ? '#8f8' : e.diving ? '#ffc090' : '#ffc8dd';
        ctx.fillRect(e.x - 8, e.y - R - 5, 16 * frac, 2);
      }
      if (e.label) {
        ctx.fillStyle = e.sniper ? '#9ef' : e.shield ? '#8cf' : e.swarm ? '#afa' : '#ffe9a8';
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + R + 11);
      }
    } else if (e.kind === 'bullet') {
      /* 預警線（pending aim / 短 warn spray） */
      if (e.warnMs > 0 && (e.pending || e.warnFromX != null)) {
        const pulse = 0.4 + 0.5 * Math.sin(performance.now() / 70);
        ctx.strokeStyle = 'rgba(255,210,50,' + pulse.toFixed(2) + ')';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(e.warnFromX != null ? e.warnFromX : e.x, e.warnFromY != null ? e.warnFromY : e.y);
        ctx.lineTo(e.warnTx != null ? e.warnTx : e.x, e.warnTy != null ? e.warnTy : e.y + 120);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (e.pending) {
        /* 未發射：細點提示 */
        ctx.fillStyle = 'rgba(255,220,80,0.8)';
        ctx.beginPath(); ctx.arc(e.x, e.y, 2.5, 0, Math.PI * 2); ctx.fill();
      } else if (e.split) {
        ctx.fillStyle = '#fa6';
        ctx.beginPath(); ctx.arc(e.x, e.y, 2.2, 0, Math.PI * 2); ctx.fill();
      } else if (e.sniperShot) {
        ctx.fillStyle = '#8ff';
        ctx.fillRect(e.x - 1.5, e.y - 3, 3, 6);
      } else if (!drawSprite('bullet_e', e.x, e.y, 1.2)) {
        ctx.fillStyle = '#f6c';
        ctx.fillRect(e.x - 2, e.y - 2, 4, 4);
      }
    } else if (e.kind === 'spiral') {
      if (!drawSprite('boss', e.x, e.y, 2.6)) {
        ctx.fillStyle = '#f06';
        ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, Math.PI * 2); ctx.fill();
      }
      const totalHp = e.maxHp || STAGE_TABLE[e.stage || lastStage].bossHp;
      const hpFrac = Math.max(0, Math.min(1, e.hp / totalHp));
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - 18, e.y - 24, 36, 5);
      ctx.fillStyle = hpFrac > 0.5 ? '#0f6' : (hpFrac > 0.25 ? '#ff6' : '#f06');
      ctx.fillRect(e.x - 18, e.y - 24, 36 * hpFrac, 5);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(e.x - 18, e.y - 24, 36, 5);
      if ((e.pattern === 'E' || e.pattern === 'D') && e.laserWarn !== undefined && e.laserWarn > 0 && !e.laserFiring) {
        ctx.strokeStyle = '#ff6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, 22, 0, Math.PI * 2); ctx.stroke();
      }
      if (e.label) {
        ctx.fillStyle = '#fff';
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + 30);
      }
    } else if (e.kind === 'laser') {
      if (!drawSprite('laser', e.x, e.y, 1.5)) {
        ctx.fillStyle = '#ff0';
        ctx.fillRect(e.x - 3, e.y - 3, 6, 6);
      }
      ctx.strokeStyle = 'rgba(255,220,0,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x - e.vx * 60, e.y - e.vy * 60);
      ctx.stroke();
    }
  }
  if (ship) {
    /* 推進器焰 */
    const thName = (Math.floor(performance.now() / 80) % 2) ? 'thrust_1' : 'thrust_0';
    drawSprite(thName, ship.x, ship.y + 12, 1.6);
    if (ship.shield > 0) {
      ctx.strokeStyle = 'rgba(0,255,255,' + (0.35 + 0.25*Math.sin(performance.now()/120)).toFixed(2) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 13, 0, Math.PI * 2); ctx.stroke();
    }
    const sn = SHIP_SPRITE[ship.chassis] || 'ship_a';
    if (!drawSprite(sn, ship.x, ship.y, 2.1)) {
      ctx.fillStyle = '#0ff';
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 8);
      ctx.lineTo(ship.x - 6, ship.y + 6);
      ctx.lineTo(ship.x + 6, ship.y + 6);
      ctx.closePath();
      ctx.fill();
    }
    if (isFocusActive()) {
      ctx.strokeStyle = 'rgba(255,255,0,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 15, 0, Math.PI * 2); ctx.stroke();
    }
    if (isIFramed()) {
      ctx.strokeStyle = 'rgba(255,100,200,0.5)';
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 18, 0, Math.PI * 2); ctx.stroke();
    }
  }
  /* ---------- P1-6 擦彈視覺反饋 ---------- */
function drawGrazeFx() {
  /* 光環：由擦彈點向外擴散並淡出 */
  if (grazeRingT > 0) {
    const t = grazeRingT;
    ctx.strokeStyle = 'rgba(130,255,220,' + (t * 0.75).toFixed(3) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(grazeRingX, grazeRingY, grazeRadius() * (1 - t) + 3, 0, Math.PI * 2);
    ctx.stroke();
  }
  /* 判定圈：淡淡的虛線提示，令玩家知道「呢個圈入面有分」 */
  if (ship && isStage(fsm.cur)) {
    ctx.strokeStyle = 'rgba(130,255,220,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, grazeRadius(), 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawGrazeMeter() {
  if (!ship || !isStage(fsm.cur)) return;
  /* 能量條放喺底部正中央：兩個技能按鈕喺左右（x 8–72 / 248–312），
     戰機活動下限係 396，所以 y=446 呢條係完全空嘅位置。 */
  const w = 84, h = 5;
  const x = (VIEW_W - w) / 2, y = VIEW_H - 34;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(x, y, w, h);
  const f = clamp(grazeEnergy / GRAZE_ENERGY_NEED, 0, 1);
  ctx.fillStyle = f >= 1 ? '#ffffff' : '#4df5d0';
  ctx.fillRect(x, y, w * f, h);
  ctx.strokeStyle = grazeFlash > 0
    ? 'rgba(255,255,255,' + (0.4 + grazeFlash * 0.6).toFixed(2) + ')'
    : 'rgba(130,255,220,0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#8ff';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('擦彈 ' + grazeCount + '　' + (GRAZE_ENERGY_NEED - grazeEnergy) + ' 次回充', VIEW_W / 2, y - 4);
}

  drawAbilityBtns();
  drawHudChips();
  drawGrazeFx();
  drawGrazeMeter();
  drawPauseBtn();
  /* 關卡名標籤 */
  if (isStage(fsm.cur)) {
    const th = STAGE_THEME[lastStage] || STAGE_THEME[1];
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(VIEW_W/2 - 60, 6, 120, 16);
    ctx.fillStyle = th.accent;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('S' + lastStage + ' · ' + th.name, VIEW_W/2, 17);
  }
  drawStageAffixFx();       /* v3.8 #43：詞綴橫幅 + 停電暗幕 */
  renderTail();
}

/* ---------- 12. 主迴圈（PLAN v2 #13 固定時間步累加器） ---------- */
let lastFrame = performance.now();
let accMs = 0;
function loop(nowMs) {
  let dt = nowMs - lastFrame;
  if (dt > MAX_FRAME_MS) dt = MAX_FRAME_MS;       /* cap huge gap (e.g., un-blur) */
  lastFrame = nowMs;
  accMs += dt;
  while (accMs >= FIXED_DT_MS) {
    tickVfx(FIXED_DT_MS);
    tick(FIXED_DT_MS);
    accMs -= FIXED_DT_MS;
  }
  /* HUD 計時：只在 STAGE_n 行進（全局累計；暫停／選擇強化靠平移錨點凍結） */
  if (isStage(fsm.cur) && runStartMs) {
    const sec = (nowMs - runStartMs) / 1000;
    hudEl.time.textContent = `時間：${sec.toFixed(1)} 秒`;
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 13. 初始設定 ---------- */
hudEl.state.textContent = `狀態：${stateLabel(fsm.cur)}`;
console.log('[啟動] 末日救未來 v0.21.2 已載入');
console.log('[啟動] 初始狀態 =', stateLabel(fsm.cur), '· 難度', diffName());
console.log('[啟動] 視窗 =', window.innerWidth, 'x', window.innerHeight, '· 像素比 =', window.devicePixelRatio, '· 開發者模式 =', DEBUG, '· 無敵 =', GOD);
loadAudioPrefs();   /* v3.9 #52：讀音效偏好。⚠️ 唔會建立 AudioContext（#56），只係讀數值 */
console.log('[啟動] 音效 =', audioOn ? '開' : '關', '· 音樂檔', volBgm, '· 音效檔', volSfx);
hudEl.tip.textContent = '點擊畫面開始';
requestAnimationFrame(loop);

/* 開放俾瀏覽器冒煙測試（主控台：window.__dsf.fsm.cur） */
window.__dsf = {
  fsm, bullets, enemies, shipS: SHIPS, stageS: STATE, InputState, SPRITE,
  get ship(){ return ship; },
  sheetReady: () => sheetReady, drawSprite, enterPause, resumePause,
  pauseReason: () => pauseReason, D, diffId: () => diffId, setDifficulty,
  pickShipAndStart, hitShipCard, handleMenuTap,
};
</script>
