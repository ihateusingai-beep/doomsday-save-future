<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>末日救未來 — Doomsday Save the Future</title>
<style>
  /* === reset + fullscreen === */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
    overscroll-behavior:none;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", monospace;
    color:#0ff;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
  }
  /* === canvas (PLAN v2 #10-12, CSS-scaled, image-rendering pixelated) === */
  canvas {
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    background:#000;
    touch-action:none;
    cursor:crosshair;
    box-shadow:0 0 0 1px rgba(0,255,255,0.18), 0 0 40px rgba(0,180,255,0.18);
    border-radius:4px;
  }
  /* === HUD === */
  #hud {
    position:fixed; top:10px; left:10px;
    font:12px ui-monospace, SFMono-Regular, Menlo, monospace;
    pointer-events:none;
    color:#9ff;
    line-height:1.45;
    text-shadow:0 0 6px #001a22, 0 1px 0 #000;
    background:linear-gradient(180deg, rgba(0,20,30,0.55), rgba(0,0,0,0.15));
    border:1px solid rgba(0,255,255,0.22);
    border-radius:8px;
    padding:8px 10px;
    backdrop-filter:blur(4px);
  }
  #hud .row { white-space:nowrap; }
  #hud .accent { color:#ffd56a; }
  #hud .warn { color:#ff5e8a; }
</style>
</head>
<body>
  <canvas id="game" width="320" height="480" aria-label="Doomsday Save the Future game canvas"></canvas>
  <div id="hud" aria-live="polite">
    <div class="row" id="hud-state">STATE: --</div>
    <div class="row" id="hud-time">TIME: 0.0s</div>
    <div class="row" id="hud-hp">HP: --  SHIELD: --</div>
    <div class="row" id="hud-paused"></div>
    <div class="row accent" id="hud-tip">tap canvas to begin</div>
  </div>
<script>
'use strict';
/* ============================================================
 * 末日救未來 — S0 scaffold (PLAN v2 2026-10-17)
 * coverage:
 *   S0-1 canvas 320×480 + DPR-aware backing store + CSS fit
 *   S0-2 frozen FSM (TITLE/SHIP_SELECT/STAGE_n/CHOICE/PAUSED/GAMEOVER/VICTORY)
 *   S0-3 1 ship (drag + arrow/WASD + autofire)
 *   S0-4 1 enemy (8-way spiral + ship bullets hit/damage)
 *   S0-5 tab visibilitychange → state=PAUSED + timer freeze
 *
 * follow PLAN v2 §Reference #11 (Canvas 2D / 320×480 internal coords),
 *                        #13 (fixed 60 FPS accumulator),
 *                        #15 (Pointer Events + keyboard proxy),
 *                        #16 (FSM with reset hook),
 *                        #17 (tab visibility pause)
 * ============================================================ */

/* ---------- 1. CONSTANTS ---------- */
const VIEW_W = 320;
const VIEW_H = 480;
const FIXED_DT_MS = 1000 / 60;             // 60 FPS logic step
const MAX_FRAME_MS = 100;                  // cap huge tab-blur gap

/* FSM enum (PLAN v2 #16) */
const STATE = Object.freeze({
  TITLE:       'TITLE',
  SHIP_SELECT: 'SHIP_SELECT',
  STAGE_1:     'STAGE_1',
  STAGE_2:     'STAGE_2',
  STAGE_3:     'STAGE_3',
  STAGE_4:     'STAGE_4',
  STAGE_5:     'STAGE_5',
  CHOICE:      'CHOICE',
  GAMEOVER:    'GAMEOVER',
  VICTORY:     'VICTORY',
  PAUSED:      'PAUSED',
});

/* SHIPS (PLAN v2 #1: 1 ship × 3 chassis A/B/C) */
const SHIPS = Object.freeze({
  A: { id:'A', name:'速', speed:3.2, shield:1, fireRate:10 },
  B: { id:'B', name:'盾', speed:2.4, shield:3, fireRate:14 },
  C: { id:'C', name:'火', speed:2.0, shield:1, fireRate:6  },
});

const isStage = (s) => s && s.indexOf('STAGE_') === 0;
const STAGES = [STATE.STAGE_1, STATE.STAGE_2, STATE.STAGE_3, STATE.STAGE_4, STATE.STAGE_5];

/* ---- SPRITE SHEET (pxl art.px.js → out/dsf_main.png, inline base64 PLAN) ---- */
const SPRITE = Object.freeze({
  ship_a: { x:0, y:0, w:8, h:9 },
  ship_b: { x:9, y:0, w:10, h:10 },
  ship_c: { x:20, y:0, w:10, h:10 },
  thrust_0: { x:31, y:0, w:5, h:6 },
  thrust_1: { x:37, y:0, w:5, h:6 },
  bullet_p: { x:43, y:0, w:7, h:12 },
  bullet_e: { x:51, y:0, w:9, h:9 },
  laser: { x:0, y:13, w:12, h:12 },
  boss: { x:13, y:13, w:12, h:10 },
  spark: { x:26, y:13, w:5, h:5 },
  boom_0: { x:32, y:13, w:14, h:14 },
  boom_1: { x:47, y:13, w:16, h:16 },
  boom_2: { x:64, y:13, w:16, h:16 },
  ui_focus: { x:81, y:13, w:16, h:16 },
  ui_bomb: { x:0, y:30, w:16, h:16 },
  ui_card: { x:17, y:30, w:22, h:14 },
  ui_heart: { x:40, y:30, w:7, h:7 },
  ui_shield: { x:48, y:30, w:11, h:12 },
  star_0: { x:60, y:30, w:3, h:3 },
  star_1: { x:64, y:30, w:5, h:5 },
  star_2: { x:70, y:30, w:5, h:5 },
  bldg: { x:0, y:47, w:14, h:22 },
  tower: { x:15, y:47, w:10, h:30 },
  meteor: { x:26, y:47, w:12, h:12 },
  debris: { x:39, y:47, w:12, h:10 },
  gate: { x:52, y:47, w:26, h:18 },
  logo_mark: { x:79, y:47, w:18, h:18 },
});
const SHEET_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAGEAAABNCAMAAACBtvrcAAAAk1BMVEUAAAAAPkAAAAD/5Wb/mhj/aiAA9v/4//8AoMhA9///atUAt9Y9/4r/6Wr/MolArsn/Gmr/64wP9/8PqtMPHDNNjP//pUZAJwb/7ZQzFSv5//+gECizJEwz9/8SQVT/eiQAsNISGjD/TV6KoMjI2P8cJ0SxFDj/nCkAaIhaaog6SGj/6Gx1X24cS2USO08qNUhqTk9zr1dEAAAAAXRSTlMAQObYZgAAA8NJREFUeNrt2At30jAUAOBy06alc7MycJZOpUyYQ3H7/7/Om5t3H7Qp6NFzuMt6YAv5muQmzRZFUTSbRTKAiv+SxQyvcRLTT0H/PihmnEsCOGCRLxmkDJoC8FT/PoRCICUCeMbTjJqAOQNgczAC8wXI8xzGAzccy0wA2Tv8wjZgHt8C3MZE0PDECXMEyO/u7kYTVshUoMDfcyjERQtREvlCGiLwm5sPQljcZ4tFdr8AF1Ntt4SgPswYw0u0XK0+UlliS8W8wMIbjUybh2gWA8RippdSWNJMx/O5nIZOITBtTeov4yUWevkQP2CJeoWp4ay4ByotgZ8pDN/Cpz8M2C7+g+FmRknl0sB6bYgyL7HI17z3hhrZWok4UQNiDNBAkWMhgqXMfsD9eCIC/PY9QySdm3aOgMBjvv6sCO5UgAZgiYpVhQhLAP8iwhDwlQIU8Jh/fnws8rLRR0MIAN9aopJAUbDKApvNxhKQCIDqlwhg6+JSusB6vdaEAixBAGOMeqGBrK7rzBCukGO9nC4nBPXeERgjwgibOk3TemMEO0pIqPAH6UyhkUsiW3NvRXjzcLYQlaX8bhKNiQ6aB3GyYDCw5v1k7c6lKunJpcauMbwDNNdDVSWn10P4JhO8pidslIH70jWmjnIj/JTtGuJs/AMY6o4Qp5Dtdquk1UoZqbg8jbtvu+Sg5q1AAbYpfglpRWHqP317Ej3gp3vhbQv1rhUkbKkTAuDcI0Z1YVjQowQCEASEzAPsn5+f93BaQIKuQkjbwgBAgiJ6BZkNsg+rIAEB2hoV0S+o6kisQrtQFGsiRgkymYI2Hdir/X2kIIiwXS1YiEK3zdY8fG9FfeZOLAmbS927xrnEXgP9O9/52+n1qTI0RP3vO0cPeqIHeMFwmzxg2KdF8gNaDyqbbnQuaqecz0nB/swTAMzBiGpwqgQe4BD6HwbyuASecDDtwoFzLcDhpxZkDVkJBVrqxyM1dTyqla+2YM5/iTBHsrZg+gCH1zcliFpNAYGjCE1IATi1Tob86KsT4AkIvLy+vdEbEpgnUNN4AjbEJEGE0zVXoIYzbDjThDySyLbxWisCBeYK4FqOEDkZaYTNDv8S2W1agnjOmk6YPrCWIIlDO8tHCLwhsM4+yKHpWEZDgjxktfrQJfT8L2xoHk4LeN+s88abwolc0sJgLg0IvetBhyOwacLINX1GHwRBsfOE5r5kBRYiBOytE/vQHZ0f6xLYgBD2BJrSh8Bn6F8XQApw4YOAHUd6HjWe3Bc+eFyFq/DfCNHF/ibR8RsMd+OXN39h0AAAAABJRU5ErkJggg==';
const sheetImg = new Image();
let sheetReady = false;
sheetImg.onload = () => { sheetReady = true; console.log('[sprites] sheet ready', Object.keys(SPRITE).length, 'frames'); };
sheetImg.onerror = () => { console.warn('[sprites] sheet load failed — procedural fallback'); };
sheetImg.src = 'data:image/png;base64,' + SHEET_B64;

/** draw atlas frame centered at (cx,cy); scale multiplies native px. returns false if not ready */
function drawSprite(name, cx, cy, scale) {
  if (!sheetReady) return false;
  const f = SPRITE[name];
  if (!f) return false;
  const s = scale == null ? 2 : scale;
  const dw = f.w * s, dh = f.h * s;
  const prev = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sheetImg, f.x, f.y, f.w, f.h,
    Math.round(cx - dw / 2), Math.round(cy - dh / 2), dw, dh);
  ctx.imageSmoothingEnabled = prev;
  return true;
}
const SHIP_SPRITE = Object.freeze({ A: 'ship_a', B: 'ship_b', C: 'ship_c' });

/* ---------- VFX / WORLD (beautify pass) ---------- */
const STAGE_THEME = Object.freeze({
  1: { name:'維港起飛', skyTop:'#030814', skyBot:'#0a1a3a', accent:'#00f0ff', prop:'tower', tint:'rgba(0,180,255,0.06)' },
  2: { name:'九龍煙柱', skyTop:'#100808', skyBot:'#2a1010', accent:'#ff6a20', prop:'bldg',  tint:'rgba(255,80,40,0.07)' },
  3: { name:'大氣層',   skyTop:'#080618', skyBot:'#1a1040', accent:'#ff9a18', prop:'meteor',tint:'rgba(180,100,255,0.06)' },
  4: { name:'軌道殘骸', skyTop:'#000000', skyBot:'#101820', accent:'#8aa0c8', prop:'debris',tint:'rgba(120,160,200,0.05)' },
  5: { name:'逃逸門',   skyTop:'#000510', skyBot:'#001828', accent:'#3dff8a', prop:'gate',  tint:'rgba(0,255,140,0.07)' },
});
const stars = Array.from({ length: 48 }, (_, i) => ({
  x: (i * 53 + 17) % VIEW_W,
  y: (i * 97 + 11) % VIEW_H,
  z: 0.35 + (i % 5) * 0.18,
  kind: i % 7 === 0 ? 2 : (i % 3 === 0 ? 1 : 0),
}));
let particles = [];
let screenFlash = 0;
let hitShake = 0;
let bgScroll = 0;

function spawnSparks(x, y, n, speed) {
  const sp = speed == null ? 0.12 : speed;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = sp * (0.4 + Math.random());
    particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 280 + Math.random()*220, max: 400, kind: 'spark' });
  }
}
function spawnBoom(x, y) {
  particles.push({ x, y, vx: 0, vy: 0, life: 420, max: 420, kind: 'boom', frame: 0 });
  spawnSparks(x, y, 10, 0.18);
  screenFlash = Math.max(screenFlash, 0.55);
}
function tickVfx(dtMs) {
  bgScroll += dtMs * 0.025;
  if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dtMs * 0.0022);
  if (hitShake > 0) hitShake = Math.max(0, hitShake - dtMs * 0.012);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dtMs;
    p.x += p.vx * dtMs;
    p.y += p.vy * dtMs;
    if (p.kind === 'boom') {
      p.frame = p.life > 280 ? 0 : (p.life > 140 ? 1 : 2);
    } else {
      p.vy += 0.00015 * dtMs;
    }
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (const s of stars) {
    s.y += s.z * dtMs * 0.04;
    if (s.y > VIEW_H + 4) { s.y = -4; s.x = (s.x + 47) % VIEW_W; }
  }
}
function drawBackdrop(stageId) {
  const th = STAGE_THEME[stageId] || STAGE_THEME[1];
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, th.skyTop);
  g.addColorStop(1, th.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  for (const s of stars) {
    const name = s.kind === 2 ? 'star_2' : (s.kind === 1 ? 'star_1' : 'star_0');
    if (!drawSprite(name, s.x, s.y, s.z > 0.8 ? 1.2 : 1)) {
      ctx.fillStyle = s.kind ? '#8cf' : '#fff';
      ctx.fillRect(s.x, s.y, s.kind ? 2 : 1, s.kind ? 2 : 1);
    }
  }
  const prop = th.prop;
  const baseY = VIEW_H - 10 + Math.sin(bgScroll * 0.02) * 2;
  if (prop === 'tower' || prop === 'bldg') {
    for (let i = 0; i < 5; i++) {
      const x = ((i * 70 + bgScroll * 0.15) % (VIEW_W + 40)) - 20;
      drawSprite(i % 2 ? 'tower' : 'bldg', x, baseY - (i % 3) * 8, 1.2);
    }
  } else if (prop === 'meteor') {
    for (let i = 0; i < 4; i++) {
      const x = (i * 90 + bgScroll * 0.4) % (VIEW_W + 30) - 15;
      const y = ((i * 110 + bgScroll * 0.55) % (VIEW_H + 40)) - 20;
      drawSprite('meteor', x, y, 1.3);
    }
  } else if (prop === 'debris') {
    for (let i = 0; i < 5; i++) {
      const x = (i * 75 + bgScroll * 0.3) % (VIEW_W + 30) - 15;
      const y = 40 + ((i * 97 + bgScroll * 0.2) % (VIEW_H - 80));
      drawSprite('debris', x, y, 1.2);
    }
  } else if (prop === 'gate') {
    drawSprite('gate', VIEW_W/2, 70 + Math.sin(bgScroll * 0.03) * 6, 1.4);
    for (let i = 0; i < 3; i++) drawSprite('debris', 40 + i * 100, 200 + i * 40, 1);
  }
  ctx.fillStyle = th.tint;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const vg = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, VIEW_H*0.2, VIEW_W/2, VIEW_H/2, VIEW_H*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.kind === 'boom') {
      const nm = p.frame === 0 ? 'boom_0' : (p.frame === 1 ? 'boom_1' : 'boom_2');
      if (!drawSprite(nm, p.x, p.y, 1.4)) {
        ctx.fillStyle = '#ff6';
        ctx.beginPath(); ctx.arc(p.x, p.y, 8 * a, 0, Math.PI*2); ctx.fill();
      }
    } else if (!drawSprite('spark', p.x, p.y, 1)) {
      ctx.fillStyle = '#ff6';
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
  }
  ctx.globalAlpha = 1;
}
function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < VIEW_H; y += 3) ctx.fillRect(0, y, VIEW_W, 1);
}
function drawFlash() {
  if (screenFlash <= 0) return;
  ctx.fillStyle = 'rgba(180,255,255,' + (screenFlash * 0.45).toFixed(3) + ')';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}
function drawHudChips() {
  if (!ship || !isStage(fsm.cur)) return;
  for (let i = 0; i < ship.maxHp; i++) {
    const on = i < ship.hp;
    ctx.globalAlpha = on ? 1 : 0.28;
    if (!drawSprite('ui_heart', 14 + i * 14, VIEW_H - 18, 1.15)) {
      ctx.fillStyle = on ? '#f06' : '#444';
      ctx.fillRect(8 + i * 12, VIEW_H - 22, 10, 8);
    }
    ctx.globalAlpha = 1;
  }
  for (let i = 0; i < Math.min(ship.shield, 5); i++) {
    drawSprite('ui_shield', VIEW_W - 14 - i * 14, VIEW_H - 18, 1);
  }
}

/* ---------- 2. INPUT LAYER (PLAN v2 #15, #18-19) ---------- */
const InputState = {
  /* last-write-wins target (drag OR WASD converge here) */
  targetX: VIEW_W / 2,
  targetY: VIEW_H - 60,

  /* keyboard proxy */
  keys: { up:false, down:false, left:false, right:false },

  /* focus / bomb are now CD-cooldown driven (focusActiveUntil, bombCDUntil
     module-level globals), not consume-on-read flags — S1-C */

  /* drag bookkeeping */
  dragId: null,
  dragOrigin: { x:0, y:0 },
  shipOrigin: { x:0, y:0 },
  touchMoved: false,
};

/* 8px tolerance for Smart Board dedup — PLAN v2 #19 */
const DRAG_TOLERANCE_PX = 8;

/* ---------- 3. DOM refs ---------- */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const hudEl  = {
  state:  document.getElementById('hud-state'),
  time:   document.getElementById('hud-time'),
  hp:     document.getElementById('hud-hp'),
  paused: document.getElementById('hud-paused'),
  tip:    document.getElementById('hud-tip'),
};

/* ---------- 4. Canvas DPR (PLAN v2 #12) ---------- */
function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = VIEW_W * dpr;
  canvas.height = VIEW_H * dpr;
  /* fit while preserving 320×480 aspect */
  const aspect = VIEW_W / VIEW_H;
  const winAspect = window.innerWidth / window.innerHeight;
  let cssW, cssH;
  if (winAspect > aspect) {
    cssH = Math.min(window.innerHeight, window.innerWidth * (1/aspect));
    cssW = cssH * aspect;
  } else {
    cssW = Math.min(window.innerWidth, window.innerHeight * aspect);
    cssH = cssW / aspect;
  }
  canvas.style.width  = Math.floor(cssW) + 'px';
  canvas.style.height = Math.floor(cssH) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);    // logical coords = internal 320×480
}
setupCanvas();
window.addEventListener('resize', setupCanvas);
window.addEventListener('orientationchange', () => setTimeout(setupCanvas, 120));

/* ---------- 5. FSM ---------- */
const fsm = {
  cur: STATE.TITLE,
  prev: null,                 // remember pre-PAUSED state for resume
  transitions: [],            // for S0-2: log to console

  set(next) {
    if (next === this.cur) return;
    const from = this.cur;
    this.prev = this.cur;
    this.cur  = next;
    this.transitions.push({ from, to: next, at: performance.now() });
    /* F2 reset-on-render: per-state entry reset (PLAN v2 #16) */
    onStateEnter(next, from);
    /* S0-2 log */
    console.log(`[FSM] ${from} → ${next} @ ${(performance.now()/1000).toFixed(2)}s`);
    hudEl.state.textContent = `STATE: ${next}`;
  },
};

function onStateEnter(s, from) {
  if (isStage(s)) {
    lastStage = parseInt(s.split('_')[1], 10);
    /* reset entities, apply upgrades */
    bullets.length = 0;
    enemies.length = 0;
    if (!ship) pickShip('A');                 // default ship first run
    applyUpgrades();
    ship.x = VIEW_W/2; ship.y = VIEW_H - 60;
    ship.hp = ship.maxHp; ship.shield = SHIPS[ship.chassis].shield;
    /* reset wave scheduler */
    waveQueue = (WAVE_TEMPLATES[lastStage] || []).map(w => ({ at: w.at, spawn: w.spawn, fired: false }));
    waveCursor = 0;
    /* spawn stage boss */
    spawnBossFor(lastStage);
    /* stage clock always resets; run clock only on fresh run start (PLAN: 全程 count-up) */
    endFreezeClocks();                 /* absorb CHOICE/PAUSED gap before anchors */
    stageStartMs = performance.now();
    if (s === STATE.STAGE_1 && (from === STATE.SHIP_SELECT || runStartMs === null)) {
      runStartMs = stageStartMs;
    }
    if (from !== STATE.STAGE_1) {
      /* mid-run stage entry: don't reset runScore */
    } else {
      runScore = 0;
    }
    hudEl.tip.textContent = `S${lastStage} · ${STAGE_TABLE[lastStage].name} · drag/WASD · FOCUS/BOMB btn`;
  } else if (s === STATE.CHOICE) {
    beginFreezeClocks();               /* modal freezes run timer (PLAN §Score) */
    choiceOffer = generateChoiceOffer();
    choicePicked = -1;
    hudEl.tip.textContent = 'CHOICE · tap a card or press 1/2/3';
  } else if (s === STATE.GAMEOVER) {
    hudEl.tip.textContent = 'Retry / Title';
  } else if (s === STATE.VICTORY) {
    /* PLAN v2 §Score: final = runScore + timeBonus;
       persistence per #22 (bestScore + bestTime). */
    endFreezeClocks();                 /* no residual freeze in final calc */
    const finalRunSec = runStartMs != null ? (performance.now() - runStartMs) / 1000 : 0;
    const targetTotal = STAGES.reduce((acc, st) => acc + STAGE_TABLE[st.split('_')[1]].targetSec, 0);
    const timeBonus = Math.max(0, targetTotal - finalRunSec) * 10;
    finalScore = runScore + timeBonus;
    victoryRunSec = finalRunSec;
    victoryTimeBonus = timeBonus;
    /* compare + persist */
    let isNewBestScore = false, isNewBestTime = false;
    if (finalScore > bestScore) { bestScore = finalScore; lsWrite(LS_KEY_SCORE, bestScore); isNewBestScore = true; }
    if (bestTime === 0 || finalRunSec < bestTime) { bestTime = finalRunSec; lsWrite(LS_KEY_TIME, bestTime); isNewBestTime = true; }
    isNewBest = isNewBestScore || isNewBestTime;
    console.log(`[VICTORY] final=${Math.floor(finalScore)} best=${Math.floor(bestScore)} time=${finalRunSec.toFixed(1)}s bestTime=${bestTime.toFixed(1)}s newBest=${isNewBest}`);
    hudEl.tip.textContent = `Mission complete · score ${Math.floor(finalScore)}`;
  } else if (s === STATE.PAUSED) {
    hudEl.tip.textContent = 'PAUSED — tab hidden';
  } else if (s === STATE.TITLE) {
    hudEl.tip.textContent = 'tap canvas to begin';
    bullets.length = 0; enemies.length = 0;
    /* keep ship + playerStacks for retry */
  } else if (s === STATE.SHIP_SELECT) {
    /* new run: reset score + clocks */
    runScore = 0;
    runStartMs = null;
    stageStartMs = null;
    pausedAtMs = null;
    hudEl.tip.textContent = 'A / B / C (or tap a ship card)';
  }
}

let ship = null;            /* { chassis, x, y, hp, maxHp, shield, speed, fireRate, fireCD,
                                 bulletCount, bulletDmg, bombCD, focusFactor,
                                 focusDuration, focusCD, grazeMult, pierce,
                                 resurrect, aurora, masterStacks, iFrameUntil } */
let bullets = [];           /* { x, y, vx, vy, owner:'player' } */
let enemies = [];           /* spiral | bullet | boss */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function pickShip(id) {
  const c = SHIPS[id];
  ship = {
    chassis: id,
    x: VIEW_W / 2,
    y: VIEW_H - 60,
    hp: 3, maxHp: 3,
    shield: c.shield,
    speed: c.speed,
    fireRate: c.fireRate,
    fireCD: 0,
    bulletCount: 2,
    bulletDmg: 1,
    bombCD: 12000,
    focusFactor: 0.3,
    focusDuration: 4000,
    focusCD: 8000,
    grazeMult: 1.0,
    pierce: 0,
    resurrect: 0,
    aurora: 0,
    masterStacks: 0,
    iFrameUntil: 0,
  };
  /* apply any existing stacks (resuming run) */
  applyUpgrades();
}

function applyUpgrades() {
  if (!ship) return;
  /* reset to base */
  const c = SHIPS[ship.chassis];
  ship.maxHp        = 3;
  ship.shield       = c.shield;
  ship.speed        = c.speed;
  ship.fireRate     = c.fireRate;
  ship.bulletCount  = 2;
  ship.bulletDmg    = 1;
  ship.bombCD       = 12000;
  ship.focusFactor  = 0.3;
  ship.focusDuration= 4000;
  ship.focusCD      = 8000;
  ship.grazeMult    = 1.0;
  ship.pierce       = 0;
  ship.resurrect    = 0;
  ship.aurora       = 0;
  ship.masterStacks = 0;
  /* apply stacks */
  for (const up of UPGRADES) {
    const n = playerStacks[up.id] || 0;
    if (n > 0) up.mod(ship, n);
  }
  /* master: multiplicative 1.20 per stack on speed/fireRate */
  if (ship.masterStacks > 0) {
    const m = Math.pow(1.20, ship.masterStacks);
    ship.speed    *= m;
    ship.fireRate *= m;
  }
  /* clamp hp upward if maxHp grew */
  if (ship.hp < ship.maxHp) ship.hp = ship.maxHp;
  /* keep shield ≥ 0 */
  if (ship.shield < 0) ship.shield = 0;
}

  /* 3 cards from UPGRADES pool; re-offer allowed (no exclusion). */
  const pick = () => UPGRADES[Math.floor(Math.random() * UPGRADES.length)];

function applyPickedUpgrade(idx) {

  playerStacks[up.id] = (playerStacks[up.id] || 0) + 1;
  console.log('[CHOICE] picked', up.id, 'count =', playerStacks[up.id]);

}

function spawnBossFor(stageId) {
  const st = STAGE_TABLE[stageId] || STAGE_TABLE[1];
  enemies.push({
    kind: 'spiral',
    stage: stageId,
    pattern: st.pattern,
    x: VIEW_W / 2, y: 60,
    hp: st.bossHp,
    maxHp: st.bossHp,
    t: 0,

  });
  console.log(`[stage ${stageId}] ${st.name} spawned · boss HP ${st.bossHp} · pattern ${st.pattern}`);
}

function spawnWaveAt(stageId) {
  /* called when waveScheduler timer fires; reads WAVE_TEMPLATES[stageId] entry */
  const tpl = (WAVE_TEMPLATES[stageId] || []);
  while (waveCursor < tpl.length) {
    const w = tpl[waveCursor];
    for (const s of w.spawn) emitWaveType(s, stageId);
    waveCursor++;
  }
}

function emitWaveType(s, stageId) {
  /* emit enemies of a given type from top of canvas */
  const cx = VIEW_W / 2;
  switch (s.type) {
    case 'spray': {
      const baseA = Math.PI / 2;
      for (let i = 0; i < s.count; i++) {
        const a = baseA + (i - (s.count - 1) / 2) * s.spread;
        enemies.push({
          kind: 'bullet',
          x: cx + (Math.random() - 0.5) * VIEW_W * 0.6,
          y: 20,
          vx: Math.cos(a) * s.speed,
          vy: Math.sin(a) * s.speed,
        });
      }
      break;
    }
    case 'aim': {
      /* shoots directly at current ship position */
      const sx = ship ? ship.x : cx;
      const sy = ship ? ship.y : VIEW_H - 60;
      for (let i = 0; i < s.count; i++) {
        const a = Math.atan2(sy - 20, sx - cx) + (i - (s.count - 1) / 2) * 0.08;
        enemies.push({ kind:'bullet', x: cx + (Math.random()-0.5)*VIEW_W*0.5, y: 20, vx: Math.cos(a)*s.speed, vy: Math.sin(a)*s.speed });
      }
      break;
    }
    case 'ring': {
      const ang0 = Math.random() * Math.PI * 2;
      for (let i = 0; i < s.count; i++) {
        const a = ang0 + i * (Math.PI * 2 / s.count);
        enemies.push({ kind:'bullet', x: cx, y: 80, vx: Math.cos(a)*s.speed, vy: Math.sin(a)*s.speed });
      }
      break;
    }
    case 'meteor': {
      for (let i = 0; i < s.count; i++) {
        const x = 30 + Math.random() * (VIEW_W - 60);
        enemies.push({ kind:'bullet', x, y: 10, vx: (Math.random()-0.5)*0.02, vy: s.speed * (0.8 + Math.random()*0.4) });
      }
      break;
    }
  }
}

/* ---------- 7. INPUT — Pointer Events + Keyboard ---------- */
canvas.addEventListener('pointerdown', (e) => {
  /* onTap dispatch by state */
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX, cy = e.clientY;
  const px = (cx - rect.left) * VIEW_W / rect.width;
  const py = (cy - rect.top)  * VIEW_H / rect.height;
  if (fsm.cur === STATE.TITLE) { fsm.set(STATE.SHIP_SELECT); return; }
  if (fsm.cur === STATE.SHIP_SELECT) {
    /* 64×64 cards at y = VIEW_H/2 ± 32; three columns x ∈ {60,160,260} ± 32 */
    if (py > VIEW_H/2 - 32 && py < VIEW_H/2 + 32) {
      if (px > 28  && px < 92 ) return pickShipAndStart('A');
      if (px > 128 && px < 192) return pickShipAndStart('B');
      if (px > 228 && px < 292) return pickShipAndStart('C');
    }
    return;
  }
  if (fsm.cur === STATE.GAMEOVER) {
    const hit = hitEndBtn(px, py);
    if (hit === 'retry') return goRetry();
    if (hit === 'title') return goTitle();
    return;
  }
  if (fsm.cur === STATE.VICTORY) {
    const hit = hitEndBtn(px, py);
    if (hit === 'retry') return goRetry();
    if (hit === 'title') return goTitle();
    return;
  }
  if (fsm.cur === STATE.CHOICE) {
    /* 3 cards: 88×96 centered, gap 12 — match render() geometry */
    const cardW = 88, cardH = 96, gap = 12;
    const totalW = cardW * 3 + gap * 2;
    const startX = (VIEW_W - totalW) / 2;
    const cardY = VIEW_H / 2 - 40;
    if (py > cardY && py < cardY + cardH && px > startX && px < startX + totalW) {
      const idx = Math.floor((px - startX) / (cardW + gap));
      if (idx >= 0 && idx <= 2 && choiceOffer[idx]) {
        applyPickedUpgrade(idx);
        advanceStage();
        return;
      }
    }
    return;
  }
  /* STAGE_n: ability tap OR start drag bookkeeping */
  if (isStage(fsm.cur)) {
    const ab = hitAbilityBtn(px, py);
    if (ab === 'focus') { tryFocus(); return; }
    if (ab === 'bomb')  { tryBomb();  return; }
    InputState.dragId = e.pointerId;
    InputState.dragOrigin = { x: cx, y: cy };
    InputState.shipOrigin = { x: ship.x, y: ship.y };
    InputState.touchMoved = false;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== InputState.dragId) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX, cy = e.clientY;
  const dxCss = cx - InputState.dragOrigin.x;
  const dyCss = cy - InputState.dragOrigin.y;
  const distCss = Math.hypot(dxCss, dyCss);
  if (!InputState.touchMoved && distCss > DRAG_TOLERANCE_PX) {
    InputState.touchMoved = true;
  }
  if (InputState.touchMoved && ship) {
    /* convert CSS delta to internal-coord delta using canvas rect */
    const newX = InputState.shipOrigin.x + dxCss * VIEW_W / rect.width;
    const newY = InputState.shipOrigin.y + dyCss * VIEW_H / rect.height;
    InputState.targetX = clamp(newX, 8, VIEW_W - 8);
    InputState.targetY = clamp(newY, 8, VIEW_H - 8);
  }
});

function endDrag(e) {
  if (e.pointerId === InputState.dragId) {
    InputState.dragId = null;
    /* if never crossed tolerance, treat as tap (already handled in pointerdown) */
  }
}
canvas.addEventListener('pointerup',    endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* prevent iPad scroll/zoom */
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive:false });

/* keyboard proxy */
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup'    || k === 'w') { InputState.keys.up = true; e.preventDefault(); }
  if (k === 'arrowdown'  || k === 's') { InputState.keys.down = true; e.preventDefault(); }
  if (k === 'arrowleft'  || k === 'a') { InputState.keys.left = true; }
  if (k === 'arrowright' || k === 'd') { InputState.keys.right = true; }
  if (k === ' ')  {
    tryFocus();
    e.preventDefault();
  }
  if (k === 'shift') {
    tryBomb();
    e.preventDefault();
  }
  /* ship select via keyboard */
  if (fsm.cur === STATE.SHIP_SELECT) {
    if (k === 'a') pickShipAndStart('A');
    if (k === 'b') pickShipAndStart('B');
    if (k === 'c') pickShipAndStart('C');
  }
  if (fsm.cur === STATE.CHOICE) {
    /* S1-A: 1/2/3 keys pick a card (PLAN v2 #3 re-offer) */
    if (k === '1') { applyPickedUpgrade(0); advanceStage(); }
    else if (k === '2') { applyPickedUpgrade(1); advanceStage(); }
    else if (k === '3') { applyPickedUpgrade(2); advanceStage(); }
    else if (k === 'escape' || k === 'enter') {
      /* skip — also pick first card as default so it never deadlocks */
      applyPickedUpgrade(0);
      advanceStage();
    }
  }
  /* PLAN: GAMEOVER/VICTORY → [Retry] / [Title] */
  if (fsm.cur === STATE.GAMEOVER || fsm.cur === STATE.VICTORY) {
    if (k === 'r' || k === 'enter') { goRetry(); e.preventDefault(); }
    else if (k === 't' || k === 'escape') { goTitle(); e.preventDefault(); }
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup'    || k === 'w') InputState.keys.up    = false;
  if (k === 'arrowdown'  || k === 's') InputState.keys.down  = false;
  if (k === 'arrowleft'  || k === 'a') InputState.keys.left  = false;
  if (k === 'arrowright' || k === 'd') InputState.keys.right = false;
});

function pickShipAndStart(id) {
  pickShip(id);
  fsm.set(STATE.STAGE_1);
}

/* ---------- end-screen exits (PLAN: GAMEOVER [Retry]/[Title]; VICTORY same) ---------- */
function endScreenBtns() {
  /* ≥64×64 touch targets, bottom row (PLAN v2 #20) */
  const w = 128, h = 64, gap = 16;
  const total = w * 2 + gap;
  const startX = (VIEW_W - total) / 2;
  const y = VIEW_H - 100;
  return {
    retry: { x: startX, y, w, h, label: 'RETRY' },
    title: { x: startX + w + gap, y, w, h, label: 'TITLE' },
  };
}
function hitEndBtn(px, py) {
  const b = endScreenBtns();
  const inside = (r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  if (inside(b.retry)) return 'retry';
  if (inside(b.title)) return 'title';
  return null;
}
function drawEndBtns() {
  const b = endScreenBtns();
  for (const key of ['retry', 'title']) {
    const r = b[key];
    ctx.fillStyle = key === 'retry' ? 'rgba(0,80,60,0.95)' : 'rgba(0,40,60,0.95)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = key === 'retry' ? '#0f6' : '#0ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(r.label, r.x + r.w / 2, r.y + r.h / 2);
  }
  ctx.textBaseline = 'alphabetic';
  ctx.font = '10px monospace';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.fillText('R / Enter = Retry · T / Esc = Title', VIEW_W / 2, VIEW_H - 22);
}

  runStartMs = null;

  victoryTimeBonus = 0;
  finalScore = 0;
  focusActiveUntil = 0;
  focusCDUntil = 0;
  bombCDUntil = 0;
  iFrameUntil = 0;

/* ---------- 8. TAB VISIBILITY + CLOCKS (PLAN v2 #17 + §Score 全程) ---------- */
let runStartMs   = null;   /* full-run anchor; only set on STAGE_1 start; freeze-shifted */
let stageStartMs = null;   /* per-stage anchor for WAVE_TEMPLATES; reset each STAGE_n */
let pausedAtMs   = null;   /* freeze start (tab PAUSED or CHOICE modal); null = live */
function beginFreezeClocks() {
  if (pausedAtMs === null) pausedAtMs = performance.now();
}
function endFreezeClocks() {
  /* PLAN v2 #17: resume MUST NOT replay lost time — shift anchors forward by freeze gap. */
  if (pausedAtMs === null) return;
  const gap = performance.now() - pausedAtMs;
  if (runStartMs   !== null) runStartMs   += gap;
  if (stageStartMs !== null) stageStartMs += gap;
  pausedAtMs = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    /* pause iff in STAGE_n — don't pause TITLE/SHIP_SELECT/GAMEOVER/VICTORY/CHOICE */
    if (isStage(fsm.cur) && fsm.cur !== STATE.PAUSED) {
      beginFreezeClocks();
      fsm.prev = fsm.cur;
      fsm.set(STATE.PAUSED);
      hudEl.paused.textContent = '⏸ hidden';
    }
  } else {
    /* resume iff PAUSED */
    if (fsm.cur === STATE.PAUSED) {
      const resumeTo = fsm.prev || STATE.STAGE_1;
      /* bypass fsm.set() to avoid onStateEnter reset wiping live bullets/enemies */
      fsm.cur = resumeTo;
      fsm.prev = STATE.PAUSED;
      endFreezeClocks();          /* freeze HUD/run/stage timers across pause gap */
      hudEl.state.textContent = `STATE: ${resumeTo}`;
      hudEl.paused.textContent = '';
      console.log(`[FSM] PAUSED → ${resumeTo} @ ${(performance.now()/1000).toFixed(2)}s (no time replay)`);
    }
  }
});

/* ---------- 9. STAGE FLOW ---------- */
function advanceStage() {
  /* Called from CHOICE pick: go to next stage (or VICTORY if last boss defeated). */
  if (fsm.cur === STATE.CHOICE) {
    const next = lastStage + 1;
    if (next > STAGES.length) {
      fsm.set(STATE.VICTORY);
    } else {
      fsm.set(STAGES[next - 1]);
    }
    return;
  }
  /* other callers: linear from current STAGE_n */
  const idx = STAGES.indexOf(fsm.cur);
  if (idx >= 0 && idx < STAGES.length - 1) {
    fsm.set(STAGES[idx + 1]);
  } else if (idx === STAGES.length - 1) {
    fsm.set(STATE.VICTORY);
  } else {
    fsm.set(STATE.STAGE_1);
  }
}

/* ---------- 10. TICK (PLAN v2 #13 fixed 60 FPS) ---------- */
let finalScore = 0;          /* computed on VICTORY entry; displayed on render */
let victoryRunSec = 0;       /* frozen full-run seconds at VICTORY entry */
let victoryTimeBonus = 0;    /* frozen timeBonus at VICTORY entry */

/* localStorage persistence (PLAN v2 #22) */
const LS_KEY_SCORE = 'dsf.bestScore';
const LS_KEY_TIME  = 'dsf.bestTime';
let bestScore = 0, bestTime = 0;
function lsRead(key) {
  try {
    const v = parseFloat(localStorage.getItem(key));
    return Number.isFinite(v) ? v : 0;
  } catch (e) { return 0; }       /* private mode / disabled LS */
}
function lsWrite(key, val) {
  try { localStorage.setItem(key, String(val)); } catch (e) { /* quota / private mode — silent */ }
}
bestScore = lsRead(LS_KEY_SCORE);
bestTime  = lsRead(LS_KEY_TIME);
let isNewBest = false;          /* set on VICTORY entry, displayed on render */

/* focus / bomb cooldowns (PLAN v2 #6-#7) — durations/CD read from ship when armed */
const BOMB_IFRAME_MS = 1500;
let focusActiveUntil = 0;    /* perf.now() ms */
let focusCDUntil    = 0;
let bombCDUntil     = 0;
let iFrameUntil     = 0;
function isFocusActive() { return performance.now() < focusActiveUntil; }
function isIFramed()    { return performance.now() < iFrameUntil; }
function focusSlowFactor() {
  if (!isFocusActive()) return 1.0;
  const f = ship && ship.focusFactor != null ? ship.focusFactor : 0.3;
  return f;
}
function tryFocus() {
  if (!isStage(fsm.cur) || !ship) return false;
  const now = performance.now();
  if (now < focusCDUntil) return false;
  const dur = ship.focusDuration || 4000;
  const cd  = ship.focusCD || 8000;
  focusActiveUntil = now + dur;
  focusCDUntil     = focusActiveUntil + cd;   /* CD starts after focus ends */
  console.log('[focus] ON', (dur/1000).toFixed(1) + 's · factor', ship.focusFactor, '@', (now/1000).toFixed(2));
  return true;
}
function tryBomb() {
  if (!isStage(fsm.cur) || !ship) return false;
  const now = performance.now();
  if (now < bombCDUntil) return false;
  const cd = ship.bombCD || 12000;
  bombCDUntil = now + cd;
  iFrameUntil = now + BOMB_IFRAME_MS;
  /* wipe enemy projectiles (bullets + lasers) */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const k = enemies[i].kind;
    if (k === 'bullet' || k === 'laser') enemies.splice(i, 1);
  }
  if (ship) spawnBoom(ship.x, ship.y);
  screenFlash = Math.max(screenFlash, 0.7);
  console.log('[bomb] ON i-frame', (BOMB_IFRAME_MS/1000).toFixed(1) + 's · CD', (cd/1000).toFixed(1) + 's @', (now/1000).toFixed(2));
  return true;
}
function abilityBtns() {
  /* touch ≥64×64, bottom corners — avoid ship drag conflict via hit-first */
  const w = 64, h = 64, m = 8;
  return {
    focus: { x: m, y: VIEW_H - h - m, w, h, label: 'FOCUS' },
    bomb:  { x: VIEW_W - w - m, y: VIEW_H - h - m, w, h, label: 'BOMB' },
  };
}
function hitAbilityBtn(px, py) {
  const b = abilityBtns();
  const inside = (r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  if (inside(b.focus)) return 'focus';
  if (inside(b.bomb))  return 'bomb';
  return null;
}
function drawAbilityBtns() {
  if (!isStage(fsm.cur)) return;
  const now = performance.now();
  const b = abilityBtns();
  const items = [
    { key: 'focus', ready: now >= focusCDUntil, active: isFocusActive(),
      cdLeft: Math.max(0, focusCDUntil - now) },
    { key: 'bomb',  ready: now >= bombCDUntil,  active: isIFramed(),
      cdLeft: Math.max(0, bombCDUntil - now) },
  ];
  for (const it of items) {
    const r = b[it.key];
    ctx.fillStyle = it.active ? 'rgba(255,255,0,0.35)'
                  : it.ready  ? 'rgba(0,60,80,0.85)'
                              : 'rgba(30,30,30,0.75)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = it.active ? '#ff0' : it.ready ? '#0ff' : '#555';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    const icon = it.key === 'focus' ? 'ui_focus' : 'ui_bomb';
    const iconDrawn = drawSprite(icon, r.x + r.w/2, r.y + r.h/2 - 6, 1);
    ctx.fillStyle = it.ready || it.active ? '#fff' : '#888';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (!iconDrawn) ctx.fillText(r.label, r.x + r.w/2, r.y + r.h/2 - 8);
    ctx.font = '9px monospace';
    if (it.active) {
      ctx.fillStyle = '#ff0';
      ctx.fillText('ON', r.x + r.w/2, r.y + r.h - 12);
    } else if (!it.ready) {
      ctx.fillStyle = '#f06';
      ctx.fillText(Math.ceil(it.cdLeft/1000) + 's', r.x + r.w/2, r.y + r.h - 12);
    } else {
      ctx.fillStyle = '#0f6';
      ctx.fillText('READY', r.x + r.w/2, r.y + r.h - 12);
    }
  }
  ctx.textBaseline = 'alphabetic';
}

function tick(dtMs) {
  /* freeze during non-play states */
  if (!isStage(fsm.cur)) return;

  /* ---- wave scheduler (S1-B): emit waves on stage-time targets ---- */
  if (stageStartMs) {
    const stageMs = performance.now() - stageStartMs;
    while (waveCursor < waveQueue.length && waveQueue[waveCursor].at <= stageMs) {
      const w = waveQueue[waveCursor];
      for (const s of w.spawn) emitWaveType(s, lastStage);
      waveCursor++;
    }
  }

  /* ---- ship movement (drag-first, then keys converge on target) ---- */
  let vx = 0, vy = 0;
  if (InputState.keys.left)  vx -= 1;
  if (InputState.keys.right) vx += 1;
  if (InputState.keys.up)    vy -= 1;
  if (InputState.keys.down)  vy += 1;
  if (vx || vy) {
    const len = Math.hypot(vx, vy);
    const step = ship.speed * (dtMs / 16.67);  /* ship.speed is per-frame @60fps */
    ship.x = clamp(ship.x + (vx/len) * step, 8, VIEW_W - 8);
    ship.y = clamp(ship.y + (vy/len) * step, 8, VIEW_H - 8);
    InputState.targetX = ship.x;
    InputState.targetY = ship.y;
  } else {
    /* smooth toward InputState.target (drag-set or last-keyframe) */
    ship.x += (InputState.targetX - ship.x) * 0.30;
    ship.y += (InputState.targetY - ship.y) * 0.30;
    /* hard clamp */
    ship.x = clamp(ship.x, 8, VIEW_W - 8);
    ship.y = clamp(ship.y, 8, VIEW_H - 8);
  }

  /* ---- autofire (uses bulletCount + bulletDmg from upgrades) ---- */
  ship.fireCD -= dtMs;
  if (ship.fireCD <= 0) {
    const n = Math.max(1, ship.bulletCount | 0);
    const mid = (n - 1) / 2;
    const spread = n <= 2 ? 0.08 : 0.12;   /* rad fan; 2-way stays tight */
    const spd = 0.30;
    const dmg = ship.bulletDmg || 1;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i - mid) * spread;  /* upward */
      bullets.push({
        x: ship.x + (i - mid) * 4,
        y: ship.y - 8,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        owner: 'player',
        dmg,
      });
    }
    ship.fireCD = 1000 / ship.fireRate;
  }

  /* ---- player bullets move (was missing — bullets stuck at muzzle) ---- */
  for (const b of bullets) {
    if (b.owner !== 'player') continue;
    b.x += b.vx * dtMs;
    b.y += b.vy * dtMs;
  }

  /* ---- focus & bomb are now triggered via keydown with CD checks (S1-C);
       bomb wipe handled at trigger time, i-frame active window in collision check. */

  /* ---- enemy update (with per-pattern boss behavior) ---- */
  for (const e of enemies) {
    if (e.kind === 'spiral') {
      e.t += dtMs;
      /* figure-8 path (default) */
      e.x = VIEW_W/2 + Math.cos(e.t / 600) * 80;
      e.y = 80       + Math.sin(e.t / 400) * 30;
      e.ang0 = e.t / 1000;

      /* per-pattern fire rate, count, speed */
      const P = e.pattern || 'A';
      let nWay = 8, fireEvery = 1000, bulletSpd = 0.06;
      if (P === 'A') {                       /* stage 1: classic 8-way */
        nWay = 8; fireEvery = 1000; bulletSpd = 0.06;
      } else if (P === 'B') {                /* stage 2: 12-way wider */
        nWay = 12; fireEvery = 900; bulletSpd = 0.05;
      } else if (P === 'C') {                /* stage 3: 8-way + slow rotation */
        nWay = 8; fireEvery = 750; bulletSpd = 0.07;
      } else if (P === 'D') {                /* stage 4: 16-way slow */
        nWay = 16; fireEvery = 1300; bulletSpd = 0.04;
      } else if (P === 'E') {                /* stage 5: 12-way faster */
        nWay = 12; fireEvery = 700; bulletSpd = 0.07;
      }

      e.spiralCD = (e.spiralCD || 0) + dtMs;
      if (e.spiralCD >= fireEvery) {
        e.spiralCD -= fireEvery;
        for (let i = 0; i < nWay; i++) {
          const a = e.ang0 + i * (Math.PI * 2 / nWay);
          enemies.push({ kind:'bullet', x: e.x, y: e.y, vx: Math.cos(a)*bulletSpd, vy: Math.sin(a)*bulletSpd });
        }
      }

      /* Pattern E: also fires slow laser every 4.5s (Open Question #2 partial) */
      if (P === 'E' || P === 'D') {
        e.laserCD = (e.laserCD || 0) - dtMs;
        if (e.laserCD <= 0) {
          /* laser warmup 600ms then actual laser */
          e.laserWarn = (e.laserWarn === undefined) ? 600 : e.laserWarn - dtMs;
          if (e.laserWarn <= 0 && !e.laserFiring) {
            /* FIRES: 1 high-speed shot aimed at ship */
            const sx = ship ? ship.x : VIEW_W/2;
            const a = Math.atan2(ship ? ship.y - e.y : VIEW_H/2, sx - e.x);
            enemies.push({ kind:'laser', x: e.x, y: e.y, vx: Math.cos(a)*0.20, vy: Math.sin(a)*0.20, lifeMs: 1500 });
            e.laserFiring = true;
            setTimeout(() => { e.laserFiring = false; }, 100);
            e.laserCD = 4500;
            e.laserWarn = undefined;
          }
        }
      }
    } else if (e.kind === 'laser') {
      /* focus slows enemy projectiles (PLAN v2 #6; factor from ship) */
      const slow = focusSlowFactor();
      e.x += e.vx * dtMs * slow;
      e.y += e.vy * dtMs * slow;
      e.lifeMs -= dtMs;
      if (e.lifeMs <= 0) {
        e._dead = true;
      }
    } else if (e.kind === 'bullet') {
      const slow = focusSlowFactor();
      e.x += e.vx * dtMs * slow;
      e.y += e.vy * dtMs * slow;
    }
  }

  /* ---- collision: player bullets vs spiral ---- */
  for (const e of enemies) {
    if (e.kind !== 'spiral') continue;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.owner !== 'player') continue;
      if (Math.abs(b.x - e.x) < 12 && Math.abs(b.y - e.y) < 12) {
        bullets.splice(i, 1);
        e.hp -= (b.dmg || 1);
        spawnSparks(b.x, b.y, 3, 0.08);
        if (e.hp <= 0) {
          console.log('[enemy] spiral defeated @', (performance.now()/1000).toFixed(2));
          spawnBoom(e.x, e.y);
          /* PLAN v2 §Score: kill score 200 for elite/boss */
          runScore += 200;
          /* STAGE 5 boss → VICTORY; others → CHOICE modal */
          if (lastStage >= STAGES.length) {
            fsm.set(STATE.VICTORY);
          } else {
            fsm.set(STATE.CHOICE);
          }
          return;
        }
        break;
      }
    }
  }

  /* ---- collision: enemy bullets + lasers vs ship ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.kind !== 'bullet' && e.kind !== 'laser') continue;
    const r = (e.kind === 'laser') ? 4 : 4;
    if (Math.abs(e.x - ship.x) < 6 + r && Math.abs(e.y - ship.y) < 6 + r) {
      /* PLAN v2 #7: bomb i-frame window — ignore damage during 1.5s post-bomb.
         Visuals: still flash the bullet out so player sees defense. */
      if (isIFramed()) {
        enemies.splice(i, 1);
        continue;
      }
      enemies.splice(i, 1);
      spawnSparks(ship.x, ship.y, 6, 0.14);
      hitShake = 1;
      screenFlash = Math.max(screenFlash, 0.35);
      if (ship.shield > 0) {
        ship.shield -= 1;
      } else {
        ship.hp -= 1;
        if (ship.hp <= 0) {
          console.log('[ship] destroyed');
          spawnBoom(ship.x, ship.y);
          fsm.set(STATE.GAMEOVER);
          return;
        }
      }
    }
  }

  /* ---- cull off-screen ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e._dead) { enemies.splice(i, 1); continue; }
    if (e.kind === 'bullet' && (e.x < -16 || e.x > VIEW_W + 16 || e.y < -16 || e.y > VIEW_H + 16)) {
      enemies.splice(i, 1);
    } else if (e.kind === 'laser' && (e.lifeMs !== undefined && e.lifeMs <= 0)) {
      enemies.splice(i, 1);
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.y < -8 || b.y > VIEW_H + 8 || b.x < -8 || b.x > VIEW_W + 8) {
      bullets.splice(i, 1);
    }
  }

  /* ---- HUD ---- */
  const now = performance.now();
  const focusState = isFocusActive()
    ? `FOCUS ON×${(ship.focusFactor != null ? ship.focusFactor : 0.3).toFixed(1)}`
    : `FOCUS CD ${Math.max(0, Math.ceil((focusCDUntil - now)/1000))}s`;
  const bombState  = isIFramed()
    ? `BOMB IF ${(Math.max(0, iFrameUntil - now)/1000).toFixed(1)}s`
    : (bombCDUntil > now ? `BOMB CD ${Math.max(0, Math.ceil((bombCDUntil - now)/1000))}s` : 'BOMB READY');
  hudEl.hp.textContent = `HP: ${ship.hp}  SHIELD: ${ship.shield}  SCORE: ${Math.floor(runScore)}`;
  hudEl.tip.textContent = `${focusState} · ${bombState}`;
}

    ctx.font = '11px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('(kill ' + Math.floor(runScore) + ' + time bonus ' + Math.floor(timeBonus) + ')', VIEW_W/2, VIEW_H/2 + 48);
    ctx.fillStyle = '#ff6';
    ctx.fillText('BEST: ' + Math.floor(bestScore) + ' · ' + bestTime.toFixed(1) + 's', VIEW_W/2, VIEW_H/2 + 72);
    drawEndBtns();
    drawScanlines(); drawFlash();
    ctx.restore();
    return;
  }

  if (fsm.cur === STATE.CHOICE) {
    const cardW = 88, cardH = 108, gap = 12;
    const totalW = cardW * 3 + gap * 2;
    const startX = (VIEW_W - totalW) / 2;
    const cardY = VIEW_H / 2 - 50;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#ff6';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CHOICE — pick an upgrade', VIEW_W/2, cardY - 18);
    for (let i = 0; i < 3; i++) {
      const up = choiceOffer[i];
      if (!up) continue;
      const x = startX + i * (cardW + gap);
      const y = cardY;
      const grd = ctx.createLinearGradient(x, y, x, y + cardH);
      grd.addColorStop(0, 'rgba(0,60,90,0.95)');
      grd.addColorStop(1, 'rgba(0,20,40,0.95)');
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cardW, cardH);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.strokeRect(x + 3, y + 3, cardW - 6, cardH - 6);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(up.icon, x + cardW/2, y + 32);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#0ff';
      ctx.fillText(up.nameZh, x + cardW/2, y + 52);
      ctx.font = '9px monospace';
      ctx.fillStyle = '#bcd';
      const descLines = up.desc.match(/.{1,12}/g) || [up.desc];
      for (let li = 0; li < Math.min(descLines.length, 3); li++) {
        ctx.fillText(descLines[li], x + cardW/2, y + 68 + li * 10);
      }
      const n = playerStacks[up.id] || 0;
      if (n > 0) {
        ctx.fillStyle = '#0f6';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('x' + n, x + cardW - 6, y + 14);
      }
      ctx.fillStyle = '#ff6';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('[' + (i+1) + '] tap', x + cardW/2, y + cardH - 8);
    }
    drawScanlines(); drawFlash();
    ctx.restore();
    return;
  }

  /* ---- gameplay ---- */
  for (const b of bullets) {
    if (b.owner === 'player') {
      if (!drawSprite('bullet_p', b.x, b.y, 1.4)) {
        ctx.fillStyle = '#0ff';
        ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
      }
    }
  }
  for (const e of enemies) {
    if (e.kind === 'bullet') {
      if (!drawSprite('bullet_e', e.x, e.y, 1.2)) {
        ctx.fillStyle = '#f6c';
        ctx.fillRect(e.x - 2, e.y - 2, 4, 4);
      }
    } else if (e.kind === 'spiral') {
      if (!drawSprite('boss', e.x, e.y, 2.6)) {
        ctx.fillStyle = '#f06';
        ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, Math.PI * 2); ctx.fill();
      }
      const totalHp = e.maxHp || STAGE_TABLE[e.stage || lastStage].bossHp;
      const hpFrac = Math.max(0, Math.min(1, e.hp / totalHp));
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - 18, e.y - 24, 36, 5);
      ctx.fillStyle = hpFrac > 0.5 ? '#0f6' : (hpFrac > 0.25 ? '#ff6' : '#f06');
      ctx.fillRect(e.x - 18, e.y - 24, 36 * hpFrac, 5);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(e.x - 18, e.y - 24, 36, 5);
      if ((e.pattern === 'E' || e.pattern === 'D') && e.laserWarn !== undefined && e.laserWarn > 0 && !e.laserFiring) {
        ctx.strokeStyle = '#ff6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, 22, 0, Math.PI * 2); ctx.stroke();
      }
      if (e.label) {
        ctx.fillStyle = '#fff';
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + 30);
      }
    } else if (e.kind === 'laser') {
      if (!drawSprite('laser', e.x, e.y, 1.5)) {
        ctx.fillStyle = '#ff0';
        ctx.fillRect(e.x - 3, e.y - 3, 6, 6);
      }
      ctx.strokeStyle = 'rgba(255,220,0,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x - e.vx * 60, e.y - e.vy * 60);
      ctx.stroke();
    }
  }
  if (ship) {
    /* thruster */
    const thName = (Math.floor(performance.now() / 80) % 2) ? 'thrust_1' : 'thrust_0';
    drawSprite(thName, ship.x, ship.y + 12, 1.6);
    if (ship.shield > 0) {
      ctx.strokeStyle = 'rgba(0,255,255,' + (0.35 + 0.25*Math.sin(performance.now()/120)).toFixed(2) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 13, 0, Math.PI * 2); ctx.stroke();
    }
    const sn = SHIP_SPRITE[ship.chassis] || 'ship_a';
    if (!drawSprite(sn, ship.x, ship.y, 2.1)) {
      ctx.fillStyle = '#0ff';
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 8);
      ctx.lineTo(ship.x - 6, ship.y + 6);
      ctx.lineTo(ship.x + 6, ship.y + 6);
      ctx.closePath();
      ctx.fill();
    }
    if (isFocusActive()) {
      ctx.strokeStyle = 'rgba(255,255,0,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 15, 0, Math.PI * 2); ctx.stroke();
    }
    if (isIFramed()) {
      ctx.strokeStyle = 'rgba(255,100,200,0.5)';
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 18, 0, Math.PI * 2); ctx.stroke();
    }
  }
  drawAbilityBtns();
  drawHudChips();
  /* stage name chip */
  if (isStage(fsm.cur)) {
    const th = STAGE_THEME[lastStage] || STAGE_THEME[1];
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(VIEW_W/2 - 60, 6, 120, 16);
    ctx.fillStyle = th.accent;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('S' + lastStage + ' · ' + th.name, VIEW_W/2, 17);
  }
  drawScanlines();
  drawFlash();
  ctx.restore();
}

/* ---------- 12. LOOP (PLAN v2 #13 fixed-timestep accumulator) ---------- */
let lastFrame = performance.now();
let accMs = 0;
function loop(nowMs) {
  let dt = nowMs - lastFrame;
  if (dt > MAX_FRAME_MS) dt = MAX_FRAME_MS;       /* cap huge gap (e.g., un-blur) */
  lastFrame = nowMs;
  accMs += dt;
  while (accMs >= FIXED_DT_MS) {
    tickVfx(FIXED_DT_MS);
    tick(FIXED_DT_MS);
    accMs -= FIXED_DT_MS;
  }
  /* HUD timer: full-run count-up only during STAGE_n (PAUSED/CHOICE freeze via clock shift) */
  if (isStage(fsm.cur) && runStartMs) {
    const sec = (nowMs - runStartMs) / 1000;
    hudEl.time.textContent = `TIME: ${sec.toFixed(1)}s`;
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 13. INIT ---------- */
hudEl.state.textContent = `STATE: ${fsm.cur}`;
console.log('[init] PLAN v2 S0 scaffold loaded');
console.log('[init] FSM cur =', fsm.cur);
console.log('[init] viewport =', window.innerWidth, 'x', window.innerHeight, 'dpr =', window.devicePixelRatio);
hudEl.tip.textContent = 'tap canvas to begin';
requestAnimationFrame(loop);

/* Expose for browser smoke test (console: window.__dsf.fsm.cur) */
window.__dsf = { fsm, ship, bullets, enemies, shipS: SHIPS, stageS: STATE, InputState, SPRITE, sheetReady: () => sheetReady, drawSprite };
</script>
