      —— 改射速會令手感完全唔同（例：導彈要 2.0× DPS 就得，但用射速做 → B 機導彈
      會由 0.5/s 變成 5.5/s，「慢但追」就冇咗）。
      而 **DPS 對「每發傷害」係線性**（每種形態都係「每發傷害 × 命中率 × 射速」）
      → 用傷害乘數校準，**一輪實測就收斂**，而且節奏特徵全部保留。
   ⚠️ **laser 特別注意**：佢嘅 DPS 由連續光束 tick 率（LASER_DMG_TICK_MS = 90ms
      → 11.1 次/秒）主導，**完全唔受 fireRate 影響** → 必須用傷害乘數
      （用射速乘數會 100% 冇效果 = 死卡）。
   ⚠️ 表值由實機 12 秒 boss 窗口校準（目標：相對無卡 = 2.0×）。
      凍結驗收線（PLAN #123）：每張卡 5 架機全部 ≥1.5×，同一張卡 max ÷ min ≤2×。
   ⚠️ 表外（bolt / 未列機體）一律 1 → 冇卡 = 無卡效果。 */
const FORM_DPS_MUL = {
  /* 激光：光束 tick 率固定（11.1/s），傷害 = 機體子彈傷害 × 0.35 */
  laser:     { A:   1.1149, B:   0.7619, C:   0.1651, D:   0.5736, E:   1.2345 },
  /* 軌道炮：一發一線，射速 ×0.35 */
  rail:      { A:   0.5366, B:   1.1111, C:   0.4127, D:   0.5917, E:   1.5773 },
  /* 迴力鏢：往返，射速 ×0.15 */
  boomerang: { A:   2.8852, B:   5.2173, C:        2, D:   1.8433, E:   3.5927 },
  /* 導彈：慢但追（每發 ×2.2），射速 ×0.07 */
  missile:   { A:   2.1052, B:   2.2727, C:   0.7879, D:   1.5172, E:   2.3206 },
  /* 波動彈：左右擺，彈速 ×0.9 */
  wave:      { A:   2.1205, B:   2.4483, C:    1.625, D:   2.2413, E:   2.6576 },
};

function applyShotFormCosts(s) {
  if (!s) return;
  const f = s.shotForm || 'bolt';
  /* v0.33.0 #123：形態卡 DPS 帶 —— 傷害乘數（表 = FORM_DPS_MUL）。
     ⚠️ 呢個欄位由 game logic 讀（spawnPlayerShot / fireLaser / laserTick），
        所以每次 applyUpgrades() 都會全量重算 → 永遠同當前形態一致。 */
  s.formDmgMul = 1;
  const row = FORM_DPS_MUL[f];
  if (row) {
    const m = row[s.chassis];
    if (typeof m === 'number' && isFinite(m) && m > 0) s.formDmgMul = m;
  }
  /* v0.28.0：呢兩個乘數原本係「對住壞咗嘅行為」訂嘅 ——
     迴力鏢 / 導彈之前對 boss 係 0 傷害（死卡），所以從來冇人驗過佢哋嘅實際 DPS。
     修正咗「命中唔死 + 射程 + 巡航加速」之後，佢哋會**必定命中 boss**
     （實測 16.94 / 18.48 HP/s），比其他形態卡（wave 3.13 · laser 1.80 · rail 1.60）**強 5–6 倍**
     → 變成必揀卡。所以要重訂射速代價，令 5 張形態卡落喺同一個 DPS 帶（≈ 3.4 HP/s）。
     實測推算 + 覆核：boom 0.7 → 0.15（16.94 → 3.63 → **實測 2.36**）·
     miss 0.55 → 0.10（18.48 → 8.84 → 爆散唔打 boss 後 **5.60**）→ 再收窄到 0.07（≈ 3.7）。
     ⚠️ v0.33.0 #123：**呢啲射速乘數刻意保留唔改** —— 佢哋定嘅係每種形態嘅「節奏身份」
        （導彈慢 / 迴力鏢往返 / 軌道炮一發一線），而 v0.28.0 嘅問題唔係「有射速代價」，
        係「用絕對乘數去對付差 3.75 倍嘅機體基礎射速」→ DPS 帶嘅問題而家改用
        **傷害乘數（FORM_DPS_MUL）** 校正，節奏不變。 */
  if (f === 'boomerang') s.fireRate *= 0.15;
  else if (f === 'missile') s.fireRate *= 0.07;
  else if (f === 'rail') s.fireRate *= 0.35;
  else if (f === 'wave') s.bulletSpd *= 0.9;
}

function countPlayerBullets(form) {
  let n = 0;
  for (const b of bullets) {
    if (b.owner !== 'player') continue;
    if (form && b.form !== form) continue;
    n++;
  }
  return n;
}

function cullPlayerBullets() {
  let n = countPlayerBullets();
  while (n > PLAYER_BULLET_CAP) {
    const i = bullets.findIndex(b => b.owner === 'player');
    if (i < 0) break;
    bullets.splice(i, 1);
    n--;
  }
}

function nearestEnemy(x, y) {
  let best = null, bestD = 1e12;
  for (const e of enemies) {
    if (e._dead) continue;
    if (e.kind !== 'spiral' && e.kind !== 'grunt') continue;
    const dx = e.x - x, dy = e.y - y;
    const d = dx*dx + dy*dy;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}
/** 追擊目標（慢速彈體用）：**場上有 boss 就鎖 boss，冇 boss 先追最近敵人**。
 *  ⚠️ v0.28.0 死卡修正：boss 會橫向游走（x = 160 + cos(t/600)×80，最快 133px/s），
 *     而雜魚永遠比 boss 近 → 慢速子彈（導彈 / 迴力鏢）如果每幀改追「最近嘅雜魚」，
 *     就 **100% 撞唔到 boss**（實機：揀咗 form_miss 之後 boss 血量 92 秒一啲都冇跌）。
 *  ⚠️ **只限 missile / boomerang 兩張形態卡用**；追蹤 tag（tag_home）行為唔變。 */
function bossOrNearest(x, y) {
  for (const e of enemies) {
    if (e.kind === 'spiral' && !e._dead) return e;
  }
  return nearestEnemy(x, y);
}

function pushPlayerBullet(b) {
  bullets.push(b);
  cullPlayerBullets();
}

/* v3.11 #68：laser 持續光束 —— 機身跟隨嘅光柱。
   ⚠️ **真正持續**：只要 shotForm 係 laser，光柱就一直喺度（唔靠射速維持），
      每幀做線上判定；同一敵人只計一次（_laserHitSet）。
      原本設計係「開火時光束亮 120ms」——但發射間隔 A 機 71ms / C 機 200ms，
      C 機光束熄咗 80ms 先再亮，閃爍到根本睇唔到，唔符合「持續光束」。
      而家改成：光束常駐 + 每幀判定（用 tick 內嘅 laserTick()）。 */
const LASER_W = 8;                 /* 光束半寬 */
const LASER_LEN = 460;             /* 光束長度（畫面高 480，由機身向上） */
const LASER_DMG_TICK_MS = 90;      /* 同一敵人最少隔幾多 ms 先可以再被打 */
let laserHitSet = [];              /* 本次光束已打中過嘅敵（避免每幀重複計分） */
let laserHitAt = null;             /* 敵 → 上次命中時間戳 */

/* 開火：立即做一次線上判定（唔等下一幀，確保第一下就打中） */
function fireLaser(ship) {
  /* v0.33.0 #123：形態卡 DPS 帶 —— laser 嘅 DPS 由光束 tick 率（11.1/s）主導，
     完全唔受 fireRate 影響 → 必須用傷害乘數（表 FORM_DPS_MUL.laser）。 */
  const dmg = ((ship.bulletDmg || 1) + lootBulletDmg()) * 0.35 * (ship.formDmgMul || 1);
  const x = ship.x, y = ship.y - 8;
  const now = performance.now();
  for (const e of enemies) {
    if (e.kind !== 'spiral' && e.kind !== 'grunt') continue;
    if (e._dead) continue;
    const halfW = (e.kind === 'spiral') ? 12 : 8;
    /* 線段 = x 固定喺機身，y 由機身向上到畫面頂。敵圓形落喺光束矩形內即中。 */
    if (Math.abs(e.x - x) < halfW + LASER_W && e.y < y && e.y > y - LASER_LEN) {
      if (laserHitSet.indexOf(e) >= 0) continue;
      laserHitSet.push(e);
      if (!laserHitAt) laserHitAt = new Map();
      laserHitAt.set(e, now);
      e.hp -= dmg;
      feelHitEnemy(e, 'laser');
      spawnSparks(e.x, e.y, 3, 0.08);
      sfx('hit');
      if (e.kind === 'spiral') {
        runScore += BOSS_SCORE * 0.05 * affScore * styScore;   /* 光束打 boss：低分只為防止無限刷 */
        /* v0.29.1：同 laserTick — 一律 killEnemy → onBossDown（唔再裸 onBossDown） */
        if (e.hp <= 0) {
          if (killEnemy(e, { skipScore: true }) === 'boss') { onBossDown(e); return; }
        }
      } else {
        runScore += (e.score || GRUNT_SCORE) * 0.5 * affScore * styScore;
        /* v0.29.1：雜魚死都要經 killEnemy（boom／tier／C被動／迴氣／分裂）
           skipScore：tick 分已經加咗，避免再加滿額擊殺分 */
        if (e.hp <= 0) killEnemy(e, { skipScore: true });
      }
    }
  }
}

/* 每幀：光束持續判定（同一敵人 LASER_DMG_TICK_MS 內只計一次） */
function laserTick(ship, dtMs) {
  if (!ship || ship.shotForm !== 'laser') return;
  /* v0.33.0 #123：形態卡 DPS 帶 —— laser 嘅 DPS 由光束 tick 率（11.1/s）主導，
     完全唔受 fireRate 影響 → 必須用傷害乘數（表 FORM_DPS_MUL.laser）。 */
  const dmg = ((ship.bulletDmg || 1) + lootBulletDmg()) * 0.35 * (ship.formDmgMul || 1);
  const x = ship.x, y = ship.y - 8;
  const now = performance.now();
  for (const e of enemies) {
    if (e.kind !== 'spiral' && e.kind !== 'grunt') continue;
    if (e._dead) continue;
    const halfW = (e.kind === 'spiral') ? 12 : 8;
    if (Math.abs(e.x - x) < halfW + LASER_W && e.y < y && e.y > y - LASER_LEN) {
      const last = laserHitAt && laserHitAt.get(e);
      if (last != null && now - last < LASER_DMG_TICK_MS) continue;
      if (!laserHitAt) laserHitAt = new Map();
      laserHitAt.set(e, now);
      e.hp -= dmg;
      feelHitEnemy(e, 'laser');
      spawnSparks(e.x, e.y, 2, 0.06);
      if (e.kind === 'spiral') {
        runScore += BOSS_SCORE * 0.05 * affScore * styScore;
        /* ⚠️ v0.27.2：原本直接叫 onBossDown(e)，**唔經 killEnemy()**——
           結果 ① 冇爆炸特效 ② boss 嘅 _dead 唔會 set
           ③ 同一幀如果子彈再打中 boss（killEnemy 會回傳 'boss'），
              就會叫第二次 onBossDown → 掉兩件裝備 + 分數雙計。
           改用同子彈路徑一致嘅統一路徑：killEnemy() → onBossDown()。 */
        if (e.hp <= 0) {
          if (killEnemy(e, { skipScore: true }) === 'boss') { onBossDown(e); return; }
        }
      } else {
        runScore += (e.score || GRUNT_SCORE) * 0.5 * affScore * styScore;
        /* v0.29.1：雜魚激光擊殺統一 killEnemy（skipScore 防雙計） */
        if (e.hp <= 0) killEnemy(e, { skipScore: true });
      }
    }
  }
}

/* 光束仲喺畫面上？（供 render 查）—— 形態係 laser 就一直喺度 */
function laserActive() {
  return !!(ship && ship.shotForm === 'laser');
}
/* 切換形態 / 重開時清光束狀態 */
function resetLaserHit() {
  laserHitSet = [];
  laserHitAt = null;
}

/* v3.11 #71 splitter 死後裂 3 枚散射小彈（唔同 swarm 嘅 mini ——
   係向下散開嘅小彈，玩家可以走位避開） */
function spawnSplitterChildren(ex, ey) {
  for (let i = 0; i < SPLITTER_CHILD_N; i++) {
    const a = Math.PI / 2 + (i - (SPLITTER_CHILD_N - 1) / 2) * 0.5;
    const spd = 0.14;
    enemies.push({
      kind: 'bullet', x: ex, y: ey,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      splitterChild: true,
    });
  }
}

/* boss 擊破：抽成獨立函數，令激光光束（v3.11 #68，冇子彈實體）都可以安全觸發。
   ⚠️ 原本呢段內嵌喺碰撞迴圈，只有行子彈嘅路徑行到；光束冇子彈所以行唔到。 */
function onBossDown(e) {
  console.log('[擊破] boss @', (performance.now()/1000).toFixed(2));
  sfx('kill');
  runScore += BOSS_SCORE * affScore * styScore;
  runKills++;
  rollLoot(lastStage);            /* #44 boss 死必掉 1 件裝備（零選擇） */
  if (lastStage >= STAGES.length) {
    fsm.set(STATE.VICTORY);
  } else {
    fsm.set(STATE.CHOICE);
  }
}

/* v3.11 #74：wave 連射計數（持續壓住 → 波越闊） */
let waveShotCount = 0;
/* ---------- 機體攻擊節奏（v0.25.0 · PLAN #87）----------
   三架機嘅節奏差異全部喺呢層，唔掂操控層（白板學生唔使重新學操作），
   亦都唔掂 6 種形態卡同 4 個 tag（#92「形態無關」原則）。
     A 連射加速：連住唔停手，每 0.4 秒射速 +8%，上限 ×1.6；停手 0.4 秒回落。
     B 齊射扇形：每 3 發普通之後，第 4 發變 3 發 ±20° 扇形。
     C 重炮擊退：單發粗彈，命中會將雜魚打飛。
   ⚠️ 每個常數都必須有 game logic 讀，否則就係死代碼。 */
const RAMP_STEP_MS = 400;                 /* 每連住 0.4 秒升一級 */
const RAMP_GAIN   = 0.08;                 /* 每級 +8% 射速 */
const RAMP_MAX    = 1.6;                  /* 絕對上限（fr_s/fr_l 冇 cap，靠呢個兜住） */
const RAMP_MAX_LV = 8;                    /* 8 級 = 1.64，被 RAMP_MAX 夾返 1.6 */
const SALVO_EVERY = 4;                    /* B 機每 4 發一次齊射（即每 3 發普通之後） */
const SALVO_N     = 3;                    /* 齊射彈數 */
const SALVO_ANGLE = 20 * Math.PI / 180;   /* ±20° */
const HEAVY_SCALE = 2.4;                  /* C 機粗彈 sprite 倍數（1.4 基準 × 1.7） */
const HEAVY_KNOCK = 3.2;                  /* 擊退初速（px/frame；衰減後總位移約 27px） */

/* 遊戲時間（毫秒）—— 由主迴圈嘅固定時間步累加器行出嚟。
   暫停 / 揀卡期間 tick() 唔行，所以呢個鐘會凍結；
   對「玩家感受到幾耐」嚟講反而比真實時間更一致。 */
let gameClockMs = 0;

/* A 機連射加速：目前嘅射速倍數（1 = 未加速） */
function shipRampFactor() {
  if (!ship || ship.chassis !== 'A') return 1;
  return Math.min(RAMP_MAX, 1 + (ship._ramp || 0) * RAMP_GAIN);
}
/* 每幀更新 A 機嘅連射計數：停手超過 0.4 秒就回落
   ⚠️ 連續性用「遊戲時間」（gameClockMs，固定時間步累加器）判定，
      **唔用 wall-clock**：主迴圈用固定步累加器（見 loop()），
      掉幀時遊戲時間會慢過真實時間，但至少**唔會**因為一次長停頓
      就誤判成「玩家停手」而清走連射累積。
      實機驗證發現過：內建瀏覽器將背景分頁節流到低 FPS 時，
      wall-clock 400ms 判定會令 A 機永遠升唔到 ×1.6（招牌機制失效）。
      改用遊戲時間後，低 FPS 裝置都照計。 */
function tickShipRhythm(dtMs) {
  if (!ship || ship.chassis !== 'A') return;
  if (ship._lastFireGameMs && (gameClockMs - ship._lastFireGameMs) <= RAMP_STEP_MS) {
    ship._holdMs += dtMs;
    ship._ramp = Math.min(RAMP_MAX_LV, Math.floor(ship._holdMs / RAMP_STEP_MS));
  } else {
    ship._holdMs = 0;
    ship._ramp = 0;
  }
}
/* C 機重炮擊退：令雜魚飛走。⚠️ boss（spiral）走固定路線、唔應該被推走，
   所以只對 kind === 'grunt' 生效。方向由子彈指向敵人計（玩家向上打飛），
   唔用 Math.random()（tick 路徑禁用非 seeded RNG）。 */
function applyKnockback(e, dirX, dirY, power) {
  if (!e || e.kind !== 'grunt') return;
  const len = Math.hypot(dirX, dirY) || 1;
  e.kx = (e.kx || 0) + (dirX / len) * power;
  e.ky = (e.ky || 0) + (dirY / len) * power;
}

/* ---------- D 機衛星（v0.26.0 · PLAN #93）----------
   「蜂鳥」機身帶 2 粒衛星跟機，衛星各自自動開火。
   ⚠️ 衛星彈**固定用普通彈（bolt）**，唔跟 6 種形態卡（#93 明文取捨）。
   ⚠️ 跟隨用**限速插值**（唔係瞬移），所以衛星有「飄」嘅感覺。
   ⚠️ 召回期間（ship._satRecallUntil）衛星收埋喺機身，射速 ×2。 */
const SAT_COUNT      = 2;
const SAT_ORBIT_R    = 26;      /* 公轉半徑（水平 px） */
const SAT_ORBIT_RY   = 18;      /* 公轉半徑（垂直 px） */
const SAT_ORBIT_SPD  = 0.0011;  /* 公轉角速度（rad/ms） */
const SAT_FOLLOW_K   = 0.12;    /* 跟隨插值係數（每 60fps 幀） */
const SAT_FIRE_MS    = 1100;    /* 衛星開火間隔 */
const SAT_SPD_MUL    = 1.25;    /* 衛星彈速 = 機身彈速 × 1.25 */
const SAT_SPAN_MS    = 1100;    /* 衛星齊射：兩粒命中同一目標嘅時間窗 */
function tickSatellites(dtMs) {
  if (!ship || ship.chassis !== 'D' || !ship._sats) return;
  const now = performance.now();
  const recalling = now < (ship._satRecallUntil || 0);
  ship._satAngle = (ship._satAngle || 0) + dtMs * SAT_ORBIT_SPD;
  for (let i = 0; i < ship._sats.length; i++) {
    const s = ship._sats[i];
    /* 目標位置：召回期間收埋入艙，否則繞機身公轉 */
    const a = ship._satAngle + i * Math.PI;
    const tx = recalling ? ship.x : ship.x + Math.cos(a) * SAT_ORBIT_R;
    const ty = recalling ? ship.y : ship.y + Math.sin(a) * SAT_ORBIT_RY;
    /* 限速插值：唔會瞬移 */
    const k = Math.min(1, (dtMs / 16.67) * SAT_FOLLOW_K);
    s.x += (tx - s.x) * k;
    s.y += (ty - s.y) * k;
    s.fireCD -= dtMs;
    if (s.fireCD <= 0) {
      s.fireCD = recalling ? SAT_FIRE_MS / 2 : SAT_FIRE_MS;
      const spd = (ship.bulletSpd || 0.40) * SAT_SPD_MUL;
      pushPlayerBullet({
        owner: 'player', form: 'bolt',
        x: s.x, y: s.y,
        vx: 0, vy: -spd,
        dmg: 1, pierceLeft: 0,
        life: 0, maxLife: 0,
        _lastHit: null,
        baseX: s.x,
        t: 0,
        tags: { homing:0, split:0, slow:0, ricochet:0 },
        ricochetLeft: 0,
        _splitDone: false,
        waveLv: 0,
        spin: 0,
        /* 衛星 id：俾「衛星齊射」被動分辨係邊粒衛星打中 */
        satId: i,
      });
    }
  }
}

/* E 機「收束」生效中？（散射收成單中線） */
function isConvergeActive() {
  return !!(ship && ship.chassis === 'E' && ship._convergeUntil && performance.now() < ship._convergeUntil);
}

/* ---------- v0.26.0 #93 兩個被動（抽成獨立函數，方便行為測試）---------- */
/* D 機「衛星齊射」：兩粒衛星喺時間窗內命中同一目標 → 該目標額外 +1 傷。
   ⚠️ 時間窗用**遊戲時間**（gameClockMs），同 A 機連射加速同一個時間基準 ——
      低 FPS 裝置唔會因為掉幀而誤判「窗口已過」。
   ⚠️ satId 只有衛星彈先有；其他子彈呢欄係 undefined，直接 return。 */
function applySatelliteBonus(b, e) {
  if (!b || b.satId == null) return;
  const last = e._satLast;
  if (last && last.id !== b.satId && (gameClockMs - last.at) <= SAT_SPAN_MS) {
    e.hp -= 1;
    spawnSparks(e.x, e.y, 3, 0.08);
  }
  e._satLast = { id: b.satId, at: gameClockMs };
}
/* E 機「群傷」：同一發子彈命中 ≥2 隻敵人時，每隻額外 +1 傷。
   ⚠️ 回溯補傷害嗰隻**只喺 hp > 1 時候做** —— 唔會造成「血 ≤ 0 但冇走死亡分支」
      嘅幽靈敵人（hp 跌到 0 但仍然留喺場上，唔會計分、唔會死）。
   ⚠️ 當前目標嗰 +1 會令佢 hp 變 ≤ 0，之後嘅死亡分支會正常處理。 */
function applyGroupBonus(b, e) {
  if (!b || !b._groupHits) return;
  const already = b._groupHits.length;
  b._groupHits.push(e);
  if (already >= 1) {
    e.hp -= GROUP_BONUS;
    for (let gi = 0; gi < already; gi++) {
      const prev = b._groupHits[gi];
      if (prev && !prev._dead && prev.hp > 1) prev.hp -= GROUP_BONUS;
    }
    spawnSparks(b.x, b.y, 2, 0.06);
  }
}
/* v0.26.0 #97 護罩炮台：護盾**全向**食傷害，打穿咗先入肉。
   與 `shield_e`（只擋正面朝下弧）唔同 —— 炮台係 360° 能量盾。
   回傳 true = 呢一擊被護盾食咗（子彈唔入肉）。 */
function applyTurretShield(b, e) {
  if (!e || !e.turret || !(e.turretShield > 0)) return false;
  /* ⚠️ 用 elementHitDamage() 而唔係 b.dmg —— 光 L2「破盾」要令護盾同埋入肉
     都食 ×2 傷害（元素效果對炮台護盾一樣生效）。 */
  e.turretShield -= elementHitDamage(b, e);
  spawnSparks(b.x, b.y, 3, 0.08);
  sfx('hit');
  if (e.turretShield <= 0) {
    e.turretShield = 0;
    console.log('[擊破] 炮台護盾碎咗');
  }
  return true;
}
/* v0.26.0 #94 磁力場：範圍內敵彈嘅速度係數（1 = 唔受影響）。
   ⚠️ 用乘數而唔係改 vx/vy —— 改咗就永久改壞，磁力場結束之後彈幕會慢死。 */
function magnetSlowFactor(e) {
  if (!ship || ship.universalId !== 'magnet' || !isUniversalActive()) return 1;
  if (!e) return 1;
  const dx = e.x - ship.x, dy = e.y - ship.y;
  if (dx * dx + dy * dy > MAGNET_RADIUS * MAGNET_RADIUS) return 1;
  return MAGNET_SLOW;
}

function spawnPlayerShot() {
  if (!ship) return;
  /* v3.11 #74：連射計數，>520ms 冇開火就歸零（代表「持續壓住」） */
  if (ship._lastShotAt && performance.now() - ship._lastShotAt > 520) waveShotCount = 0;
  ship._lastShotAt = performance.now();
  /* v0.25.0 A 機：記低今次開火時間（連射加速節奏用）
     ⚠️ 用**遊戲時間**而唔係 wall-clock——見 tickShipRhythm() 嘅說明。 */
  ship._lastFireGameMs = gameClockMs;
  const form = ship.shotForm || 'bolt';
  const tags = ship.shotTags || {};
  const baseDmg = (ship.bulletDmg || 1) + lootBulletDmg();
  /* v0.33.0 #123：形態卡 DPS 帶 —— 每發傷害乘數（1 = 冇形態卡）。
     ⚠️ 喺形態分支**之後**先乘 → 導彈本身嘅 ×2.2 唔會被覆蓋。 */
  const formMul = ship.formDmgMul || 1;
  let n = Math.max(1, ship.bulletCount | 0);
  let mid = (n - 1) / 2;
  let spread = n <= 1 ? 0 : (n <= 2 ? 0.08 : 0.12);
  let spd = ship.bulletSpd || 0.30;
  const pierce = ship.pierce || 0;
  /* v0.25.0 A 機衝刺：技能生效期間彈速 ×1.8（0.9 秒） */
  if (ship._bulSpdMulUntil && performance.now() < ship._bulSpdMulUntil) {
    spd *= ship._bulSpdMul || 1;
  }
  /* v0.25.0 C 機：重炮（粗彈 + 擊退）。⚠️ 唔加新 form，
     避免同 6 種形態卡（#57–#66）撞 id；只係子彈加 heavy 標記。 */
  const heavy = ship.chassis === 'C';
  /* v0.25.0 B 機齊射：每 3 發普通之後，第 4 發變 3 發 ±20° 扇形。
     ⚠️ 計數放喺最前面，連 laser / rail 都會計（節奏唔會被形態卡打斷）。
     如果今次唔出實彈（laser / rail / 導彈已滿），齊射會「存起」，
     下次出實彈時先兌現，唔會白白消失。 */
  if (ship.chassis === 'B') {
    ship._burstCount++;
    if (ship._burstCount >= SALVO_EVERY) {
      ship._burstCount = 0;
      ship._burstReady = true;
    }
  }

  /* v3.11 #68：laser 係機身光束，**唔產生子彈實體**——
     光束畫面喺 render 畫，傷害喺 fireLaser() 即時判定。
     射速决定光束重連速度，所以高射速會連成一條實心光柱。 */
  if (form === 'laser') {
    fireLaser(ship);
    sfx('shoot');
    return;
  }

  /* rail：瞬間線，唔跟 bulletCount 扇（一條中線） */
  if (form === 'rail') {
    const x0 = ship.x, y0 = ship.y - 8;
    pushPlayerBullet({
      owner: 'player', form: 'rail', x: x0, y: y0,
      vx: 0, vy: 0, dmg: baseDmg * formMul, pierceLeft: 99,
      life: 90, maxLife: 90, isRay: true,
      _hitSet: null, tags: Object.assign({}, tags),
    });
    /* 命中交碰撞：rail 寬判定 + _railHit set 防重複 */
    sfx('shoot');
    return;
  }

  if (form === 'missile' && countPlayerBullets('missile') >= MISSILE_CAP) {
    return; /* 場上導彈滿 → 呢下唔射 */
  }

  /* v0.25.0 B 機齊射兌現：改成 3 發 ±20° 扇形。
     ⚠️ 放喺 laser / rail / 導彈上限之後，確保「存起」嘅齊射唔會被
     唔出實彈嘅形態白白食掉。 */
  if (ship.chassis === 'B' && ship._burstReady) {
    ship._burstReady = false;
    n = SALVO_N;
    mid = (n - 1) / 2;
    spread = SALVO_ANGLE;
  }

  /* v0.26.0 #93 E 機散射節奏：每一發都散成 3 發 ±14° 扇形。
     ⚠️ 唔係 B 機咁「間歇齊射」——E 係**持續散射**。
     ⚠️ n 用 max(SPREAD_N, bulletCount)，令「多彈」強化卡喺 E 機仍然有效
        （唔會變成一張對 E 冇用嘅死卡）。
     ⚠️ 「收束」技能生效期間：散射收成單中線，傷害 ×3、彈速 ×1.6。 */
  let dmgMul = 1, spdMul = 1;
  if (ship.chassis === 'E') {
    if (isConvergeActive()) {
      n = 1;
      mid = 0;
      spread = 0;
      dmgMul = CONVERGE_DMG;
      spdMul = CONVERGE_SPD;
    } else {
      n = Math.max(SPREAD_N, ship.bulletCount | 0);
      mid = (n - 1) / 2;
      spread = n <= 3 ? SPREAD_ANGLE : (n <= 5 ? 9 * Math.PI / 180 : 6 * Math.PI / 180);
    }
  }

  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i - mid) * spread;
    /* v0.26.0 #93 E 機「收束」：傷害 ×3、彈速 ×1.6。
       ⚠️ spdMul 要同時乘入 **bx/vy 同 formSpd** —— 只乘 formSpd 嘅話
          bolt 形態（預設）嘅速度唔會變，收束就變成「淨係加傷唔加速」。 */
    let dmg = baseDmg * dmgMul;
    let vx = Math.cos(a) * spd * spdMul;
    let vy = Math.sin(a) * spd * spdMul;
    let life = 0, maxLife = 0, phase = 0;
    let formSpd = spd * spdMul;

    if (form === 'laser') {
      dmg = baseDmg * 0.35;
      formSpd = formSpd * 1.35;
      vx = Math.cos(a) * formSpd;
      vy = Math.sin(a) * formSpd;
      life = maxLife = 220;
    } else if (form === 'boomerang') {
      formSpd = formSpd * 0.95;
      vx = Math.cos(a) * formSpd + (i - mid) * 0.04;
      vy = Math.sin(a) * formSpd;
      /* v0.28.0 死卡修正（射程）：原本 maxLife = 1000 → 轉向時（550ms）只飞到 y ≈ 158，
         而 boss 喺 y = 51–109（下沿 122）→ **永遠入唔到 boss 嘅 y 範圍**（實機 boss 0 傷害）。
         而家 maxLife 1800 + 轉向改成「飛到畫面頂 y < 40 先轉」→
         出程 832ms 到頂、返程 724ms 返到機身，夠往返 boss 高度。 */
      life = maxLife = 1800;
      phase = 0; /* 0 out, 1 return */
    } else if (form === 'missile') {
      dmg = baseDmg * 2.2;
      formSpd = formSpd * 0.55;
      vx = Math.cos(a) * formSpd;
      vy = Math.sin(a) * formSpd;
      /* v0.33.0 #123：導彈生命期要夠飛到 boss ——
         導彈初速跟機體 bulletSpd（A 0.44 · B 0.26 · C 0.30 · D 0.40 · E 0.28），
         鎖定期（400ms）過後巡航速 = 初速 × 1.15（鎖定期只減速一次，之後恢復），
         由機身 y=412 飛到 boss y=50–110 要 302–362px：
           A 機 1367ms · B 機 2317ms · C 機 2000ms · D 機 1502ms · E 機 2147ms
         但 `life` 原本寫死 2200ms → **B 機物理上飛唔到 boss**（要 2717ms）。
         ⚠️ 實測（12 秒 boss 窗口）：B 機導彈 12 秒得 0.44 次命中（DPS = 無卡嘅
            **0.06×**）、C 機 0.18×、E 機 0.11× → 校準要 32× 傷害乘數先夠 1.5×，
            而且加咗 32× 之後 B / C / E 仍然係 **0.000×**（根本未到，加幾多傷都冇用）。
            v0.28.0 嘅修正只做咗「巡航期恢復速度」，冇檢查生命期夠唔夠飛到。
         → 生命期按實際飛行時間計（最少 2200ms）。⚠️ **只延長生命期、唔改速度** →
            「慢但追」嘅手感不變；MISSILE_CAP = 8 唔受影響（B 機 0.5/s × 2.8s ≈ 1.4 發在場）。 */
      const cruise = formSpd * 1.15;
      const needMs = MISSILE_LOCK_MS + 400 / Math.max(0.02, cruise);
      life = maxLife = Math.max(2200, Math.ceil(needMs));
    } else if (form === 'wave') {
      vx = Math.cos(a) * formSpd;
      vy = Math.sin(a) * formSpd;
      phase = (i - mid) * 0.9; /* wave phase offset */
      /* v3.11 #74：記低幾多發連射（shotCount），振幅／頻率跟住變 */
      waveShotCount = (waveShotCount || 0) + 1;
      life = maxLife = 1800;
    } else {
      /* bolt */
      life = maxLife = 0; /* 0 = 用出界 cull */
    }

    /* v0.33.0 #123：形態卡 DPS 帶 —— 每發傷害乘數（喺形態分支之後乘，
       所以導彈嘅 ×2.2 保留，軌道炮／迴力鏢／波動彈／普通彈全部一齊被校準）。 */
    dmg *= formMul;

    pushPlayerBullet({
      owner: 'player',
      form,
      x: ship.x + (i - mid) * 4,
      y: ship.y - 8,
      vx, vy,
      dmg,
      pierceLeft: pierce,
      _lastHit: null,
      /* v0.28.0：會「命中唔死」嘅彈體由 spawn 就初始化 `_hitSet`，
         確保同一目標只被打一次（PLAN #69）—— 原本 `_hitSet` 只喺迴力鏢轉向時先建立，
         出程撞同一隻可以重複計傷害。 */
      _hitSet: (form === 'boomerang' || form === 'missile') ? [] : null,
      life, maxLife,
      phase,
      baseX: ship.x + (i - mid) * 4,
      t: 0,
      tags: Object.assign({}, tags),
      ricochetLeft: (tags.ricochet || 0) > 0 ? Math.min(2, tags.ricochet | 0) : 0,
      _splitDone: false,
      waveLv: waveShotCount,     /* v3.11 #74 */
      spin: 0,
      /* v0.25.0 C 機重炮：粗彈（渲染用 HEAVY_SCALE）+ 命中擊退 */
      heavy: heavy || undefined,
      knock: heavy ? HEAVY_KNOCK : 0,
      /* v0.26.0 #93 E 機群傷：同一發命中多隻敵人時，每隻額外 +1 傷。
         只喺 E 機開（其他機體呢欄係 null，唔會誤觸）。 */
      _groupHits: ship.chassis === 'E' ? [] : null,
    });
  }
  sfx('shoot');
}

function tickPlayerBullets(dtMs) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.owner !== 'player') continue;

    if (b.form === 'rail') {
      b.life -= dtMs;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      continue;
    }

    b.t = (b.t || 0) + dtMs;

    /* v0.27.0 #105 拖尾：玩家子彈按元素色留殘影。
       ⚠️ 每 45ms 先留一粒（唔係每幀）—— 粒子上限 260，唔可以濺到拖慢低 FPS 裝置。 */
    const elNow = currentElement();
    if (elNow) {
      b._trailT = (b._trailT || 0) - dtMs;
      if (b._trailT <= 0) {
        b._trailT = 45;
        pushParticle({ x: b.x, y: b.y, vx: 0, vy: 0, life: 230, max: 230,
                       kind: 'trail', size: 1, col: elNow.color });
      }
    }

    /* homing tag 或 missile 微追 */
    const homeLv = (b.tags && b.tags.homing) || 0;
    /* v0.28.0：迴力鏢出程（phase 0）都會追，返程（phase 1）唔追（要返機身）。
       ⚠️ 追蹤目標改用 bossOrNearest()：boss 橫向游走，雜魚永遠比 boss 近，
          慢速彈體每幀改追「最近嘅雜魚」就 100% 撞唔到 boss（實機 0 傷害）。 */
    const isTrackForm = b.form === 'missile' || (b.form === 'boomerang' && b.phase === 0);
    const wantHome = homeLv > 0 || isTrackForm;
    if (wantHome) {
      const tgt = isTrackForm ? bossOrNearest(b.x, b.y) : nearestEnemy(b.x, b.y);
      if (tgt) {
        const tx = tgt.x - b.x, ty = tgt.y - b.y;
        const len = Math.hypot(tx, ty) || 1;
        /* v3.11 #70：導彈兩階段。
           ① 鎖定期（發射後 MISSILE_LOCK_MS）慢速微追——逼玩家觀察彈道
           ② 巡航期加速 + 轉角 ×2——真正嘅追擊武器 */
        const lockAge = b.t || 0;
        let turn;
        if (b.form === 'missile') {
          const locked = lockAge < MISSILE_LOCK_MS;
          turn = locked ? 0.0018 : 0.0070;
          /* ⚠️ 鎖定期減速**只做一次**（記錄原始速度）——
             原本每幀乘 0.45，400ms = 24 幀 → 速度變 0.45^24 ≈ 0，
             導彈完全停晒，所以「有時唔識追蹤」。改為一次性降到 45%。 */
          if (locked && b._lockSpd == null) {
            b._lockSpd = Math.hypot(b.vx, b.vy);
            const s2 = b._lockSpd * 0.45;
            const cur = Math.hypot(b.vx, b.vy) || 1;
            b.vx = (b.vx / cur) * s2;
            b.vy = (b.vy / cur) * s2;
          }
          /* v0.28.0 死卡修正（巡航期加速）：v3.11 #70 寫「① 鎖定期慢速微追 ② **巡航期加速**」，
             但巡航期**加返速度**嗰半從來冇實作 —— `_lockSpd` 只降一次就永久停喺 45%
             （0.44 × 0.55 × 0.45 = 0.109 px/ms）。要飛到 boss（機身 388 → boss 80 = 308px）
             需要 308 ÷ 0.109 = **2826ms**，但導彈 `life` 只有 2200ms →
             **物理上飛唔到 boss**（實機：boss 血量 92 秒一啲都冇跌）。
             而家鎖定期一過就恢復速度（再 ×1.15 加速，符合「巡航期加速」）。 */
          if (!locked && b._lockSpd != null && !b._lockRestored) {
            b._lockRestored = true;
            const cur = Math.hypot(b.vx, b.vy) || 1;
            const s2 = b._lockSpd * 1.15;
            b.vx = (b.vx / cur) * s2;
            b.vy = (b.vy / cur) * s2;
          }
        } else if (b.form === 'boomerang') {
          /* v0.28.0：迴力鏢出程弱追蹤（轉角 0.0045，比導彈巡航期 0.0070 慢一截，
             保留「拋出去」嘅手感）—— boss 橫向游走 ±80px（133px/s），
             純直線彈道 + 800ms 飛行延遲＝幾乎打唔中。 */
          turn = 0.0045;
        } else {
          turn = 0.0022 * Math.min(3, homeLv || 1);
        }
        const sp = Math.hypot(b.vx, b.vy);
        const desiredVx = (tx / len) * sp;
        const desiredVy = (ty / len) * sp;
        const k = Math.min(1, turn * dtMs);
        b.vx += (desiredVx - b.vx) * k;
        b.vy += (desiredVy - b.vy) * k;
      }
    }

    /* wave 正弦橫擺 */
    if (b.form === 'wave') {
      /* v3.11 #74：振幅同頻率**隨射速變**——射得越快，波越寬越闊，
         令 wave 形態對 build 有反應（唔係無腦選）。 */
      const lvl = Math.max(1, b.waveLv || 1);
      const amp = 0.09 * Math.min(2.2, lvl);
      const w = 0.010 + 0.002 * Math.min(3, lvl);
      b.vx = Math.sin((b.t * w) + (b.phase || 0)) * amp;
      /* vy 保持向上主速 */
      if (b.vy > -0.05) b.vy = -(ship && ship.bulletSpd ? ship.bulletSpd : 0.28);
    }

    /* boomerang：前半出、後半返 */
    if (b.form === 'boomerang') {
      /* v0.28.0 死卡修正（射程）：原本轉向條件係「生命過半」（maxLife 1000 → 550ms），
         以 A 機 0.418 px/ms 計**最高只飞到 y ≈ 158**，而 boss 喺 y = 51–109（下沿 122）
         → **物理上入唔到 boss 嘅 y 範圍**（實機：boss 血量 86.8 秒一啲都冇跌）。
         而家改成「**飛到畫面頂 y < 40 先轉**」（生命剩 25% 兜底保證一定會返嚟）。 */
      if (b.phase === 0 && (b.y < 40 || b.life < b.maxLife * 0.25)) {
        b.phase = 1;
        /* v3.11 #69：返程**唔再重置 _lastHit**。原本 `b._lastHit = null` 令返程
           可以再打同一隻 → 同一發子彈對同一目標計兩次傷害，數值偏離直覺。
           改成用 _hitSet：返程仍然打得中**其他**敵人，但同一隻只打一次。
           ⚠️ v0.28.0：_hitSet 已經喺 spawn 初始化，所以呢行唔會再建立新嘅。 */
        b._hitSet = b._hitSet || [];
      }
      if (b.phase === 1 && ship) {
        const tx = ship.x - b.x, ty = ship.y - b.y;
        const len = Math.hypot(tx, ty) || 1;
        const sp = Math.hypot(b.vx, b.vy) || 0.28;
        b.vx = (tx / len) * sp * 1.15;
        b.vy = (ty / len) * sp * 1.15;
        if (len < 10) { bullets.splice(i, 1); continue; }
      }
      b.spin = (b.spin || 0) + dtMs * 0.02;
    }

    b.x += b.vx * dtMs;
    b.y += b.vy * dtMs;

    /* ricochet 左右牆 */
    if (b.ricochetLeft > 0) {
      if (b.x < 4) { b.x = 4; b.vx = Math.abs(b.vx); b.ricochetLeft--; }
      else if (b.x > VIEW_W - 4) { b.x = VIEW_W - 4; b.vx = -Math.abs(b.vx); b.ricochetLeft--; }
    }

    if (b.maxLife > 0) {
      b.life -= dtMs;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
    }
  }
}

function spawnSplitBolts(src) {
  if (!src || src._splitDone) return;
  if (!(src.tags && src.tags.split > 0)) return;
  src._splitDone = true;
  const dmg = Math.max(1, (src.dmg || 1) * 0.55);
  for (const side of [-1, 1]) {
    pushPlayerBullet({
      owner: 'player', form: 'bolt',
      x: src.x, y: src.y,
      vx: side * 0.12, vy: -0.28,
      dmg, pierceLeft: 0, _lastHit: null,
      life: 700, maxLife: 700, phase: 0, t: 0,
      tags: {}, ricochetLeft: 0, _splitDone: true, /* 唔再裂 */
    });
  }
}

/* v3.11 #70：導彈命中爆散。扇形平均分佈，同 tag_split 嘅左右兩枚唔同 ——
   導彈係高傷單體，爆散應該擴散覆蓋多個目標。 */
function spawnMissileBurst(src) {
  if (!src) return;
  const existing = bullets.filter(b => b.form === 'missBurst').length;
  if (existing >= MISSILE_BURST_CAP) return;   /* cap：唔好爆版 */
  const dmg = Math.max(1, (src.dmg || 1) * MISSILE_BURST_DMG);
  const spd = 0.26;
  for (let i = 0; i < MISSILE_BURST_N; i++) {
    const a = -Math.PI / 2 + (i - (MISSILE_BURST_N - 1) / 2) * 0.42;
    pushPlayerBullet({
      owner: 'player', form: 'missBurst',
      x: src.x, y: src.y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      dmg, pierceLeft: 0, _lastHit: null,
      /* v0.28.0：爆散**唔打 boss** —— 爆散係「對群體有實質價值」嘅效果（#70），
         但佢哋喺命中點（即 boss 身上）爆開 → 下一幀即刻再打中 boss，
         `Math.max(1, dmg×0.4)` 又令每粒最少 1 傷 → 每發導彈實際 2.2 + 3 = **5.2 傷**
         （實測 DPS 8.84 HP/s，比其他形態卡強 5 倍）。
         同「連鎖閃電唔打 boss」一致：爆炸碎屑唔打 boss，boss 只食導彈本身嘅傷害。 */
      noBoss: true,
      life: 620, maxLife: 620, phase: 0, t: 0,
      tags: {}, ricochetLeft: 0, _splitDone: true, /* 唔再裂 */
    });
  }
}

/* 命中後 tag 效果；回傳是否應刪彈（true=刪） */
/* ---------- 元素效果（v0.27.0 · PLAN #100 / #104）----------
   元素層決定「命中之後發生咩事」，形態層決定「彈點樣飛」—— 兩層完全正交，
   所以 5 形態 × 5 元素 = 25 種配對 **唔使任何配對特判**。
   ⚠️ 副元素同基底元素走同一條 applyOneElement()，純粹疊加效果。 */
const ELEM_BURN_MS        = 2000;   /* 灼燒持續 */
const ELEM_BURN_DPS       = 1;      /* 灼燒每秒傷害 */
const ELEM_BURN_DPS_L2    = 1.5;    /* L2 灼燒傷害 */
const ELEM_BURN_SPREAD_R  = 60;     /* L2 蔓延半徑 */
const ELEM_BURN_BOOM_R    = 55;     /* L3 燒死爆炸半徑 */
const ELEM_BURN_BOOM_DMG  = 3;      /* L3 燒死爆炸傷害 */
const ELEM_SLOW_MS        = 2000;   /* 緩速持續 */
const ELEM_SLOW_MUL       = 0.6;    /* L1 緩速倍數 */
const ELEM_SLOW_MUL_L2    = 0.4;    /* L2 緩速倍數 */
const ELEM_SHATTER_MUL    = 1.25;   /* L2 易碎：受傷 +25% */
const ELEM_FREEZE_MS      = 1000;   /* L3 凍結 */
const ELEM_CHAIN_DMG      = 0.6;    /* 連鎖傷害比例 */
const ELEM_CHAIN_R        = 90;     /* 連鎖搜尋半徑 */
const ELEM_STUN_MS        = 1500;   /* L3 麻痺 */
const ELEM_LIGHT_BURST    = 1;      /* L3 光爆對全場雜魚嘅傷害 */
const ELEM_MARK_MS        = 6000;   /* 吞噬標記持續 */
const ELEM_MARK_MUL       = 1.25;   /* L2 吞噬加深 */
const ELEM_DARK_BOOM_R    = 70;     /* L3 吞噬爆發半徑 */
const ELEM_DARK_BOOM_DMG  = 3;      /* L3 吞噬爆發傷害 */
const ELEM_MASTER_MUL     = 1.4;    /* 專精：基底元素傷害 +40% */

/* 專精倍率：基底元素滿 L3 之后再升級 → 該元素所有傷害 ×1.4。
   ⚠️ 專精只可以落喺「基底元素」（副元素冇專精呢條路），
      所以呢度只睇 elementA，唔睇 elementB。
   ⚠️ 每個元素傷害出口都要經過呢度 —— 否則卡面寫住「+40%」但實際冇加 = 死卡。 */
function elementMasterMul(elemId) {
  if (!ship || !ship.elementMaster) return 1;
  if (ship.elementA !== elemId) return 1;
  return ELEM_MASTER_MUL;
}

/* 元素爆發深度守衛 —— 連鎖 / 爆發互相觸發時唔可以無限遞歸 */
let elementBurstDepth = 0;

/* 呢個局有冇某元素達到某等級？（基底 A 同副 B 兩邊都計） */
function hasElementLevel(id, lv) {
  if (!ship) return false;
  if (ship.elementA === id && (ship.elementALv || 0) >= lv) return true;
  if (ship.elementB === id && (ship.elementBLv || 0) >= lv) return true;
  return false;
}
/* 元素傷害倍率：光 L2 破盾 · 暗 L2 吞噬加深 · 冰 L2 易碎 */
function elementHitDamage(b, e) {
  let dmg = (b && b.dmg) || 1;
  if (!e) return dmg;
  if (e.turret && e.turretShield > 0 && hasElementLevel('light', 2)) dmg *= 2 * elementMasterMul('light');
  if (e.markT > 0 && hasElementLevel('dark', 2)) dmg *= ELEM_MARK_MUL * elementMasterMul('dark');
  if (e.shatter && hasElementLevel('ice', 2)) dmg *= ELEM_SHATTER_MUL * elementMasterMul('ice');
  return dmg;
}
/* 連鎖：電弧彈到附近另一個敵人（只打雜魚，唔會打 boss） */
function chainLightning(from, depth, dmg) {
  if (depth <= 0) return;
  let best = null, bestD = 1e12;
  for (const o of enemies) {
    if (o === from || o._dead) continue;
    if (o.kind !== 'grunt') continue;          /* ⚠️ 元素傷害唔打 boss */
    const dx = o.x - from.x, dy = o.y - from.y;
    const d = dx * dx + dy * dy;
    if (d > ELEM_CHAIN_R * ELEM_CHAIN_R) continue;
    if (d < bestD) { bestD = d; best = o; }
  }
  if (!best) return;
  best.hp -= dmg;
  spawnArc(best.x, best.y);
  screenFlash = Math.max(screenFlash, 0.16);
  triggerScreenFx('bolt', 200, 700);   /* v0.27.0 電弧全屏閃（節流） */
  if (best.hp <= 0) killEnemy(best);
  chainLightning(best, depth - 1, dmg);
}
/* 光爆：命中時全場雜魚受到少量傷害（唔套用元素效果，唔會無限遞歸） */
function lightBurst() {
  triggerScreenFx('light', 320, 400);   /* v0.27.0 光爆全屏白閃 */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const o = enemies[i];
    if (o._dead || o.kind !== 'grunt') continue;
    o.hp -= ELEM_LIGHT_BURST * elementMasterMul('light');
    spawnGlow(o.x, o.y);
    if (o.hp <= 0) killEnemy(o);
  }
}
/* 元素爆發（燒死 / 吞噬標記死）—— 範圍傷害，唔套用元素效果 */
function elementBoom(x, y, radius, dmg, kind) {
  if (elementBurstDepth > 3) return;
  elementBurstDepth++;
  spawnBoom(x, y);
  screenFlash = Math.max(screenFlash, 0.28);
  triggerScreenFx(kind === 'dark' ? 'dark' : 'fire', 360, 400);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const o = enemies[i];
    if (o._dead || o.kind !== 'grunt') continue;
    const dx = o.x - x, dy = o.y - y;
    if (dx * dx + dy * dy > radius * radius) continue;
    o.hp -= dmg;
    if (kind === 'fire') spawnEmber(o.x, o.y);
    else if (kind === 'dark') spawnShade(o.x, o.y);
    if (o.hp <= 0) killEnemy(o);
  }
  elementBurstDepth--;
}
/* 單一元素效果（lv = 1..3）。基底同副都叫呢個，所以 25 種配對零特判。 */
function applyOneElement(elemId, lv, target, bullet) {
  if (!target || !elemId || lv < 1) return;
  const b = bullet || { x: target.x, y: target.y, dmg: 1, pierceLeft: 0 };
  switch (elemId) {
    case 'fire': {
      target.burnT = Math.max(target.burnT || 0, ELEM_BURN_MS);
      target.burnDmg = Math.max(target.burnDmg || 0,
        (lv >= 2 ? ELEM_BURN_DPS_L2 : ELEM_BURN_DPS) * elementMasterMul('fire'));
      if (lv >= 2) {                       /* 蔓延到相鄰敵人 */
        for (const o of enemies) {
          if (o === target || o._dead || o.kind !== 'grunt') continue;
          const dx = o.x - target.x, dy = o.y - target.y;
          if (dx * dx + dy * dy > ELEM_BURN_SPREAD_R * ELEM_BURN_SPREAD_R) continue;
          o.burnT = Math.max(o.burnT || 0, ELEM_BURN_MS);
          o.burnDmg = Math.max(o.burnDmg || 0, ELEM_BURN_DPS * elementMasterMul('fire'));
          spawnEmber(o.x, o.y);
        }
      }
      if (lv >= 3) target.burnBoom = true;  /* 燒死時爆炸 */
      spawnEmber(target.x, target.y);
      break;
    }
    case 'ice': {
      target.slowT = Math.max(target.slowT || 0, ELEM_SLOW_MS);
      target.slowMul = Math.min(target.slowMul == null ? 1 : target.slowMul,
                                lv >= 2 ? ELEM_SLOW_MUL_L2 : ELEM_SLOW_MUL);
      if (lv >= 2) target.shatter = true;   /* 易碎：受傷 +25% */
      if (lv >= 3) {
        target.freezeT = Math.max(target.freezeT || 0, ELEM_FREEZE_MS);
        triggerScreenFx('ice', 260, 500);   /* v0.27.0 結冰畫面覆蓋 */
      }
      spawnFrost(target.x, target.y);
      break;
    }
    case 'lightning': {
      if (lv >= 1) chainLightning(target, lv, (b.dmg || 1) * ELEM_CHAIN_DMG * elementMasterMul('lightning'));
      if (lv >= 3) target.stunT = Math.max(target.stunT || 0, ELEM_STUN_MS);
      spawnArc(target.x, target.y);
      break;
    }
    case 'light': {
      if (lv >= 1) b.pierceLeft = (b.pierceLeft || 0) + 1;   /* 穿透 +1 */
      if (lv >= 3) lightBurst();
      spawnGlow(target.x, target.y);
      break;
    }
    case 'dark': {
      target.markT = Math.max(target.markT || 0, ELEM_MARK_MS);
      if (lv >= 3) target.darkBoom = true;
      spawnShade(target.x, target.y);
      break;
    }
  }
}
/* 統一入口：基底元素 A 先行，之後副元素 B（兩個效果疊加生效） */
function applyElementEffects(target, bullet) {
  if (!ship || !target) return;
  if (ship.elementA) applyOneElement(ship.elementA, ship.elementALv || 1, target, bullet);
  if (ship.elementB) applyOneElement(ship.elementB, ship.elementBLv || 1, target, bullet);
}
/* 每幀：灼燒 DoT + 凍結 / 麻痺 / 標記倒數 */
function elementTick(dtMs) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e._dead) continue;
    if (e.freezeT > 0) e.freezeT -= dtMs;
    if (e.stunT > 0) e.stunT -= dtMs;
    if (e.markT > 0) e.markT -= dtMs;
    if (e.burnT > 0) {
      e.burnT -= dtMs;
      e._burnAcc = (e._burnAcc || 0) + dtMs;
      while (e._burnAcc >= 1000) {
        e._burnAcc -= 1000;
        /* ⚠️ 灼燒唔打 boss —— 避免 boss HP 變負但永遠唔死嘅卡死情況 */
        if (e.kind === 'grunt') {
          e.hp -= (e.burnDmg || ELEM_BURN_DPS);
          spawnEmber(e.x, e.y);
          if (e.hp <= 0) { killEnemy(e); break; }
        }
      }
    }
  }
}

/* 敵人死亡處理（v0.27.0 抽出嚟俾元素效果重用 —— 灼燒 / 連鎖 / 爆發都經過呢度）。
   回傳 'boss' = 死咗 boss（caller 要即刻叫 onBossDown 並停低）；'grunt' = 雜魚。 */
function killEnemy(e, opts) {
  if (!e || e._dead || e.hp > 0) return null;
  const skipScore = !!(opts && opts.skipScore);
  /* v0.29.0：kill tier —— elite / boss 更大 boom + trauma + hit-stop；grunt 細 */
  const isBoss = e.kind === 'spiral';
  const tier = isBoss ? FEEL.killBoss : (e.elite ? FEEL.killElite : FEEL.killGrunt);
  spawnBoom(e.x, e.y, tier.boom || 1);
  if (tier.flash) screenFlash = Math.max(screenFlash, tier.flash);
  addTrauma(tier.trauma);
  hitStop(tier.stop);
  /* ⚠️ v0.27.2：boss 都要 set _dead。
     原本 boss 喺 `return 'boss'` 之前就 return 咗，所以 e._dead 永遠唔會 set
     —— 死咗嘅 boss 仲留喺 enemies 入面當「仲生存」：
     ① 同一幀如果第二個傷害源（激光 + 子彈）再打中，就會叫第二次 onBossDown
        → 掉兩件裝備 + 分數雙計（激光路徑原本完全冇經 killEnemy，最易撞）。
     ② 渲染同 tick 都會繼續當佢存在。
     set 咗之後，tick 尾段嘅 cull 迴圈會統一 splice 走。 */
  e._dead = true;
  if (isBoss) return 'boss';   /* boss 死亡流程特別，caller 處理 */
  if (!skipScore) {
    runScore += (e.score || GRUNT_SCORE) * affScore * styScore;
  }
  runKills++;
  runGrunts++;
  /* v0.25.0 C 機被動：每次擊殺回充 5% 炸彈冷卻 */
  if (ship && ship.chassis === 'C' && bombCDUntil > 0) {
    bombCDUntil = Math.max(0, bombCDUntil - (ship.bombCD || 12000) * 0.05);
  }
  /* v0.26.0 #94 通用技能「迴氣」：擊殺敵人後 3 秒內射速 ×1.8 */
  if (ship && ship.universalId === 'recover') {
    ship._recoverUntil = gameClockMs + RECOVER_MS;
  }
  sfx(e.elite ? 'kill' : 'hit');
  /* v0.27.0 元素爆發：燒死 / 吞噬標記死時爆發（專精元素傷害 +40%） */
  if (e.burnBoom) elementBoom(e.x, e.y, ELEM_BURN_BOOM_R, ELEM_BURN_BOOM_DMG * elementMasterMul('fire'), 'fire');
  if (e.markT > 0 && e.darkBoom) elementBoom(e.x, e.y, ELEM_DARK_BOOM_R, ELEM_DARK_BOOM_DMG * elementMasterMul('dark'), 'dark');
  /* 分裂蟲 → mini；護盾機死 → 裂彈；v3.11 裂解者 → 散射小彈 */
  if (e.swarm || e.splitOnDeath) spawnSwarmChildren(e.x, e.y);
  if (e.splitter) spawnSplitterChildren(e.x, e.y);
  if (e.shield) spawnSplitBurst(e.x, e.y);
  if (e.elite) console.log('[擊破] 精英「' + e.affix + '」· +' + (e.score || ELITE_SCORE));
  else if (e.sniper) console.log('[擊破] 狙擊 · +' + (e.score || SNIPER_SCORE));
  else if (e.shield) console.log('[擊破] 護盾機 · +' + (e.score || SHIELD_SCORE));
  else if (e.swarm) console.log('[擊破] 分裂 · +' + (e.score || SWARM_SCORE));
  return 'grunt';
}

/** 呢種子彈**命中之後唔會消失**？
 *  ⚠️ v0.28.0 死卡修正 —— 呢個係「畫面同行為一致」嘅保證：
 *     `rail`（光束）畫成由機身射到畫面頂、`boomerang`（迴力鏢）畫成會返嚟、
 *     `missile`（導彈）畫成會追 —— 但三者的 `onPlayerBulletHit()` 原本都行
 *     `b.pierceLeft > 0` 分支（`ship.pierce` 預設 0）→ **命中即刪彈**，
 *     結果：光束同導彈嘅「持續／追擊」根本唔存在、迴力鏢永远返唔到嚟。
 *     實機後果：form_boom / form_miss 兩張卡 **boss 血量 0 跌幅**（揀咗就卡死關卡）。
 *  ⚠️ 命中唔死唔代表可以無限打同一隻 —— `_hitSet` 由 spawn 就初始化，確保同一目標只打一次（PLAN #69）。 */
function bulletSurvivesHit(b) {
  return !!b && (b.form === 'rail' || b.form === 'boomerang' || b.form === 'missile');
}

/* 玩家子彈 vs 敵人：命中判定（抽出嚟方便做行為測試）。
   ⚠️ v0.28.0 **死卡修正**：form_rail（軌道炮）嘅光束喺畫面上係由機身一直畫到畫面頂
   （render: moveTo(b.x, b.y) → lineTo(b.x, 8)），但原本命中判定用 `|b.y - e.y| < hh`，
   而 **rail 子彈唔會郁**（tickPlayerBullets 對 rail 淨係 `life -= dtMs`，b.y 永遠停喺機身）
   → 光束實際上只打中貼住機身嗰十幾像素嘅敵人 = **死卡**（畫面見到打上頂，實際打唔到）。
   實機後果：揀咗 form_rail 之後幾乎打唔到嘢 → boss 永遠唔死 → **死鎖**（STAGE_3 卡死 200+ 秒）。
   修正：rail 嘅判定改成**一整條直欄**（同一條柱 + 喺機身以上），
   同畫面見到嘅光束一致。
   ⚠️ laser 唔喺呢度判（laserTick 自己處理，佢嘅直欄 + 長度判定本來就正確）。 */
function playerBulletHits(b, e, halfW) {
  if (b.form === 'rail') {
    if (Math.abs(b.x - e.x) >= 11) return false;   /* 柱闊（同原本 hw 一致） */
    return e.y < b.y + 4;                            /* 機身（含）以上成條柱都中 */
  }
  const hw = (b.form === 'laser') ? halfW + 2 : halfW;
  const hh = (b.form === 'laser') ? halfW + 4 : halfW;
  return Math.abs(b.x - e.x) < hw && Math.abs(b.y - e.y) < hh;
}

function onPlayerBulletHit(b, e) {
  /* v0.27.0 #104：元素效果統一喺「命中」事件觸發（喺任何 return 之前） */
  applyElementEffects(e, b);
  if (b.tags && b.tags.slow > 0) {
    const ms = 600 + Math.max(0, (b.tags.slow - 1) * 300);
    e.slowT = Math.max(e.slowT || 0, ms);
    e.slowMul = 0.6;
  }
  spawnSplitBolts(b);
  /* v3.11 #70：導彈命中爆散成小彈，令導彈對群體有實質價值。 */
  if (b.form === 'missile' && b._burstDone !== true) {
    b._burstDone = true;
    spawnMissileBurst(b);
  }
  b._lastHit = e;
  if (b.form === 'rail') {
    if (!b._railHit) b._railHit = [];
    b._railHit.push(e);
    return false; /* ray 視覺自己消失，可打多隻 */
  }
  /* v0.28.0：迴力鏢 / 導彈命中都唔死（bulletSurvivesHit）。
     ⚠️ 同一目標只打一次由 `_hitSet` 負責（spawn 時已初始化，#69）。 */
  if (bulletSurvivesHit(b)) return false;
  if (b.pierceLeft > 0) {
    b.pierceLeft--;
    return false;
  }
  return true; /* 刪彈 */
}

/* 對機體造成傷害：護盾 → 生命 → 保險 → 復活 → 死亡。
   v3.11 #71 抽出成獨立函數，令新敵人（rammer 撞擊 / lancer 光束）
   同原本嘅子彈／雜魚碰撞共用同一條死亡邏輯 —— 唔會兩邊走唔同分支。
   回傳 true = 已死亡（呼叫者要即刻停低）。 */
function damageShip(n) {
  if (!ship) return false;
  /* v0.29.0：盾擋 vs 真扣血 分兩檔 juice */
  const willHitHp = !(ship.shield > 0);
  const hf = willHitHp ? FEEL.hurt : FEEL.hurtShield;
  addTrauma(hf.trauma);
  hitStop(hf.stop);
  pulseShip(hf.pop);
  screenFlash = Math.max(screenFlash, hf.flash);
  sfx('hurt');
  if (ship.shield > 0) {
    /* v0.25.0 B 機「護盾」技能：生效期間護盾唔會被打穿（擋到但唔減盾值） */
    if (!ship._bulwarkUntil || performance.now() >= ship._bulwarkUntil) {
      ship.shield -= 1;
    }
    return false;
  }
  ship.hp -= (n || 1);
  /* v0.26.0 #94 通用技能「過載護盾」：真係扣到血嗰刻清走所有敵彈 + 立即 +3 盾。
     ⚠️ 用 `_dead` 旗標而唔係 splice —— 呢段係喺「敵方彈幕 vs 戰機」碰撞迴圈
        內部執行，直接 splice 會令外層迴圈索引錯位（漏檢一粒子彈）。
        `_dead` 會喺 tick 尾段嘅清除迴圈統一清走。
     ⚠️ 窗口用完就收（universalActiveUntil = 0），冷卻照計。 */
  if (isOverloadArmed()) {
    universalActiveUntil = 0;
    for (const en of enemies) {
      if (en.kind === 'bullet' || en.kind === 'laser') en._dead = true;
    }
    ship.shield += 3;
    spawnBoom(ship.x, ship.y);
    screenFlash = Math.max(screenFlash, 0.6);
    console.log('[通用技能] 過載護盾 · 清走敵彈 + 3 盾');
  }
  /* v0.25.0 B 機被動：真係扣到血（唔係用盾擋）之後 1.2 秒無敵 */
  if (ship.chassis === 'B') {
    iFrameUntil = Math.max(iFrameUntil, performance.now() + 1200);
  }
  if (ship.hp > 0) return false;
  /* #44「保險」：致命傷免疫 1 次。優先過 life_st 復活——
     兩者都係「唔好死」，但保險係裝備、復活係強化，唔應該互相吞噬。 */
  if (hasArmor() && !armorUsed) {
    armorUsed = true;
    ship.hp = 1;
    iFrameUntil = performance.now() + 2500;
    spawnBoom(ship.x, ship.y);
    screenFlash = Math.max(screenFlash, 0.6);
    sfx('focus');
    console.log('[保險] 抵銷一次致命傷 · 之後失效');
    return false;
  }
  /* life_st 復活：消耗一次機會、補滿血、送 2.5 秒無敵 */
  if (ship.resurrect > 0) {
    ship.resurrect -= 1;
    ship.hp = ship.maxHp;
    iFrameUntil = performance.now() + 2500;
    spawnBoom(ship.x, ship.y);
    screenFlash = Math.max(screenFlash, 0.6);
    console.log('[復活] 消耗 1 次 · 剩餘', ship.resurrect);
    return false;
  }
  console.log('[戰機] 被擊毀');
  const df = FEEL.die;
  spawnBoom(ship.x, ship.y, df.boom);
  screenFlash = Math.max(screenFlash, df.flash);
  addTrauma(df.trauma);
  hitStop(df.stop);
  sfx('die');
  fsm.set(STATE.GAMEOVER);
  return true;
}

function tick(dtMs) {
  /* 非遊戲狀態下凍結 */
  if (!isStage(fsm.cur)) return;
  /* v0.25.0：遊戲時間鐘（A 機連射加速用遊戲時間判定連續性） */
  gameClockMs += dtMs;

  /* ---- 波次排程：到達關卡時間目標就產生波次 ---- */
  if (stageStartMs) {
    const stageMs = performance.now() - stageStartMs;
    while (waveCursor < waveQueue.length && waveQueue[waveCursor].at <= stageMs) {
      const w = waveQueue[waveCursor];
      for (const s of w.spawn) emitWaveType(s, lastStage, w.chunk);
      waveCursor++;
    }
  }

  /* ---- P1-5：波次清完之後先召喚 boss ----
     條件：波次佇列出齊 + 場上冇雜魚。
     保險：如果雜魚一直清唔走（例如玩家唔理佢，任由佢飛出畫面），
     8 秒後強制召喚，避免卡住成關。 */
  /* ---- #42 中斷事件：S3 波次過半觸發一次（#47 排程）----
     中途暫停 → 揀完之後用 resumeEvent() 繞過 fsm.set() 返回同一關，
     否則 onStateEnter 會重置場上實體（清子彈／敵機），玩家會死無辜。 */
  if (!eventFired && lastStage === EVENT_STAGE && stageStartMs
      && waveCursor >= Math.ceil(waveQueue.length / 2)) {
    eventFired = true;
    enterEvent();
    return;                    /* 即刻停低呢一帧，唔好繼續行碰撞 */
  }

  if (!bossSpawned && stageStartMs) {
    if (waveCursor >= waveQueue.length) {
      if (waveQueueDoneAt === null) waveQueueDoneAt = performance.now();
      const noGrunts = !enemies.some(e => e.kind === 'grunt' && !e._dead);
      if (noGrunts || performance.now() - waveQueueDoneAt > 8000) {
        /* #46 單次逆轉：S5 boss 出場前攔截一次，一局只有一次。
           喺 spawnBossFor 之前 return，等玩家揀完先出 boss。 */
        if (!reverseUsed && lastStage === REVERSE_STAGE) {
          enterReverse();
          return;
        }
        spawnBossFor(lastStage);
        bossSpawned = true;
        waveQueueDoneAt = null;
      }
    }
  }

  /* ---- 戰機移動（鍵盤優先，否則收斂到拖曳目標） ----
     v0.25.0：移動速度受 C 機「過熱」技能影響（×0.6），
     同時記低最後一次移動方向（A 機衝刺技能靠佢決定突進方向）。 */
  let vx = 0, vy = 0;
  if (InputState.keys.left)  vx -= 1;
  if (InputState.keys.right) vx += 1;
  if (InputState.keys.up)    vy -= 1;
  if (InputState.keys.down)  vy += 1;
  const moveMul = isOverheatActive() ? 0.6 : 1;
  if (vx || vy) {
    InputState.device = 'key';
    const len = Math.hypot(vx, vy);
    const step = ship.speed * moveMul * (dtMs / 16.67);  /* ship.speed is per-frame @60fps */
    ship.x = clamp(ship.x + (vx/len) * step, 8, VIEW_W - 8);
    ship.y = clamp(ship.y + (vy/len) * step, 8, PLAY_BOTTOM);
    ship._lastDx = vx / len;
    ship._lastDy = vy / len;
    InputState.targetX = ship.x;
    InputState.targetY = ship.y;
  } else {
    /* P0-4：拖曳朝 target 行，但每幀最多行 ship.speed * DRAG_SPEED_MULT。
       唔再瞬移，所以 spd_s / spd_l 喺觸控平台真係有用。 */
    const step = ship.speed * moveMul * DRAG_SPEED_MULT * (dtMs / 16.67);
    const dx = InputState.targetX - ship.x;
    const dy = InputState.targetY - ship.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.01) {
      const k = Math.min(1, step / d);
      ship.x += dx * k;
      ship.y += dy * k;
      ship._lastDx = dx / d;
      ship._lastDy = dy / d;
    }
    ship.x = clamp(ship.x, 8, VIEW_W - 8);
    ship.y = clamp(ship.y, 8, PLAY_BOTTOM);
  }


  /* ---- 自動開火（PC／觸控都唔使撳射；只需移動） · v3.10 form+tag ----
     v0.25.0 #87：A 機「連射加速」—— 實際射速 = 基礎射速 × 連射倍數（上限 ×1.6）。
     連射倍數喺 tickShipRhythm() 更新：連住唔停手就愈嚟愈快，停手 0.4 秒就回落。 */
  tickShipRhythm(dtMs);
  /* v0.26.0 #93 D 機衛星：跟機 + 自動開火 */
  tickSatellites(dtMs);
  ship.fireCD -= dtMs;
  if (ship.fireCD <= 0) {
    spawnPlayerShot();
    const ramp = shipRampFactor();
    const oh = isOverheatActive() ? 2 : 1;   /* C 機過熱：射速 ×2 */
    /* v0.26.0 #94 通用技能「迴氣」：擊殺後 3 秒射速 ×1.8 */
    const rec = isRecoverActive() ? RECOVER_RATE : 1;
    ship.fireCD = 1000 / Math.max(0.5, (ship.fireRate || 1) * ramp * oh * rec);
  }

  /* v3.11 #68：laser 係**持續**光束，每幀判定（唔靠開火維持）。
     形態唔係 laser 就唔行（開支為零）。 */
  laserTick(ship, dtMs);

  /* ---- 玩家子彈移動／形態路徑 ---- */
  tickPlayerBullets(dtMs);

  /* ---- 專屬技能同炸彈由按鍵觸發並檢查冷卻；
       清彈喺觸發當下處理，無敵時段喺碰撞時判斷。 ---- */

  /* ---- 敵機更新（boss 招式各自不同） ---- */
  /* v0.27.0 #104：元素狀態（灼燒 DoT / 凍結 / 麻痺 / 標記）先行更新，
     咁新加嘅灼燒傷害即刻生效，唔會慢一幀。 */
  elementTick(dtMs);
  for (const e of enemies) {
    if (e._dead) continue;        /* 屍體唔再郁，正式移除交由 cull */
    /* v3.10 tag_slow：敵短暫減速 */
    if (e.slowT && e.slowT > 0) {
      e.slowT -= dtMs;
      e._slowMul = e.slowMul || 0.6;
      if (e.slowT <= 0) { e.slowT = 0; e._slowMul = 1; }
    } else {
      e._slowMul = 1;
    }
    /* v0.27.0 #100 冰 L3「結冰」：目標完全停住 1 秒（移動係 0，唔係唔郁）。
       ⚠️ 用 _moveMul 乘數而唔係直接 return —— boss 路徑同雜魚路徑都會經過呢度。 */
    e._moveMul = (e.freezeT > 0) ? 0 : 1;
    if (e.kind === 'spiral') {
      /* v0.27.0：凍結時時間軸唔向前行 → boss 停喺原位 */
      e.t += dtMs * e._moveMul;
      /* 8 字形路徑（預設） */
      e.x = VIEW_W/2 + Math.cos(e.t / 600) * 80;
      e.y = 80       + Math.sin(e.t / 400) * 30;
      e.ang0 = e.t / 1000;

      /* 各招式的射速、彈數、彈速（再乘難度） */
      const P = e.pattern || 'A';
      const d = D();
      let nWay = 8, fireEvery = 1000, bulletSpd = 0.06;
      if (P === 'A') {                       /* stage 1: classic 8-way */
        nWay = 8; fireEvery = 1000; bulletSpd = 0.06;
      } else if (P === 'B') {                /* stage 2: 12-way wider */
        nWay = 12; fireEvery = 900; bulletSpd = 0.05;
      } else if (P === 'C') {                /* stage 3: 8-way + slow rotation */
        nWay = 8; fireEvery = 750; bulletSpd = 0.07;
      } else if (P === 'D') {                /* stage 4: 16-way slow */
        nWay = 16; fireEvery = 1300; bulletSpd = 0.04;
      } else if (P === 'E') {                /* stage 5: 12-way faster */
        nWay = 12; fireEvery = 700; bulletSpd = 0.07;
      }
      /* #41 精英關：boss 射速 ×0.75（回報嗰半；代價係敵人血 ×1.35） */
      fireEvery *= d.fireIntervalMul * styBossFire;
      bulletSpd *= affBulletSpd;

      /* v0.27.0 雷 L3「麻痺」：被麻痺嘅目標 1.5 秒內唔射擊 */
      if (e.stunT > 0) e.spiralCD = 0;
      else e.spiralCD = (e.spiralCD || 0) + dtMs;
      if (e.spiralCD >= fireEvery) {
        e.spiralCD -= fireEvery;
        for (let i = 0; i < nWay; i++) {
          const a = e.ang0 + i * (Math.PI * 2 / nWay);
          enemies.push({ kind:'bullet', x: e.x, y: e.y, vx: Math.cos(a)*bulletSpd, vy: Math.sin(a)*bulletSpd });
        }
      }

      /* E 招式：每 4.5 秒追加一次慢雷射（待決問題 #2 部分實作） */
      if (P === 'E' || P === 'D') {
        e.laserCD = (e.laserCD || 0) - dtMs;
        if (e.laserCD <= 0) {
          /* 雷射預警 600 毫秒，之後先發射 */
          e.laserWarn = (e.laserWarn === undefined) ? 600 : e.laserWarn - dtMs;
          if (e.laserWarn <= 0 && !e.laserFiring) {
            /* 發射：1 發瞄準戰機嘅高速彈 */
            const sx = ship ? ship.x : VIEW_W/2;
            const a = Math.atan2(ship ? ship.y - e.y : VIEW_H/2, sx - e.x);
            const lspd = 0.20 * bulletSpeedMul();
            enemies.push({ kind:'laser', x: e.x, y: e.y, vx: Math.cos(a)*lspd, vy: Math.sin(a)*lspd, lifeMs: 1500 });
            e.laserFiring = true;
            setTimeout(() => { e.laserFiring = false; }, 100);
            e.laserCD = 4500 * d.fireIntervalMul;
            e.laserWarn = undefined;
          }
        }
      }
    } else if (e.kind === 'laser') {
      /* 聚焦令敵方彈幕減速（PLAN v2 #6；係數由戰機決定） */
      const slow = skillTimeScaleNow();
      e.x += e.vx * dtMs * (e._slowMul == null ? 1 : e._slowMul) * slow * e._moveMul;
      e.y += e.vy * dtMs * (e._slowMul == null ? 1 : e._slowMul) * slow * e._moveMul;
      e.lifeMs -= dtMs;
      if (e.lifeMs <= 0) {
        e._dead = true;
      }
    } else if (e.kind === 'bullet') {
      /* 預警彈：pending 時定住，warn 完先飛 */
      if (e.pending) {
        e.warnMs = (e.warnMs || 0) - dtMs;
        if (e.warnMs <= 0) {
          e.pending = false;
          const a = e.fireA != null ? e.fireA : Math.PI / 2;
          const spd = e.fireSpd != null ? e.fireSpd : 0.1;
          e.vx = Math.cos(a) * spd;
          e.vy = Math.sin(a) * spd;
          e.warnMs = 0;
        }
      } else {
        if (e.warnMs > 0) e.warnMs -= dtMs;
        const slow = skillTimeScaleNow();
        let mul = (e._slowMul == null ? 1 : e._slowMul) * slow;
        /* v0.26.0 #94 通用技能「磁力場」：範圍內敵彈被吸住（速度大幅下降）
           同時被拉近玩家。⚠️ 用乘數而唔係改 vx/vy —— 改咗就永久改壞，
           磁力場結束之後彈幕會慢死。 */
        if (magnetSlowFactor(e) < 1) {
          mul *= MAGNET_SLOW;
          const dx = e.x - ship.x, dy = e.y - ship.y;
          const d = Math.hypot(dx, dy) || 1;
          e.x -= (dx / d) * MAGNET_PULL * dtMs;
          e.y -= (dy / d) * MAGNET_PULL * dtMs;
        }
        e.x += e.vx * dtMs * mul;
        e.y += e.vy * dtMs * mul;
      }
    } else if (e.kind === 'grunt') {
      /* ---- 雜魚 AI：grunt/dive/elite/sniper/shield/swarm ---- */
      e.t += dtMs;
      if (e.shield) {
        e.shieldT -= dtMs;
        if (e.shieldT <= 0) {
          e.shieldOn = !e.shieldOn;
          e.shieldT = e.shieldOn ? SHIELD_ON_MS : SHIELD_OFF_MS;
        }
      }
      if (!e.diving && !e.sniper) {
        e.x += Math.sin(e.t / 620) * (e.sway || 0) * dtMs;
      } else if (e.diving) {
        e.vy += 0.000012 * dtMs;
      }
      /* v0.25.0 #87 C 機重炮擊退：額外推力獨立於敵人自己嘅 AI，
         逐幀衰減，所以唔會搶走 dive / rammer 原本嘅走位。 */
      if (e.kx || e.ky) {
        e.x += e.kx * (dtMs / 16.67);
        e.y += e.ky * (dtMs / 16.67);
        const decay = Math.pow(0.88, dtMs / 16.67);
        e.kx *= decay;
        e.ky *= decay;
        if (Math.abs(e.kx) < 0.02 && Math.abs(e.ky) < 0.02) { e.kx = 0; e.ky = 0; }
        /* ⚠️ 唔好將敵人推出畫面頂——離開畫面 = 走脫（唔計分），
           會變成「重炮打中反而冇分」嘅陷阱。推到頂就停住。 */
        if (e.y < 10) { e.y = 10; e.ky = 0; }
      }
      e.x = clamp(e.x, 12, VIEW_W - 12);
      e.y += e.vy * dtMs * (e._slowMul == null ? 1 : e._slowMul) * e._moveMul;

      /* v3.11 #71 rammer 衝撞者：起步慢 → 預警鎖定 → 加速直線撞。
       預警期唔郁，玩家見到先走位 —— 公平可躲。 */
      if (e.rammer && e.ramWarnMs === 0 && e.ramFired !== true && e.t > 300) {
        e.ramFired = true;
        e.ramWarnMs = RAMMER_WARN_MS;
      }
      if (e.rammer && e.ramWarnMs > 0) {
        e.ramWarnMs -= dtMs;
        if (e.ramWarnMs <= 0) {
          e.ramWarnMs = 0;
          if (ship) {
            const a = Math.atan2(ship.y - e.y, ship.x - e.x);
            const sp = Math.max(0.06, e.vy);
            e.vx = Math.cos(a) * sp;
            e.vy = Math.sin(a) * sp + 0.03;
          }
        }
      } else if (e.rammer) {
        const sp = Math.hypot(e.vx, e.vy);
        if (sp > 0.001 && sp < RAMMER_MAXV) {
          const ns = Math.min(RAMMER_MAXV, sp + RAMMER_ACCEL * dtMs);
          e.vx = (e.vx / sp) * ns;
          e.vy = (e.vy / sp) * ns;
        }
      }

      /* v3.11 #71 lancer 雷射兵：企喺原位，長預警 → 垂直光束掃射。
         撞到先扣血（同一般敵彈一致，走開就避得）。 */
      if (e.lancer) {
        if (e.beamWarnMs > 0) {
          e.beamWarnMs -= dtMs;
          if (e.beamWarnMs <= 0) {
            e.beamWarnMs = 0;
            e.beamFireMs = LANCER_BEAM_DUR;
            sfx('shoot');
          }
        } else if (e.beamFireMs > 0) {
          e.beamFireMs -= dtMs;
          if (ship && !isIFramed() && !GOD
              && Math.abs(ship.x - e.x) < LANCER_BEAM_DW && ship.y > e.y) {
            if (damageShip(1)) return;
          }
        } else {
          /* v0.27.0 雷 L3 麻痺：麻痺期間唔會射擊（fireCD 唔會倒數） */
          if (e.stunT <= 0) e.fireCD -= dtMs;
          if (e.fireCD <= 0) {
            e.fireCD = 2600 * D().fireIntervalMul;
            e.beamWarnMs = LANCER_WARN_MS;
          }
        }
      }

      /* ---- v0.26.0 #97 新敵人 AI（4 種）---- */
      /* 醫護型：唔攻擊，每 2.5 秒醫療附近敵人 +2 HP。
         擊殺醫護 = 令成批敵人停止回血 —— 玩家有明確嘅「優先目標」 */
      if (e.medic) {
        e.healCD -= dtMs;
        if (e.healFlash > 0) e.healFlash = Math.max(0, e.healFlash - dtMs / 320);
        if (e.healCD <= 0) {
          e.healCD = MEDIC_HEAL_MS;
          let healed = 0;
          for (const o of enemies) {
            if (o === e || o.kind !== 'grunt' || o._dead) continue;
            if (o.hp >= o.maxHp) continue;
            if (Math.hypot(o.x - e.x, o.y - e.y) > MEDIC_HEAL_R) continue;
            o.hp = Math.min(o.maxHp, o.hp + MEDIC_HEAL_AMT);
            healed++;
          }
          if (healed > 0) {
            e.healFlash = 1;
            spawnSparks(e.x, e.y, 3, 0.1);
          }
        }
      }
      /* 追蹤型：每幀修正方向追玩家（轉向速率有限，唔會瞬移追）。
         轉向用「最短角差」，唔會喺 ±180° 位置卡住。 */
      if (e.chaser && ship) {
        const want = Math.atan2(ship.y - e.y, ship.x - e.x);
        const cur = Math.atan2(e.vy, e.vx);
        let diff = want - cur;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = CHASER_TURN * (dtMs / 16.67);
        const na = cur + clamp(diff, -turn, turn);
        const sp = Math.hypot(e.vx, e.vy) || 0.05;
        e.vx = Math.cos(na) * sp;
        e.vy = Math.sin(na) * sp;
      }
      /* 自爆型：接近玩家就爆開環形彈，自己消失（唔會再撞到玩家扣血） */
      if (e.bomber && ship) {
        if (Math.hypot(ship.x - e.x, ship.y - e.y) < BOMBER_TRIGGER_R) {
          for (let i = 0; i < BOMBER_RING_N; i++) {
            const a = (i / BOMBER_RING_N) * Math.PI * 2;
            enemies.push({
              kind: 'bullet', x: e.x, y: e.y,
              vx: Math.cos(a) * BOMBER_RING_SPD,
              vy: Math.sin(a) * BOMBER_RING_SPD,
            });
          }
          spawnBoom(e.x, e.y);
          sfx('kill');
          e._dead = true;
          continue;   /* 呢隻已經爆咗，唔好再行下面嘅邏輯 */
        }
      }
      /* 護罩炮台：落到 y=82 就定住，瞄準射擊。護盾先食傷害（見命中迴圈）。 */
      if (e.turret) {
        if (e.y >= TURRET_HOLD_Y) e.vy = 0;
        /* v0.27.0 雷 L3 麻痺：麻痺期間唔會射擊（fireCD 唔會倒數） */
        if (e.stunT <= 0) e.fireCD -= dtMs;
        if (e.fireCD <= 0 && e.y > 24) {
          e.fireCD = 2400 * D().fireIntervalMul;
          const sx = ship ? ship.x : VIEW_W / 2;
          const sy = ship ? ship.y : VIEW_H - 60;
          const a = Math.atan2(sy - e.y, sx - e.x);
          const spd = 0.09 * bulletSpeedMul();
          enemies.push({
            kind: 'bullet', x: e.x, y: e.y,
            vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
          });
        }
      }

      if (e.sniper) {
        /* 狙擊：預警線 → 一發高速 */
        if (e.warnMs > 0) {
          e.warnMs -= dtMs;
          if (e.warnMs <= 0) {
            e.warnMs = 0;
            const d = D();
            const spd = 0.22 * bulletSpeedMul();
            const a = Math.atan2(e.warnTy - e.y, e.warnTx - e.x);
            enemies.push({
              kind: 'bullet', x: e.x, y: e.y,
              vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
              sniperShot: true,
            });
            e.fireCD = 2600 * d.fireIntervalMul;
          }
        } else {
          /* v0.27.0 雷 L3 麻痺：麻痺期間唔會射擊（fireCD 唔會倒數） */
          if (e.stunT <= 0) e.fireCD -= dtMs;
          if (e.fireCD <= 0 && e.y > 20 && e.y < VIEW_H - 140) {
            e.warnMs = SNIPER_WARN_MS;
            e.warnTx = ship ? ship.x : VIEW_W / 2;
            e.warnTy = ship ? ship.y : VIEW_H - 60;
            e.fireCD = 99999; /* 等 warn 完再重設 */
          }
        }
      } else {
        /* v0.27.0 雷 L3 麻痺：麻痺期間唔會射擊（fireCD 唔會倒數） */
        if (e.stunT <= 0) e.fireCD -= dtMs;
        /* v0.26.0 #97：醫護（唔攻擊）同炮台（自己一套射擊邏輯）唔行通用射擊 */
        if (e.fireCD <= 0 && e.y > 24 && e.y < VIEW_H - 120 && !e.medic && !e.turret) {
          const d = D();
          e.fireCD = (e.elite ? 1500 : e.shield ? 2200 : e.swarm ? 3200 : 2800) * d.fireIntervalMul;
          const sx = ship ? ship.x : VIEW_W / 2;
          const sy = ship ? ship.y : VIEW_H - 60;
          const base = Math.atan2(sy - e.y, sx - e.x);
          const n = e.elite ? 3 : 1;
          const spd = (e.elite ? 0.075 : 0.06) * bulletSpeedMul();
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * 0.24;
            enemies.push({ kind:'bullet', x: e.x, y: e.y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd });
          }
        }
      }
      if (e.elite && e.label.indexOf('精英') < 0) e.label = '精英 · ' + e.affix;
    }
  }

  /* ---- 碰撞：玩家子彈 vs 敵機（boss 同雜魚） ---- */
  for (const e of enemies) {
    if (e.kind !== 'spiral' && e.kind !== 'grunt') continue;
    if (e._dead) continue;          /* 已經死咗，唔可以再計多次分 */
    const halfW = (e.kind === 'spiral') ? 12 : 8;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.owner !== 'player') continue;
      /* v0.28.0：導彈爆散碎屑唔打 boss（理由見 spawnMissileBurst） */
      if (b.noBoss && e.kind === 'spiral') continue;
      /* rail 用線寬；其餘點撞（v0.28.0：判定抽出 playerBulletHits()，
         因為 rail 嘅判定要同「畫面上嘅光束」一致，唔係普通點撞） */
      if (playerBulletHits(b, e, halfW)) {
              /* 同一彈唔好每幀重複打同一隻 */
              /* v3.11 #69：同一子彈對同一敵人只打一次（_hitSet）。
           對 rail（瞬發線）同 boomerang（去返都打）特別重要——否則
           瞬發線每幀重複計分、迴力鏢返程對同一目標計兩次。 */
              if (b._hitSet && b._hitSet.indexOf(e) >= 0) continue;
              if (b.form === 'rail' && b._railHit && b._railHit.indexOf(e) >= 0) continue;
              if (e === b._lastHit && b.form !== 'boomerang') continue;
              /* 護盾機：正面（朝下弧）擋玩家彈；側擊／盾滅先入肉 */
              if (e.shield && e.shieldOn) {
                const ang = Math.atan2(b.y - e.y, b.x - e.x);
                if (Math.abs(ang - Math.PI / 2) < 1.05) {
                  if (b.pierceLeft > 0) {
                    b.pierceLeft--;
                    b._lastHit = e;
                  } else if (!bulletSurvivesHit(b)) {
                    bullets.splice(i, 1);
                  }
                  spawnSparks(b.x, b.y, 4, 0.1);
                  screenFlash = Math.max(screenFlash, 0.12);
                  /* v0.28.0：被護盾擋住都要記低打過，否則「命中唔死」嘅彈體
                     （迴力鏢 / 導彈）會每一幀重複撞同一隻護盾機。 */
                  if (b._hitSet) b._hitSet.push(e);
                  continue;
                }
              }
              /* v0.26.0 #97 護罩炮台：護盾全向食傷害，打穿咗先入肉 */
              if (applyTurretShield(b, e)) {
                if (b.pierceLeft > 0) {
                  b.pierceLeft--;
                  b._lastHit = e;
                } else if (!bulletSurvivesHit(b)) {
                  bullets.splice(i, 1);
                }
                if (b._hitSet) b._hitSet.push(e);
                continue;
              }
              e.hp -= elementHitDamage(b, e);
              applySatelliteBonus(b, e);
              applyGroupBonus(b, e);
              /* v0.25.0 #87 C 機重炮：命中會將雜魚打飛（boss 唔受擊退）。
                 方向由玩家指向敵人計 —— 玩家喺下面，所以係向上打飛。 */
              if (b.knock) {
                applyKnockback(e, e.x - ship.x, e.y - ship.y, b.knock);
              }
              feelHitEnemy(e);
              spawnSparks(b.x, b.y, 3, 0.08);
              sfx('hit');
              const remove = onPlayerBulletHit(b, e);
              if (b._hitSet) b._hitSet.push(e);   /* #69：記低打過，返程唔重複 */
              if (remove) bullets.splice(i, 1);
              if (e.hp <= 0) {
                /* v0.27.0：死亡處理統一行 killEnemy()（元素效果都經過同一條路徑）。 */
                if (killEnemy(e) === 'boss') { onBossDown(e); return; }
                break;
              }
              break;
            }
    }
  }

  /* ---- 碰撞：敵方子彈、雷射同雜魚撞擊 vs 戰機 ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.kind !== 'bullet' && e.kind !== 'laser' && e.kind !== 'grunt') continue;
    if (e.pending) continue; /* 預警未發射唔撞 */
    if (e._dead) continue;   /* v0.26.0 #94：已被標記清走（過載護盾）嘅唔再撞 */
    /* P1-5：雜魚有撞擊傷害 —— 撞到玩家會自己死。
       冇呢條規則嘅話，最優策略就係完全唔理雜魚任由佢飛走，
       「擊殺雜魚」變成冇誘因，等 P1-5 個設計目標失效。 */
    const isBody = (e.kind === 'grunt');
    const r = isBody ? 9 : 4;
    if (Math.abs(e.x - ship.x) < 6 + r && Math.abs(e.y - ship.y) < 6 + r) {
      /* PLAN v2 #7：炸彈無敵時段 —— 施放後 1.5 秒內唔受傷。
         視覺上仍然清走嗰粒彈，等玩家見到擋成功咗。 */
      if (isIFramed() || GOD) {
        if (isBody) { spawnSparks(e.x, e.y, 6, 0.12); enemies.splice(i, 1); }
        else enemies.splice(i, 1);
        if (GOD) { ship.hp = ship.maxHp; ship.shield = SHIPS[ship.chassis].shield; }
        continue;
      }
      enemies.splice(i, 1);
      if (isBody) spawnBoom(e.x, e.y); else spawnSparks(ship.x, ship.y, 6, 0.14);
      if (damageShip(1)) return;   /* true = 已死，要即刻停低 tick */
    } else if (!isBody && !e._grazed) {
      /* ---- P1-6 擦彈判定 ----
         用圓形距離（唔係上面嗰個方形），令斜向擦過都算數。
         必須 `else if`：已經判中嘅彈唔可以同時當擦彈。
         `_grazed` 保證每粒子彈只計一次 —— 一粒子彈喺 20px 圈內
         大約停留 20–40 幀，冇呢個旗標會被重複計幾十次。 */
      const dx = e.x - ship.x, dy = e.y - ship.y;
      if (Math.hypot(dx, dy) < grazeRadius()) {
        e._grazed = true;
        doGraze(ship.x + dx, ship.y + dy);
      }
    }
  }

  /* ---- 清除離畫面實體 ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e._dead) { enemies.splice(i, 1); continue; }
    if (e.kind === 'bullet' && (e.x < -16 || e.x > VIEW_W + 16 || e.y < -16 || e.y > VIEW_H + 16)) {
      enemies.splice(i, 1);
    } else if (e.kind === 'laser' && (e.lifeMs !== undefined && e.lifeMs <= 0)) {
      enemies.splice(i, 1);
    } else if (e.kind === 'grunt' && (e.y > VIEW_H + 20 || e.y < -40 || e.x < -24 || e.x > VIEW_W + 24)) {
      /* 雜魚飛出畫面 = 走脫，唔計分。令玩家有動機主動擊殺，
         而唔係「閃埋唔打」就過關。 */
      enemies.splice(i, 1);
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.y < -8 || b.y > VIEW_H + 8 || b.x < -8 || b.x > VIEW_W + 8) {
      bullets.splice(i, 1);
    }
  }

  /* ---- 狀態列 ---- */
  const now = performance.now();
  /* v0.25.0：左掣由「聚焦」改成**每架機專屬技能**，
     所以狀態列要跟機體顯示技能名同冷卻剩餘時間
     （原本仲引用已刪嘅 isFocusActive / focusFactor / focusCDUntil → 每次 tick 都會 throw）。 */
  const sk = ship ? SHIPS[ship.chassis] : null;
  const skillName = sk ? sk.skillName : '技能';
  const skillState = isSkillActive()
    ? `${skillName}生效中`
    : (skillCdUntil > now
        ? `${skillName}冷卻 ${Math.ceil((skillCdUntil - now) / 1000)} 秒`
        : `${skillName}就緒`);
  const bombState  = isIFramed()
    ? `炸彈無敵 ${(Math.max(0, iFrameUntil - now)/1000).toFixed(1)} 秒`
    : (bombCDUntil > now ? `炸彈冷卻 ${Math.max(0, Math.ceil((bombCDUntil - now)/1000))} 秒` : '炸彈就緒');
  hudEl.hp.textContent = `生命：${ship.hp}  護盾：${ship.shield}  分數：${Math.floor(runScore)}`;
  hudEl.tip.textContent = `${skillState} · ${bombState}`;
  /* 必須喺 tip 賦值之後，否則下一行會即刻覆蓋咗 */
  if (DEBUG) {
    hudEl.tip.textContent =
      `種子 ${runSeed}　詞綴 ${stageAffix ? stageAffix.name + '(×' + affScore.toFixed(2) + ')' : '無'}　` +
      `風格 ${stageStyle ? stageStyle.name : '無'}　` +
      `形態 ${ship.shotForm || 'bolt'}${ship.shotTags ? '　tag ' + Object.entries(ship.shotTags).filter(([k,v])=>v>0).map(([k,v])=>k+v).join(',') || '無' : ''}　` +
      `彈 ${bullets.filter(b=>b.owner==='player').length}　` +
      `擊殺 ${runKills}（雜魚 ${runGrunts} · boss ${runKills - runGrunts}）　擦彈 ${grazeCount}（能量 ${grazeEnergy}/${GRAZE_ENERGY_NEED}）　` +
      hudEl.tip.textContent;
  }
}

/* ---------- 音效掣 + 音量面板（PLAN v3.9 #52）---------- */
/* 位置：暫停掣下面（右上 y=68）。⚠️ 唔可以放 y=6 —— 護盾 icon 由 VIEW_W-16
   向左排 5 個，佔 y≈14–26，會同右上角掣重疊（暫停掣本身已經喺嗰區，
   屬 v3.3 既有情況，今次唔擴大）。 */
let audioPanelOpen = false;
function audioBtnRect() {
  const s = 56;
  return { x: VIEW_W - s - 6, y: isStage(fsm.cur) ? 68 : 6, w: s, h: s };
}
function audioPanelRect() {
  const w = 252, h = 248;
  return { x: (VIEW_W - w) / 2, y: (VIEW_H - h) / 2 - 24, w, h };
}
/* 行距 6px：原本 row2 用 y+168，同 row1（y+116、h=56）重疊 4px，
   而且 row2 底部仲超出面板 10px —— test_audio.js 捉到。觸控目標一撞就
   會撳錯行，所以間距要留夠。 */
function audioPanelBtns(p) {
  return {
    power:   { x: p.x + (p.w - 184) / 2, y: p.y + 40,  w: 184, h: 56 },
    bgmMinus:{ x: p.x + 18,  y: p.y + 108, w: 56, h: 56 },
    bgmPlus: { x: p.x + p.w - 74, y: p.y + 108, w: 56, h: 56 },
    sfxMinus:{ x: p.x + 18,  y: p.y + 170, w: 56, h: 56 },
    sfxPlus: { x: p.x + p.w - 74, y: p.y + 170, w: 56, h: 56 },
  };
}
const inRect = (px, py, r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

/* 音效掣 / 面板點擊。面板開住時全部吃掉（唔會漏去遊戲）。 */
function handleAudioPanelTap(px, py) {
  if (audioPanelOpen) {
    const p = audioPanelRect(), b = audioPanelBtns(p);
    if (inRect(px, py, b.power)) {
      setAudioOn(!audioOn);
      Bgm.setPlaying(audioOn);
      return true;
    }
    if (inRect(px, py, b.bgmMinus)) { bumpVol('bgm', -1); return true; }
    if (inRect(px, py, b.bgmPlus))  { bumpVol('bgm', +1); return true; }
    if (inRect(px, py, b.sfxMinus)) { bumpVol('sfx', -1); return true; }
    if (inRect(px, py, b.sfxPlus))  { bumpVol('sfx', +1); return true; }
    audioPanelOpen = false;   /* 撳面板以外 = 關閉 */
    return true;
  }
  if (inRect(px, py, audioBtnRect())) { audioPanelOpen = true; return true; }
  return false;
}

/* 細喇叭（唔用 emoji，各平台先一致）。
   ⚠️ 關閉狀態唔可以用太深嘅灰 —— 之前用 #556，深色底上智慧白板根本睇唔到，
   學生會以為冇呢個掣。改 #9bb。 */
function drawSpeakerIcon(cx, cy, on) {
  ctx.fillStyle = on ? '#0ff' : '#9bb';
  ctx.beginPath();
  ctx.moveTo(cx - 9, cy - 4); ctx.lineTo(cx - 4, cy - 4); ctx.lineTo(cx + 2, cy - 10);
  ctx.lineTo(cx + 2, cy + 10); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx - 9, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = on ? '#0ff' : '#9bb';
  ctx.lineWidth = 2;
  for (let i = 0; i < (on ? 2 : 1); i++) {
    ctx.beginPath(); ctx.arc(cx + 2, cy, 6 + i * 5, -0.8, 0.8); ctx.stroke();
  }
  if (!on) {
    ctx.strokeStyle = '#f55'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx + 12, cy + 12); ctx.stroke();
  }
}
function drawAudioUi() {
  /* 面板開住就算已暫停都要畫（否則玩家喺暫停畫面開咗音效就見唔到） */
  if (fsm.cur === STATE.PAUSED && !audioPanelOpen) return;
  const r = audioBtnRect();
  ctx.fillStyle = 'rgba(0,20,40,0.72)';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = audioPanelOpen ? '#ff5e8a' : 'rgba(0,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  drawSpeakerIcon(r.x + r.w / 2, r.y + r.h / 2, audioOn);
  if (!audioPanelOpen) return;

  const p = audioPanelRect(), b = audioPanelBtns(p);
  ctx.fillStyle = 'rgba(2,10,20,0.88)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = 'rgba(0,28,44,0.96)';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x, p.y, p.w, p.h);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0ff'; ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillText('音效設定', p.x + p.w / 2, p.y + 22);

  /* 總開關 */
  ctx.fillStyle = audioOn ? 'rgba(0,90,70,0.95)' : 'rgba(90,30,40,0.95)';
  ctx.fillRect(b.power.x, b.power.y, b.power.w, b.power.h);
  ctx.strokeStyle = audioOn ? '#0f6' : '#f66';
  ctx.strokeRect(b.power.x, b.power.y, b.power.w, b.power.h);
  drawSpeakerIcon(b.power.x + 34, b.power.y + b.power.h / 2, audioOn);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillText(audioOn ? '音效 開' : '音效 關', b.power.x + 116, b.power.y + b.power.h / 2);

  /* 音量列：[−] 標籤 + 進度點 [+]，唔用滑條（智慧白板要粗撳得中） */
  const step = (rc, sign) => {
    ctx.fillStyle = 'rgba(0,60,80,0.95)'; ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.strokeRect(rc.x, rc.y, rc.w, rc.h);
    ctx.fillStyle = '#0ff'; ctx.font = 'bold 24px ui-monospace, monospace'; ctx.textAlign = 'center';
    ctx.fillText(sign, rc.x + rc.w / 2, rc.y + rc.h / 2 + 1);
  };
  const row = (label, val, minus, plus) => {
    const midY = minus.y + minus.h / 2;
    ctx.textAlign = 'left'; ctx.fillStyle = '#9ff'; ctx.font = '14px ui-monospace, monospace';
    ctx.fillText(label, p.x + 84, midY - 10);
    for (let i = 0; i < VOL_STEPS; i++) {
      ctx.fillStyle = i < val ? '#0ff' : 'rgba(0,255,255,0.18)';
      ctx.fillRect(p.x + 84 + i * 13, midY + 2, 10, 5);
    }
    step(minus, '−'); step(plus, '+');
  };
  row('音樂', volBgm, b.bgmMinus, b.bgmPlus);
  row('音效', volSfx, b.sfxMinus, b.sfxPlus);

  ctx.fillStyle = '#889'; ctx.font = '12px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillText('撳面板以外 = 關閉', p.x + p.w / 2, p.y + p.h - 13);
}

/* v3.8 #43：詞綴橫幅（入關 4.2 秒）＋「停電」暗幕
   v0.31.0 #116：總長 2.6s → 4.2s、fade 2.0s → 3.6s（閱讀時間實測調校）
   v0.31.0 #117：停電 alpha 0.42 → 0.22（對比度實測調校） */
function drawStageAffixFx() {
  if (!isStage(fsm.cur)) return;
  /* 停電：全畫面壓暗（v0.31.0 #117：alpha 0.42 → 0.22，見 PLAN 已知落差 #13）。
     ⚠️ 繪製次序：暗幕喺 drawAbilityBtns / drawHudChips / drawGrazeMeter 之後 →
     所以**能力掣、關卡 chip、擦彈條都會被壓暗**；只有 renderTail() 畫嘅
     音效掣 + 掃描線喺暗幕之後（唔會被壓暗）。 */
  if (affDark) {
    ctx.fillStyle = 'rgba(0,0,20,' + (AFFIX_DARK_ALPHA * affDark).toFixed(3) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  if (!stageAffix || affixShownAt <= 0) return;
  const age = performance.now() - affixShownAt;
  if (age > AFFIX_BANNER_MS) return;
  const fade = age > AFFIX_BANNER_FADE_MS
    ? Math.max(0, 1 - (age - AFFIX_BANNER_FADE_MS) / AFFIX_BANNER_FADE_SPAN) : 1;
  const y = 96;
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(0,20,40,0.85)';
  ctx.fillRect(VIEW_W / 2 - 92, y - 22, 184, 44);
  ctx.strokeStyle = '#ff5e8a'; ctx.lineWidth = 2;
  ctx.strokeRect(VIEW_W / 2 - 92, y - 22, 184, 44);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px ui-monospace, monospace';
  /* ⚠️ v0.27.2 修正：原本係 fillText(stageAffix.icon + ' ' + stageAffix.name)，
     而 stageAffix.icon 係**圖集 sprite key**（'icon_iron' / 'icon_wind' …）——
     玩家每關開場都見到內部變數名。改用 drawIconWithText：icon 畫 sprite，淨係得個名。 */
  drawIconWithText(stageAffix.icon, stageAffix.name, VIEW_W / 2, y - 6, 1.6,
                   'bold 16px ui-monospace, monospace', '#fff', 6);
  ctx.fillStyle = '#ffd56a';
  ctx.font = '12px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(stageAffix.desc, VIEW_W / 2, y + 12);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function drawLootBanner() {

  const barW = VIEW_W - 70;

  /* ---- #46 單次逆轉三選一：把一件現有強化升級為傳說級 ---- */

    ctx.fillStyle = '#ff6';

  /* v3.11 #68：laser 持續光束（機身跟隨）。畫喺玩家子彈之前，

  if (laserActive() && ship) {

      const f = b.form || 'bolt';
      if (f === 'rail') {
        ctx.strokeStyle = 'rgba(180,255,255,0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x, 8);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, 8); ctx.stroke();

        ctx.fillStyle = '#f84';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - 5);
        ctx.lineTo(b.x + 3, b.y + 4);
        ctx.lineTo(b.x - 3, b.y + 4);
