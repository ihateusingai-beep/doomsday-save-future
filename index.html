<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>末日救未來 — Doomsday Save the Future</title>
<style>
  /* === reset + fullscreen === */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
    overscroll-behavior:none;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", monospace;
    color:#0ff;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
  }
  /* === canvas (PLAN v2 #10-12, CSS-scaled, image-rendering pixelated) === */
  canvas {
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    background:#000;
    touch-action:none;
    cursor:crosshair;
  }
  /* === HUD === */
  #hud {
    position:fixed; top:8px; left:8px;
    font:12px ui-monospace, monospace;
    pointer-events:none;
    color:#0ff;
    line-height:1.4;
    text-shadow:0 0 4px #000;
  }
  #hud .row { white-space:nowrap; }
  #hud .accent { color:#ff6; }
  #hud .warn { color:#f06; }
</style>
</head>
<body>
  <canvas id="game" width="320" height="480" aria-label="Doomsday Save the Future game canvas"></canvas>
  <div id="hud" aria-live="polite">
    <div class="row" id="hud-state">STATE: --</div>
    <div class="row" id="hud-time">TIME: 0.0s</div>
    <div class="row" id="hud-hp">HP: --  SHIELD: --</div>
    <div class="row" id="hud-paused"></div>
    <div class="row accent" id="hud-tip">tap canvas to begin</div>
  </div>
<script>
'use strict';
/* ============================================================
 * 末日救未來 — S0 scaffold (PLAN v2 2026-10-17)
 * coverage:
 *   S0-1 canvas 320×480 + DPR-aware backing store + CSS fit
 *   S0-2 frozen FSM (TITLE/SHIP_SELECT/STAGE_n/CHOICE/PAUSED/GAMEOVER/VICTORY)
 *   S0-3 1 ship (drag + arrow/WASD + autofire)
 *   S0-4 1 enemy (8-way spiral + ship bullets hit/damage)
 *   S0-5 tab visibilitychange → state=PAUSED + timer freeze
 *
 * follow PLAN v2 §Reference #11 (Canvas 2D / 320×480 internal coords),
 *                        #13 (fixed 60 FPS accumulator),
 *                        #15 (Pointer Events + keyboard proxy),
 *                        #16 (FSM with reset hook),
 *                        #17 (tab visibility pause)
 * ============================================================ */

/* ---------- 1. CONSTANTS ---------- */
const VIEW_W = 320;
const VIEW_H = 480;
const FIXED_DT_MS = 1000 / 60;             // 60 FPS logic step
const MAX_FRAME_MS = 100;                  // cap huge tab-blur gap

/* FSM enum (PLAN v2 #16) */
const STATE = Object.freeze({
  TITLE:       'TITLE',
  SHIP_SELECT: 'SHIP_SELECT',
  STAGE_1:     'STAGE_1',
  STAGE_2:     'STAGE_2',
  STAGE_3:     'STAGE_3',
  STAGE_4:     'STAGE_4',
  STAGE_5:     'STAGE_5',
  CHOICE:      'CHOICE',
  GAMEOVER:    'GAMEOVER',
  VICTORY:     'VICTORY',
  PAUSED:      'PAUSED',
});

/* SHIPS (PLAN v2 #1: 1 ship × 3 chassis A/B/C) */
const SHIPS = Object.freeze({
  A: { id:'A', name:'速', speed:3.2, shield:1, fireRate:10 },
  B: { id:'B', name:'盾', speed:2.4, shield:3, fireRate:14 },
  C: { id:'C', name:'火', speed:2.0, shield:1, fireRate:6  },
});

const isStage = (s) => s && s.indexOf('STAGE_') === 0;
const STAGES = [STATE.STAGE_1, STATE.STAGE_2, STATE.STAGE_3, STATE.STAGE_4, STATE.STAGE_5];

/* ---------- 2. INPUT LAYER (PLAN v2 #15, #18-19) ---------- */
const InputState = {
  /* last-write-wins target (drag OR WASD converge here) */
  targetX: VIEW_W / 2,
  targetY: VIEW_H - 60,

  /* keyboard proxy */
  keys: { up:false, down:false, left:false, right:false },

  /* single-action flags (consume-on-read) */
  focus: false,           // PLAN #6 focus toggle
  bomb:  false,           // PLAN #7 bomb trigger

  /* drag bookkeeping */
  dragId: null,
  dragOrigin: { x:0, y:0 },
  shipOrigin: { x:0, y:0 },
  touchMoved: false,
};

/* 8px tolerance for Smart Board dedup — PLAN v2 #19 */
const DRAG_TOLERANCE_PX = 8;

/* ---------- 3. DOM refs ---------- */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const hudEl  = {
  state:  document.getElementById('hud-state'),
  time:   document.getElementById('hud-time'),
  hp:     document.getElementById('hud-hp'),
  paused: document.getElementById('hud-paused'),
  tip:    document.getElementById('hud-tip'),
};

/* ---------- 4. Canvas DPR (PLAN v2 #12) ---------- */
function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = VIEW_W * dpr;
  canvas.height = VIEW_H * dpr;
  /* fit while preserving 320×480 aspect */
  const aspect = VIEW_W / VIEW_H;
  const winAspect = window.innerWidth / window.innerHeight;
  let cssW, cssH;
  if (winAspect > aspect) {
    cssH = Math.min(window.innerHeight, window.innerWidth * (1/aspect));
    cssW = cssH * aspect;
  } else {
    cssW = Math.min(window.innerWidth, window.innerHeight * aspect);
    cssH = cssW / aspect;
  }
  canvas.style.width  = Math.floor(cssW) + 'px';
  canvas.style.height = Math.floor(cssH) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);    // logical coords = internal 320×480
}
setupCanvas();
window.addEventListener('resize', setupCanvas);
window.addEventListener('orientationchange', () => setTimeout(setupCanvas, 120));

/* ---------- 5. FSM ---------- */
const fsm = {
  cur: STATE.TITLE,
  prev: null,                 // remember pre-PAUSED state for resume
  transitions: [],            // for S0-2: log to console

  set(next) {
    if (next === this.cur) return;
    const from = this.cur;
    this.prev = this.cur;
    this.cur  = next;
    this.transitions.push({ from, to: next, at: performance.now() });
    /* F2 reset-on-render: per-state entry reset (PLAN v2 #16) */
    onStateEnter(next, from);
    /* S0-2 log */
    console.log(`[FSM] ${from} → ${next} @ ${(performance.now()/1000).toFixed(2)}s`);
    hudEl.state.textContent = `STATE: ${next}`;
  },
};

function onStateEnter(s, from) {
  if (isStage(s)) {
    lastStage = parseInt(s.split('_')[1], 10);
    /* reset entities, apply upgrades */
    bullets.length = 0;
    enemies.length = 0;
    if (!ship) pickShip('A');                 // default ship first run
    applyUpgrades();
    ship.x = VIEW_W/2; ship.y = VIEW_H - 60;
    ship.hp = ship.maxHp; ship.shield = SHIPS[ship.chassis].shield;
    /* spawn stage boss */
    spawnBossFor(lastStage);
    runStartMs = performance.now();
    hudEl.tip.textContent = `S${lastStage} · ${STAGE_TABLE[lastStage].name} · WASD/Drag · SPACE focus · SHIFT bomb`;
  } else if (s === STATE.CHOICE) {
    /* remember which stage we're mid (already in lastStage from entry) */
    choiceOffer = generateChoiceOffer();
    choicePicked = -1;
    hudEl.tip.textContent = 'CHOICE · tap a card or press 1/2/3';
  } else if (s === STATE.GAMEOVER) {
    hudEl.tip.textContent = 'Tap to retry';
  } else if (s === STATE.VICTORY) {
    hudEl.tip.textContent = 'Mission complete';
  } else if (s === STATE.PAUSED) {
    hudEl.tip.textContent = 'PAUSED — tab hidden';
  } else if (s === STATE.TITLE) {
    hudEl.tip.textContent = 'tap canvas to begin';
    bullets.length = 0; enemies.length = 0;
    /* keep ship + playerStacks for retry */
  } else if (s === STATE.SHIP_SELECT) {
    hudEl.tip.textContent = 'A / B / C (or tap a ship card)';
  }
}

/* ---------- 6. UPGRADES TABLE (PLAN v2 #2: 18 fixed items, all stackable) ---------- */
const UPGRADES = [
  { id:'spd_s',   nameZh:'速度+',    icon:'⚡',   desc:'speed +15%',               mod:(s,n)=>{ s.speed *= Math.pow(1.15, n); } },
  { id:'spd_l',   nameZh:'速度++',   icon:'⚡⚡',  desc:'speed +30%',               mod:(s,n)=>{ s.speed *= Math.pow(1.30, n); } },
  { id:'hp_s',    nameZh:'生命+',    icon:'❤',   desc:'max HP +1',                mod:(s,n)=>{ s.maxHp += 1 * n; } },
  { id:'hp_l',    nameZh:'生命+2',   icon:'❤❤', desc:'max HP +2',                mod:(s,n)=>{ s.maxHp += 2 * n; } },
  { id:'shd_s',   nameZh:'盾+',      icon:'🛡',   desc:'starting shield +1',       mod:(s,n)=>{ s.shield += 1 * n; } },
  { id:'shd_l',   nameZh:'盾+2',     icon:'🛡🛡', desc:'starting shield +2',       mod:(s,n)=>{ s.shield += 2 * n; } },
  { id:'fr_s',    nameZh:'射速+',    icon:'🔥',   desc:'fireRate +25%',            mod:(s,n)=>{ s.fireRate *= Math.pow(1.25, n); } },
  { id:'fr_l',    nameZh:'射速++',   icon:'🔥🔥', desc:'fireRate +50%',            mod:(s,n)=>{ s.fireRate *= Math.pow(1.50, n); } },
  { id:'gun_2',   nameZh:'雙砲',     icon:'✦',    desc:'2-way → 3-way',            mod:(s,n)=>{ s.bulletCount = 2 + n; } },
  { id:'gun_3',   nameZh:'三砲',     icon:'✦✦',  desc:'3-way → 4-way',            mod:(s,n)=>{ s.bulletCount = Math.min(4, 3 + n); } },
  { id:'dmg_s',   nameZh:'火力+',    icon:'💥',   desc:'bullet damage +1 (S2)',    mod:(s,n)=>{ s.bulletDmg = (s.bulletDmg||1) + n; } },
  { id:'bomb_cd', nameZh:'炸彈CD-',  icon:'💣',   desc:'bomb CD -25%',             mod:(s,n)=>{ s.bombCD *= Math.pow(0.75, n); } },
  { id:'focus_d', nameZh:'聚焦+',    icon:'◉',    desc:'focus slow 0.3 → 0.2',     mod:(s,n)=>{ s.focusFactor = Math.max(0.1, s.focusFactor - 0.1*n); } },
  { id:'graze_s', nameZh:'擦彈+',    icon:'»',    desc:'graze score x2 (S2)',      mod:(s,n)=>{ s.grazeMult = (s.grazeMult||1) * Math.pow(2, n); } },
  { id:'pierce',  nameZh:'貫穿',     icon:'➶',    desc:'bullets pierce 1 enemy',   mod:(s,n)=>{ s.pierce = n; } },
  { id:'life_st', nameZh:'復活',     icon:'✝',    desc:'one resurrect (S2)',       mod:(s,n)=>{ s.resurrect = (s.resurrect||0) + n; } },
  { id:'aurora',  nameZh:'極光',     icon:'✺',    desc:'360° periodic burst (S2)', mod:(s,n)=>{ s.aurora = (s.aurora||0) + n; } },
  { id:'master',  nameZh:'大師',     icon:'★',    desc:'+20% all stats',           mod:(s,n)=>{ s.masterStacks = (s.masterStacks||0) + n; } },
];
/* S2 candidates marked "S2" in desc — S1 doesn't implement apply side. */

/* stack count, key = upgrade id (PLAN v2 #3: re-offer allowed) */
let playerStacks = Object.create(null);

/* ---------- 7. ENTITIES ---------- */
let ship = null;            /* { chassis, x, y, hp, maxHp, shield, speed, fireRate, fireCD,
                                 bulletCount, bulletDmg, bombCD, focusFactor,
                                 focusDuration, focusCD, grazeMult, pierce,
                                 resurrect, aurora, masterStacks, iFrameUntil } */
let bullets = [];           /* { x, y, vx, vy, owner:'player' } */
let enemies = [];           /* spiral | bullet | boss */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function pickShip(id) {
  const c = SHIPS[id];
  ship = {
    chassis: id,
    x: VIEW_W / 2,
    y: VIEW_H - 60,
    hp: 3, maxHp: 3,
    shield: c.shield,
    speed: c.speed,
    fireRate: c.fireRate,
    fireCD: 0,
    bulletCount: 2,
    bulletDmg: 1,
    bombCD: 12000,
    focusFactor: 0.3,
    focusDuration: 4000,
    focusCD: 8000,
    grazeMult: 1.0,
    pierce: 0,
    resurrect: 0,
    aurora: 0,
    masterStacks: 0,
    iFrameUntil: 0,
  };
  /* apply any existing stacks (resuming run) */
  applyUpgrades();
}

function applyUpgrades() {
  if (!ship) return;
  /* reset to base */
  const c = SHIPS[ship.chassis];
  ship.maxHp        = 3;
  ship.shield       = c.shield;
  ship.speed        = c.speed;
  ship.fireRate     = c.fireRate;
  ship.bulletCount  = 2;
  ship.bulletDmg    = 1;
  ship.bombCD       = 12000;
  ship.focusFactor  = 0.3;
  ship.focusDuration= 4000;
  ship.focusCD      = 8000;
  ship.grazeMult    = 1.0;
  ship.pierce       = 0;
  ship.resurrect    = 0;
  ship.aurora       = 0;
  ship.masterStacks = 0;
  /* apply stacks */
  for (const up of UPGRADES) {
    const n = playerStacks[up.id] || 0;
    if (n > 0) up.mod(ship, n);
  }
  /* master: multiplicative 1.20 per stack on speed/fireRate */
  if (ship.masterStacks > 0) {
    const m = Math.pow(1.20, ship.masterStacks);
    ship.speed    *= m;
    ship.fireRate *= m;
  }
  /* clamp hp upward if maxHp grew */
  if (ship.hp < ship.maxHp) ship.hp = ship.maxHp;
  /* keep shield ≥ 0 */
  if (ship.shield < 0) ship.shield = 0;
}

/* ---------- 7a. CHOICE (PLAN v2 §CHOICE / #3 re-offer) ---------- */
let lastStage = 1;          /* remember pre-CHOICE for advanceStage */
let choiceOffer = [];        /* [up, up, up] */
let choicePicked = -1;       /* choice card picked (0/1/2) or -1 */

function generateChoiceOffer() {
  /* 3 cards from UPGRADES pool; re-offer allowed (no exclusion). */
  const pick = () => UPGRADES[Math.floor(Math.random() * UPGRADES.length)];
  return [pick(), pick(), pick()];
}

function applyPickedUpgrade(idx) {
  if (idx < 0 || idx >= choiceOffer.length) return;
  const up = choiceOffer[idx];
  playerStacks[up.id] = (playerStacks[up.id] || 0) + 1;
  console.log('[CHOICE] picked', up.id, 'count =', playerStacks[up.id]);
  applyUpgrades();
}

/* ---------- 8. STAGE_TABLE + spawnBossFor (S1-B will expand) ---------- */
/* declared early so onStateEnter's STAGE_n entry can call spawnBossFor */
const STAGE_TABLE = {
  1: { name:'維港起飛',  targetSec:50, bossHp:80  },
  2: { name:'九龍煙柱',  targetSec:55, bossHp:110 },
  3: { name:'大氣層',    targetSec:60, bossHp:150 },
  4: { name:'軌道殘骸',  targetSec:65, bossHp:200 },
  5: { name:'逃逸門 Final', targetSec:70, bossHp:300 },
};

function spawnBossFor(stageId) {
  /* S1-A: still single spiral boss; S1-B replaces with per-stage boss.
     kept compatible with old "spiral" type so S0 collision logic still works. */
  const st = STAGE_TABLE[stageId] || STAGE_TABLE[1];
  enemies.push({
    kind: 'spiral',
    stage: stageId,
    x: VIEW_W / 2, y: 60,
    hp: st.bossHp,
    t: 0,
    ang0: 0,
    label: `${st.name} · BOSS S${stageId}`,
  });
  console.log(`[stage ${stageId}] ${st.name} spawned · boss HP ${st.bossHp}`);
}

/* ---------- 7. INPUT — Pointer Events + Keyboard ---------- */
canvas.addEventListener('pointerdown', (e) => {
  /* onTap dispatch by state */
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX, cy = e.clientY;
  const px = (cx - rect.left) * VIEW_W / rect.width;
  const py = (cy - rect.top)  * VIEW_H / rect.height;
  if (fsm.cur === STATE.TITLE) { fsm.set(STATE.SHIP_SELECT); return; }
  if (fsm.cur === STATE.SHIP_SELECT) {
    /* 64×64 cards at y = VIEW_H/2 ± 32; three columns x ∈ {60,160,260} ± 32 */
    if (py > VIEW_H/2 - 32 && py < VIEW_H/2 + 32) {
      if (px > 28  && px < 92 ) return pickShipAndStart('A');
      if (px > 128 && px < 192) return pickShipAndStart('B');
      if (px > 228 && px < 292) return pickShipAndStart('C');
    }
    return;
  }
  if (fsm.cur === STATE.GAMEOVER) {
    /* restart fresh (clear stacks so retry = fresh roguelite) */
    runStartMs = null;
    playerStacks = Object.create(null);
    fsm.set(STATE.SHIP_SELECT);
    return;
  }
  if (fsm.cur === STATE.CHOICE) {
    /* 3 cards: 88×96 centered, gap 12 — match render() geometry */
    const cardW = 88, cardH = 96, gap = 12;
    const totalW = cardW * 3 + gap * 2;
    const startX = (VIEW_W - totalW) / 2;
    const cardY = VIEW_H / 2 - 40;
    if (py > cardY && py < cardY + cardH && px > startX && px < startX + totalW) {
      const idx = Math.floor((px - startX) / (cardW + gap));
      if (idx >= 0 && idx <= 2 && choiceOffer[idx]) {
        applyPickedUpgrade(idx);
        advanceStage();
        return;
      }
    }
    return;
  }
  /* STAGE_n: start drag bookkeeping */
  if (isStage(fsm.cur)) {
    InputState.dragId = e.pointerId;
    InputState.dragOrigin = { x: cx, y: cy };
    InputState.shipOrigin = { x: ship.x, y: ship.y };
    InputState.touchMoved = false;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== InputState.dragId) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX, cy = e.clientY;
  const dxCss = cx - InputState.dragOrigin.x;
  const dyCss = cy - InputState.dragOrigin.y;
  const distCss = Math.hypot(dxCss, dyCss);
  if (!InputState.touchMoved && distCss > DRAG_TOLERANCE_PX) {
    InputState.touchMoved = true;
  }
  if (InputState.touchMoved && ship) {
    /* convert CSS delta to internal-coord delta using canvas rect */
    const newX = InputState.shipOrigin.x + dxCss * VIEW_W / rect.width;
    const newY = InputState.shipOrigin.y + dyCss * VIEW_H / rect.height;
    InputState.targetX = clamp(newX, 8, VIEW_W - 8);
    InputState.targetY = clamp(newY, 8, VIEW_H - 8);
  }
});

function endDrag(e) {
  if (e.pointerId === InputState.dragId) {
    InputState.dragId = null;
    /* if never crossed tolerance, treat as tap (already handled in pointerdown) */
  }
}
canvas.addEventListener('pointerup',    endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* prevent iPad scroll/zoom */
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive:false });

/* keyboard proxy */
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup'    || k === 'w') { InputState.keys.up = true; e.preventDefault(); }
  if (k === 'arrowdown'  || k === 's') { InputState.keys.down = true; e.preventDefault(); }
  if (k === 'arrowleft'  || k === 'a') { InputState.keys.left = true; }
  if (k === 'arrowright' || k === 'd') { InputState.keys.right = true; }
  if (k === ' ')  { InputState.focus = !InputState.focus; e.preventDefault(); }
  if (k === 'shift') { InputState.bomb  = true; e.preventDefault(); }
  /* ship select via keyboard */
  if (fsm.cur === STATE.SHIP_SELECT) {
    if (k === 'a') pickShipAndStart('A');
    if (k === 'b') pickShipAndStart('B');
    if (k === 'c') pickShipAndStart('C');
  }
  if (fsm.cur === STATE.CHOICE) {
    /* S1-A: 1/2/3 keys pick a card (PLAN v2 #3 re-offer) */
    if (k === '1') { applyPickedUpgrade(0); advanceStage(); }
    else if (k === '2') { applyPickedUpgrade(1); advanceStage(); }
    else if (k === '3') { applyPickedUpgrade(2); advanceStage(); }
    else if (k === 'escape' || k === 'enter') {
      /* skip — also pick first card as default so it never deadlocks */
      applyPickedUpgrade(0);
      advanceStage();
    }
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup'    || k === 'w') InputState.keys.up    = false;
  if (k === 'arrowdown'  || k === 's') InputState.keys.down  = false;
  if (k === 'arrowleft'  || k === 'a') InputState.keys.left  = false;
  if (k === 'arrowright' || k === 'd') InputState.keys.right = false;
});

function pickShipAndStart(id) {
  pickShip(id);
  fsm.set(STATE.STAGE_1);
}

/* ---------- 8. TAB VISIBILITY (PLAN v2 #17) ---------- */
let runStartMs = null;
let pausedAtMs = null;        /* performance.now() when paused; null = not paused */
function shiftRunStartByPause() {
  /* PLAN v2 #17: resume MUST NOT replay lost time.
     shift runStartMs forward by the pause duration so HUD timer stays consistent. */
  if (pausedAtMs !== null && runStartMs !== null) {
    runStartMs += (performance.now() - pausedAtMs);
    pausedAtMs = null;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    /* pause iff in STAGE_n — don't pause TITLE/SHIP_SELECT/GAMEOVER/VICTORY/CHOICE */
    if (isStage(fsm.cur) && fsm.cur !== STATE.PAUSED) {
      pausedAtMs = performance.now();
      fsm.prev = fsm.cur;
      fsm.set(STATE.PAUSED);
      hudEl.paused.textContent = '⏸ hidden';
    }
  } else {
    /* resume iff PAUSED */
    if (fsm.cur === STATE.PAUSED) {
      const resumeTo = fsm.prev || STATE.STAGE_1;
      /* bypass fsm.set() to avoid onStateEnter reset wiping live bullets/enemies */
      fsm.cur = resumeTo;
      fsm.prev = STATE.PAUSED;
      shiftRunStartByPause();          /* freeze HUD timer across pause gap */
      hudEl.state.textContent = `STATE: ${resumeTo}`;
      hudEl.paused.textContent = '';
      console.log(`[FSM] PAUSED → ${resumeTo} @ ${(performance.now()/1000).toFixed(2)}s (no time replay)`);
    }
  }
});

/* ---------- 9. STAGE FLOW ---------- */
function advanceStage() {
  /* Called from CHOICE pick: go to next stage (or VICTORY if last boss defeated). */
  if (fsm.cur === STATE.CHOICE) {
    const next = lastStage + 1;
    if (next > STAGES.length) {
      fsm.set(STATE.VICTORY);
    } else {
      fsm.set(STAGES[next - 1]);
    }
    return;
  }
  /* other callers: linear from current STAGE_n */
  const idx = STAGES.indexOf(fsm.cur);
  if (idx >= 0 && idx < STAGES.length - 1) {
    fsm.set(STAGES[idx + 1]);
  } else if (idx === STAGES.length - 1) {
    fsm.set(STATE.VICTORY);
  } else {
    fsm.set(STATE.STAGE_1);
  }
}

/* ---------- 10. TICK (PLAN v2 #13 fixed 60 FPS) ---------- */
function tick(dtMs) {
  /* freeze during non-play states */
  if (!isStage(fsm.cur)) return;

  /* ---- ship movement (drag-first, then keys converge on target) ---- */
  let vx = 0, vy = 0;
  if (InputState.keys.left)  vx -= 1;
  if (InputState.keys.right) vx += 1;
  if (InputState.keys.up)    vy -= 1;
  if (InputState.keys.down)  vy += 1;
  if (vx || vy) {
    const len = Math.hypot(vx, vy);
    const step = ship.speed * (dtMs / 16.67);  /* ship.speed is per-frame @60fps */
    ship.x = clamp(ship.x + (vx/len) * step, 8, VIEW_W - 8);
    ship.y = clamp(ship.y + (vy/len) * step, 8, VIEW_H - 8);
    InputState.targetX = ship.x;
    InputState.targetY = ship.y;
  } else {
    /* smooth toward InputState.target (drag-set or last-keyframe) */
    ship.x += (InputState.targetX - ship.x) * 0.30;
    ship.y += (InputState.targetY - ship.y) * 0.30;
    /* hard clamp */
    ship.x = clamp(ship.x, 8, VIEW_W - 8);
    ship.y = clamp(ship.y, 8, VIEW_H - 8);
  }

  /* ---- autofire ---- */
  ship.fireCD -= dtMs;
  if (ship.fireCD <= 0) {
    bullets.push({ x: ship.x - 4, y: ship.y - 8, vx: 0, vy: -0.30, owner: 'player' });
    bullets.push({ x: ship.x + 4, y: ship.y - 8, vx: 0, vy: -0.30, owner: 'player' });
    ship.fireCD = 1000 / ship.fireRate;
  }

  /* ---- bomb trigger (PLAN v2 #7) ---- */
  if (InputState.bomb) {
    InputState.bomb = false;
    /* wipe enemy bullets only — S0 placeholder for i-frame via shield grace */
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (enemies[i].kind === 'bullet') enemies.splice(i, 1);
    }
    ship.shield = Math.max(ship.shield, 1);
  }

  /* ---- enemy update ---- */
  for (const e of enemies) {
    if (e.kind === 'spiral') {
      e.t += dtMs;
      /* figure-8 path */
      e.x = VIEW_W/2 + Math.cos(e.t / 600) * 80;
      e.y = 80       + Math.sin(e.t / 400) * 30;
      e.ang0 = e.t / 1000;
      /* fire 8-way every 1s */
      const sec = Math.floor(e.t / 1000);
      if (sec !== Math.floor((e.t - dtMs) / 1000)) {
        for (let i = 0; i < 8; i++) {
          const a = e.ang0 + i * (Math.PI * 2 / 8);
          enemies.push({
            kind: 'bullet',
            x: e.x, y: e.y,
            vx: Math.cos(a) * 0.06,
            vy: Math.sin(a) * 0.06,
          });
        }
      }
    } else if (e.kind === 'bullet') {
      e.x += e.vx * dtMs;
      e.y += e.vy * dtMs;
    }
  }

  /* ---- collision: player bullets vs spiral ---- */
  for (const e of enemies) {
    if (e.kind !== 'spiral') continue;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.owner !== 'player') continue;
      if (Math.abs(b.x - e.x) < 12 && Math.abs(b.y - e.y) < 12) {
        bullets.splice(i, 1);
        e.hp -= 1;
        if (e.hp <= 0) {
          console.log('[enemy] spiral defeated @', (performance.now()/1000).toFixed(2));
          /* STAGE 5 boss → VICTORY; others → CHOICE modal */
          if (lastStage >= STAGES.length) {
            fsm.set(STATE.VICTORY);
          } else {
            fsm.set(STATE.CHOICE);
          }
          return;
        }
        break;
      }
    }
  }

  /* ---- collision: enemy bullets vs ship ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.kind !== 'bullet') continue;
    if (Math.abs(e.x - ship.x) < 6 && Math.abs(e.y - ship.y) < 6) {
      enemies.splice(i, 1);
      if (ship.shield > 0) {
        ship.shield -= 1;
      } else {
        ship.hp -= 1;
        if (ship.hp <= 0) {
          console.log('[ship] destroyed');
          fsm.set(STATE.GAMEOVER);
          return;
        }
      }
    }
  }

  /* ---- cull off-screen ---- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.kind === 'bullet' && (e.x < -16 || e.x > VIEW_W + 16 || e.y < -16 || e.y > VIEW_H + 16)) {
      enemies.splice(i, 1);
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.y < -8 || b.y > VIEW_H + 8 || b.x < -8 || b.x > VIEW_W + 8) {
      bullets.splice(i, 1);
    }
  }

  /* ---- HUD ---- */
  hudEl.hp.textContent = `HP: ${ship.hp}  SHIELD: ${ship.shield}`;
}

/* ---------- 11. RENDER ---------- */
function render() {
  /* clear */
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  /* faint hex-grid background hint */
  ctx.strokeStyle = 'rgba(0,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= VIEW_W; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VIEW_H); ctx.stroke();
  }
  for (let y = 0; y <= VIEW_H; y += 32) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIEW_W, y); ctx.stroke();
  }

  /* non-play overlays */
  if (fsm.cur === STATE.PAUSED) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', VIEW_W/2, VIEW_H/2 - 8);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('(tab hidden — return to resume)', VIEW_W/2, VIEW_H/2 + 16);
    return;
  }

  if (fsm.cur === STATE.TITLE) {
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('末日救未來', VIEW_W/2, VIEW_H/2 - 24);
    ctx.font = '11px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Doomsday · Save · the · Future', VIEW_W/2, VIEW_H/2);
    ctx.fillText('v0.2.0 · S0 scaffold', VIEW_W/2, VIEW_H/2 + 18);
    ctx.fillText('→ TAP TO BEGIN ←', VIEW_W/2, VIEW_H - 64);
    return;
  }

  if (fsm.cur === STATE.SHIP_SELECT) {
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CHOOSE CHASSIS', VIEW_W/2, 56);
    const labels = [
      { id:'A', n:'速', sub:'fireRate 10' },
      { id:'B', n:'盾', sub:'shield 3' },
      { id:'C', n:'火', sub:'fireRate 6' },
    ];
    labels.forEach((lab, i) => {
      const x = 60 + i * 100;
      const y = VIEW_H/2;
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 32, y - 32, 64, 64);
      ctx.fillStyle = '#0ff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(lab.id, x, y - 4);
      ctx.font = '12px monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText(lab.n + ' · ' + lab.sub, x, y + 44);
    });
    ctx.fillStyle = '#ff6';
    ctx.font = '12px monospace';
    ctx.fillText('A / B / C key or tap card', VIEW_W/2, VIEW_H - 64);
    return;
  }

  if (fsm.cur === STATE.GAMEOVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#f06';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', VIEW_W/2, VIEW_H/2 - 8);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Tap to retry', VIEW_W/2, VIEW_H/2 + 16);
    return;
  }

  if (fsm.cur === STATE.VICTORY) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#0f6';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('VICTORY', VIEW_W/2, VIEW_H/2 - 8);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('escaped · ' + ((performance.now() - runStartMs)/1000).toFixed(1) + 's', VIEW_W/2, VIEW_H/2 + 16);
    return;
  }

  if (fsm.cur === STATE.CHOICE) {
    /* 3-card CHOICE modal (S1-A, PLAN v2 §CHOICE) */
    const cardW = 88, cardH = 96, gap = 12;
    const totalW = cardW * 3 + gap * 2;
    const startX = (VIEW_W - totalW) / 2;
    const cardY = VIEW_H / 2 - 40;
    /* backdrop */
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    /* header */
    ctx.fillStyle = '#ff6';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CHOICE — pick an upgrade', VIEW_W/2, cardY - 16);
    for (let i = 0; i < 3; i++) {
      const up = choiceOffer[i];
      const x = startX + i * (cardW + gap);
      const y = cardY;
      ctx.fillStyle = 'rgba(0,40,60,0.9)';
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, cardW, cardH);
      ctx.fillStyle = '#fff';
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(up.icon, x + cardW/2, y + 30);
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = '#0ff';
      ctx.fillText(up.nameZh, x + cardW/2, y + 50);
      ctx.font = '9px monospace';
      ctx.fillStyle = '#aaa';
      const descLines = up.desc.match(/.{1,12}/g) || [up.desc];
      for (let li = 0; li < Math.min(descLines.length, 3); li++) {
        ctx.fillText(descLines[li], x + cardW/2, y + 64 + li * 10);
      }
      const n = playerStacks[up.id] || 0;
      if (n > 0) {
        ctx.fillStyle = '#0f6';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`x${n}`, x + cardW - 6, y + 12);
      }
      ctx.fillStyle = '#ff6';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`[${i+1}] tap`, x + cardW/2, y + cardH - 6);
    }
    return;
  }

  /* ---- gameplay render ---- */
  /* bullets */
  for (const b of bullets) {
    if (b.owner === 'player') {
      ctx.fillStyle = '#0ff';
      ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
    }
  }
  /* enemies */
  for (const e of enemies) {
    if (e.kind === 'bullet') {
      ctx.fillStyle = '#f6c';
      ctx.fillRect(e.x - 2, e.y - 2, 4, 4);
    } else if (e.kind === 'spiral') {
      ctx.fillStyle = '#f06';
      ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f06';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(e.x, e.y, 16, 0, Math.PI * 2); ctx.stroke();
      /* S1-A: HP bar above boss for visibility */
      const hpFrac = Math.max(0, e.hp / STAGE_TABLE[e.stage || lastStage].bossHp);
      ctx.fillStyle = '#300';
      ctx.fillRect(e.x - 16, e.y - 22, 32, 3);
      ctx.fillStyle = hpFrac > 0.5 ? '#0f6' : (hpFrac > 0.25 ? '#ff6' : '#f06');
      ctx.fillRect(e.x - 16, e.y - 22, 32 * hpFrac, 3);
      if (e.label) {
        ctx.fillStyle = '#fff';
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y + 28);
      }
    }
  }
  /* ship */
  if (ship) {
    if (ship.shield > 0) {
      ctx.strokeStyle = 'rgba(0,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 11, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.moveTo(ship.x, ship.y - 8);
    ctx.lineTo(ship.x - 6, ship.y + 6);
    ctx.lineTo(ship.x + 6, ship.y + 6);
    ctx.closePath();
    ctx.fill();
    /* engine flame */
    ctx.fillStyle = '#ff6';
    ctx.fillRect(ship.x - 2, ship.y + 6, 4, 4 + (Math.sin(performance.now() / 50) * 2));
  }
}

/* ---------- 12. LOOP (PLAN v2 #13 fixed-timestep accumulator) ---------- */
let lastFrame = performance.now();
let accMs = 0;
function loop(nowMs) {
  let dt = nowMs - lastFrame;
  if (dt > MAX_FRAME_MS) dt = MAX_FRAME_MS;       /* cap huge gap (e.g., un-blur) */
  lastFrame = nowMs;
  accMs += dt;
  while (accMs >= FIXED_DT_MS) {
    tick(FIXED_DT_MS);
    accMs -= FIXED_DT_MS;
  }
  /* HUD timer (only count during STAGE_n; PAUSED freezes runStartMs) */
  if (isStage(fsm.cur) && runStartMs) {
    const sec = (nowMs - runStartMs) / 1000;
    hudEl.time.textContent = `TIME: ${sec.toFixed(1)}s`;
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 13. INIT ---------- */
hudEl.state.textContent = `STATE: ${fsm.cur}`;
console.log('[init] PLAN v2 S0 scaffold loaded');
console.log('[init] FSM cur =', fsm.cur);
console.log('[init] viewport =', window.innerWidth, 'x', window.innerHeight, 'dpr =', window.devicePixelRatio);
hudEl.tip.textContent = 'tap canvas to begin';
requestAnimationFrame(loop);

/* Expose for browser smoke test (console: window.__dsf.fsm.cur) */
window.__dsf = { fsm, ship, bullets, enemies, shipS: SHIPS, stageS: STATE, InputState };
</script>
